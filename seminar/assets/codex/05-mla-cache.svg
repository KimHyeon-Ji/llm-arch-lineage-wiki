<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" width="1440" height="650"><rect width="100%" height="100%" fill="white"/><text x="36" y="47" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="28" font-weight="700" fill="#6b50cc" text-anchor="start">MLA는 head별 K·V 대신 공통 latent와 위치 key를 저장한다</text><text x="50" y="113" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#68728a" text-anchor="start">비교를 위한 가상 MHA: 128 KV heads × 128차원 × K/V</text><rect x="50" y="145" width="1260" height="64" rx="5" fill="#e6f1e9" stroke="#4b9b62" stroke-width="1.5"/><rect x="50" y="145" width="630" height="64" rx="5" fill="#f6e5ef" stroke="#c44898" stroke-width="1.5"/><text x="366" y="185" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="21" font-weight="700" fill="#c44898" text-anchor="middle">K = 16,384</text><text x="996" y="185" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="21" font-weight="700" fill="#4b9b62" text-anchor="middle">V = 16,384</text><text x="1340" y="184" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#68728a" text-anchor="start">32,768</text><text x="50" y="290" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="20" font-weight="400" fill="#68728a" text-anchor="start">DeepSeek-V3 MLA cache: c_KV 512 + k_R 64</text><rect x="50" y="326" width="22.15" height="64" rx="2" fill="#d5962b" stroke="#d5962b" stroke-width="1.5"/><text x="93" y="367" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#31394c" text-anchor="start">576 values / token / layer — 같은 눈금, 약 57배 작음</text><text x="50" y="448" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#68728a" text-anchor="start">MLA 막대만 확대 (내부 구성 512 : 64 = 8 : 1)</text><rect x="50" y="467" width="213" height="45" rx="4" fill="#f8efd9" stroke="#d5962b" stroke-width="1.5"/><rect x="263" y="467" width="27" height="45" rx="4" fill="#f6e5ef" stroke="#c44898" stroke-width="1.5"/><text x="156" y="496" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" font-weight="700" fill="#d5962b" text-anchor="middle">c_KV 512</text><text x="310" y="497" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#c44898" text-anchor="start">k_R 64</text><text x="50" y="552" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#31394c" text-anchor="start">c_KV에서 head별 content K·V를 계산하지만, 그 전체를 cache에 펼쳐 저장하지 않는다.</text><rect x="36" y="557" width="1368" height="48" rx="8" fill="#f7f8fc" stroke="#d8dce8" stroke-width="1"/><text x="56" y="588" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#68728a" text-anchor="start">상단 두 막대는 값 수에 비례. MHA는 동일 128×128 KV head의 가상 비교이며 dtype·quantization을 반영한 bytes가 아니다.</text></svg>