<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 700" width="1560" height="700"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">점수 계산을 텐서로 놓고 보면 — MHA와 MLA</text><rect x="1250" y="26" width="30" height="12" rx="3" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><rect x="1244" y="32" width="30" height="12" rx="3" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="1292" y="42" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">겹친 장 = 헤드 (128개)</text><text x="40" y="180" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="700" fill="#343a4d">MHA</text><text x="40" y="206" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">헤드마다 따로</text><rect x="244" y="144" width="39.68" height="16" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><rect x="237" y="151" width="39.68" height="16" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><rect x="230" y="158" width="39.68" height="16" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="256.84000000000003" y="212" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">q  1 × 128</text><text x="256.84000000000003" y="234" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">× 128 헤드</text><text x="330" y="176" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="30" text-anchor="middle" font-weight="400" fill="#34