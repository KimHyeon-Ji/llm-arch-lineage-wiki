<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 740" width="1560" height="740"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">펴서 비교 — 정의식을 그대로 실행 (naive)</text><rect x="330" y="80" width="220" height="120" rx="5" fill="#fdefd8" stroke="#d18a1c" stroke-width="1.8"/><text x="440.0" y="146" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">c_KVᵀ</text><text x="566" y="132" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">캐시  512 × S</text><text x="566" y="154" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">한 장</text><line x1="440.0" y1="206" x2="440.0" y2="256" stroke="#c2479c" stroke-width="2.2" marker-end="url(#ah)"/><text x="456.0" y="236" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#c2479c">× W_UK   헤드마다 · S줄 전부</text><rect x="344" y="270" width="220" height="30" rx="5" fill="#f8e6f1" stroke="#c2479c" stroke-width="1.8"/><rect x="337" y="277" width="220" height="30" rx="5" fill="#f8e6f1" stroke="#c2479c" stroke-width="1.8"/><rect x="330" y="284" width="220" height="30" rx="5" fill="#f8e6f1" stroke="#c2479c" stroke-width="1.8"/><text x="440.0" y="305" font-family="Consolas,'Courier New',monospace" font-size="17" text-anchor="middle" font-weight="400" fill="#343a4d">Kᵀ</text><text x="447.0" y="342" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">128 × S</text><text x="447.0" y="364" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#c2479c">× 128장</text><rect x="228" y="278" width="44" height="14" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><rect x="221" y="285" width="44" height="14" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><rect x="214" y="292" width="44" height="14" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="243.0" y="342" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">q  1 × 128</text><text x="243.0" y="364" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">× 128 헤드</text><text x="300" y="306" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="30" text-anchor="middle" font-weight="400" fill="#343a4d">·</text><text x="60" y="404" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#c2479c">매 스텝, 캐시 S줄을 헤드 128개의 K로 편다</text><line x1="780" y1="30" x2="780" y2="430" stroke="#d3d6e2" stroke-width="2" stroke-dasharray="6 6"/><text x="830" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">쿼리를 옮겨서 비교 — 실제 추론 (absorb)</text><rect x="854" y="156" width="44" height="14" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><rect x="847" y="163" width="44" height="14" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><rect x="840" y="170" width="44" height="14" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="869.0" y="220" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">q_C  1 × 128</text><text x="869.0" y="242" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">× 128 