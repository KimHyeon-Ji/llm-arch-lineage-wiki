398" width="30" height="12" rx="3" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><rect x="1290" y="404" width="30" height="12" rx="3" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="1338" y="414" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">겹친 장 = 헤드 (128개)</text><rect x="40" y="450" width="1480" height="270" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="184" y="500" font-family="Consolas,'Courier New',monospace" font-size="24" text-anchor="start" font-weight="700" fill="#343a4d">q_C · k_Cᵀ</text><text x="346" y="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#7b8196">원래의 점수</text><rect x="784" y="470" width="300" height="46" rx="8" fill="#f8e6f1" stroke="#c2479c" stroke-width="2.5"/><text x="934" y="501" font-family="Consolas,'Courier New',monospace" font-size="23" text-anchor="middle" font-weight="700" fill="#a8327f">k_C = c · W_UK</text><text x="1100" y="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#7b8196">키는 캐시의 c에서 만들어진다</text><text x="150" y="552" font-family="Consolas,'Courier New',monospace" font-size="24" text-anchor="start" font-weight="700" fill="#343a4d">= q_C · (c · W_UK)ᵀ</text><text x="784" y="552" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#7b8196">k_C 자리에 넣는다</text><text x="150" y="604" font-family="Consolas,'Courier New',monospace" font-size="24" text-anchor="start" font-weight="700" fill="#343a4d">= q_C · W_UKᵀ · cᵀ</text><text x="784" y="604" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#7b8196">전치하면 곱의 순서가 뒤집힌다   (A · B)ᵀ = Bᵀ · Aᵀ</text><text x="150" y="656" font-family="Consolas,'Courier New',monospace" font-size="24" text-anchor="start" font-weight="700" fill="#343a4d">= (q_C · W_UKᵀ) · cᵀ  =  q̃ · cᵀ</text><text x="784" y="656" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#7b8196">앞의 둘을 먼저 곱한다 (결합 법칙)</text><text x="150" y="700" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#7b8196">값은 그대로다. 곱하는 순서만 바뀌었다.    전체 점수 = q̃ · cᵀ + q_R · k_Rᵀ (RoPE 64차원 몫)</text></svg>