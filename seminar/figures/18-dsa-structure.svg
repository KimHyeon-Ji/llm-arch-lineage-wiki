<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 620" width="1560" height="620"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">DSA의 구조 — 고르는 길과 보는 길 (DeepSeek-V3.2)</text><rect x="40" y="250" width="90" height="50" rx="6" fill="#eff0f6" stroke="#d3d6e2" stroke-width="2"/><text x="85.0" y="282.0" font-family="Consolas,'Courier New',monospace" font-size="20" text-anchor="middle" font-weight="400" fill="#343a4d">h_t</text><text x="85.0" y="324" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">지금 토큰</text><text x="210" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#3b7dd8">고르는 길 — lightning indexer</text><path d="M134,262 C170,262 170,152 206,152" fill="none" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="210" y="126" width="190" height="52" rx="6" fill="#e2eefc" stroke="#3b7dd8" stroke-width="2"/><text x="305.0" y="158.3" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">색인 쿼리</text><text x="305.0" y="202" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">64 헤드 × 128</text><text x="428" y="162" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="30" text-anchor="middle" font-weight="400" fill="#343a4d">·</text><rect x="456" y="116" width="330" height="72" rx="6" fill="#e2eefc" stroke="#3b7dd8" stroke-width="2"/><text x="621.0" y="158.3" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="mid