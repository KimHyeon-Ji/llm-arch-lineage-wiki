xt><text x="210" y="340" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#b87410">보는 길 — MLA attention</text><path d="M134,288 C170,288 170,402 206,402" fill="none" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="210" y="376" width="190" height="52" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="2"/><text x="305.0" y="408.3" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">쿼리 q̃</text><text x="305.0" y="452" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">128 헤드 × ( 512 + 64 )</text><rect x="456" y="366" width="330" height="72" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="2"/><text x="621.0" y="408.3" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">MLA 캐시</text><text x="621.0" y="462" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">S × ( 512 + 64 )</text><line x1="790" y1="402" x2="846" y2="402" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="850" y="376" width="250" height="52" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="2"/><text x="975.0" y="408.3" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">고른 k줄만</text><text x="975.0" y="452" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">k × ( 512 + 64 )</text><line x1="1104" y1="402" x2="1166" y2="402" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1170" y="376" width="150" height="52" rx="6" fill="#eff0f6" stroke="#d3d6e2" stroke-width="2"/><text x="1245.0" y="408.3" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">attention</text><line x1="1324" y1="402" x2="1376" y2="402" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1380" y="376" width="80" height="52" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="2"/><text x="1420.0" y="409.0" font-family="Consolas,'Courier New',monospace" font-size="20" text-anchor="middle" font-weight="400" fill="#343a4d">o</text><path d="M404,402 C440,402 424,522 560,522 L1150,522 C1230,522 1245,500 1245,436" fill="none" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="855" y="510" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">쿼리는 고른 k줄하고만 곱한다</text><path d="M1268,212 C1268,300 975,290 975,370" fill="none" stroke="#5d6377" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#ah)"/><text x="1282" y="268" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#7b8196">위치만 넘겨준다</text><text x="40" y="566" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#343a4d">새 토큰이 오면 두 캐시에 각각 한 줄씩 쓴다.  출력을 만드는 것은 아래 길뿐이고, 위 길은 어디를 볼지만 정한다.</text><text x="40" y="596" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">점수  I(t,s) = Σ_h w_h · ReLU( q_h · k_s )   —  w_h는 지금 토큰에서 나오는 헤드별 가중치</text></svg>