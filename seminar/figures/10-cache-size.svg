nt-weight="400" fill="#7b8196">길이</text><text x="620" y="130" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="middle" font-weight="400" fill="#7b8196">×</text><rect x="642" y="90" width="150" height="60" rx="6" fill="#f8e6f1" stroke="#c2479c" stroke-width="2"/><text x="717.0" y="129.1" font-family="Consolas,'Courier New',monospace" font-size="26" text-anchor="middle" font-weight="400" fill="#343a4d">8</text><text x="717" y="178" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">KV 헤드  n_kv</text><text x="814" y="130" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="middle" font-weight="400" fill="#7b8196">×</text><rect x="836" y="90" width="150" height="60" rx="6" fill="#e4f0e4" stroke="#4d9a56" stroke-width="2"/><text x="911.0" y="129.1" font-family="Consolas,'Courier New',monospace" font-size="26" text-anchor="middle" font-weight="400" fill="#343a4d">128</text><text x="911" y="178" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">헤드 차원  d_h</text><text x="1008" y="130" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="middle" font-weight="400" fill="#7b8196">×</text><rect x="1030" y="90" width="150" height="60" rx="6" fill="#eff0f6" stroke="#d3d6e2" stroke-width="2"/><text x="1105.0" y="129.1" font-family="Consolas,'Courier New',monospace" font-size="26" text-anchor="middle" font-weight="400" fill="#343a4d">2 B</text><text x="1105" y="178" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">BF16</text><text x="1234" y="130" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="600" fill="#343a4d">×  요청 수</text><text x="60" y="240" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">토큰 하나</text><text x="220" y="240" font-family="Consolas,'Courier New',monospace" font-size="19" text-anchor="start" font-weight="400" fill="#343a4d">2 × 80 × 8 × 128 × 2 B  =  327,680 B  =  320 KiB</text><text x="60" y="278" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">32K 대화 하나</text><text x="220" y="278" font-family="Consolas,'Courier New',monospace" font-size="19" text-anchor="start" font-weight="400" fill="#343a4d">320 KiB × 32,768 토큰  =  10 GiB</text><text x="60" y="336" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">80 GB GPU 한 장 (= 74.5 GiB)</text><rect x="60" y="350" width="1440" height="70" rx="8" fill="#f4f5f9" stroke="#b9bdcc" stroke-width="2"/><rect x="63.0" y="356" width="187.28859060402684" height="58" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="156.6442953020134" y="392" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">32K 대화</text><rect x="256.2885906040268" y="356" width="187.28859060402684" height="58" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="349.93288590604027" y="392" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">32K 대화</text><rect x="449.5771812080537" y="356" width="187.28859060402684" height="58" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="543.2214765100671" y="392" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">32K 대화</text><rect x="642.8657718120805" y="356" width="187.28859060402684" height="58" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="736.510067114094" y="392" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">32K 대화</text><rect x="836.1543624161073" y="356" width="187.28859060402684" height="58" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="929.7986577181208" y="392" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">32K 대화</text><rect x="1029.4429530201342" y="356" width="187.28859060402684" height="58" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="1123.0872483221476" y="392" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">32K 대화</text><rect x="1222.731543624161" y="356" width="187.28859060402684" height="58" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="1316.3758389261745" y="392" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">32K 대화</text><text x="1456.510067114094" y="392" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">4.5 GiB</text><text x="60" y="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#343a4d">가중치를 하나도 올리지 않아도 32K 대화 일곱 개에서 찬다.</text><text x="60" y="492" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#7b8196">이 숫자는 이미 GQA로 8배 줄인 것이다. MHA(KV 헤드 64)였다면 대화 하나가 80 GiB.</text></svg>