ight="700" fill="#343a4d">토큰 1 ~ 3은 압축 대기로 들고 있다가, 4번째가 오면 4개를 묶어 엔트리 하나를 KV cache에 붙인다.</text><text x="64" y="586" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">최근 128토큰 창에는 매 토큰 들어가고, 가장 오래된 것이 빠진다.  HCA도 같은 방식이고, 128개가 모일 때마다 엔트리 하나다.</text></svg>