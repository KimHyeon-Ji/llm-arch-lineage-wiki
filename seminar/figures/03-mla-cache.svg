MLA</text><rect x="130" y="494" width="20.3125" height="30" rx="2" fill="#e0a030" stroke="#d18a1c" stroke-width="2"/><rect x="150.3125" y="494" width="2.5390625" height="30" rx="2" fill="#c2479c" stroke="#c2479c" stroke-width="2"/><text x="168.8515625" y="515" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">576  =  c_KV 512 + k_R 64</text><text x="40" y="580" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#7b8196">막대 길이는 실제 비율이다.  같은 헤드 구성(128 헤드 · 헤드 차원 128)의 MHA와 비교.</text></svg>