<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 600" width="1560" height="600"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">verify의 입력과 출력은 한 칸씩 어긋나 있다</text><text x="40" y="150" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">target에 넣는 5개</text><text x="40" y="360" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">자리마다 고른</text><text x="40" y="384" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">다음 토큰</text><rect x="360" y="120" width="150" height="46" rx="6" fill="#ffffff" stroke="#7b8196" stroke-width="2" stroke-dasharray="6 4"/><text x="435.0" y="149.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">on</text><text x="435.0" y="108" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">자리 0</text><rect x="560" y="120" width="150" height="46" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="635.0" y="149.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><text x="635.0" y="108" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">자리 1</text><rect x="760" y="120" width="150" height="46" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="835.0" y="149.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">mat</text><text x="835.0" y="108" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">자리 2</text><rect x="960" y="120" width="150" height="46" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1035.0" y="149.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">and</text><text x="1035.0" y="108" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">자리 3</text><rect x="1160" y="120" width="150" height="46" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1235.0" y="149.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">slept</text><text x="1235.0" y="108" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">자리 4</text><rect x="360" y="330" width="150" height="46" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="435.0" y="359.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><line x1="445.0" y1="328" x2="625.0" y2="170" stroke="#4d9a56" stroke-width="2.5" marker-end="url(#ah)"/><text x="435.0" y="404" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#4d9a56">✓ d1과 같다</text><rect x="560" y="330" width="150" height="46" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="635.0" y="359.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">mat</text><line x1="645.0" y1="328" x2="825.0" y2="170" stroke="#4d9a56" stroke-width="2.5" marker-end="url(#ah)"/><text x="635.0" y="404" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#4d9a56">✓ d2와 같다</text><rect x="760" y="330" width="150" height="46" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="835.0" y="359.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">.</text><line x1="845.0" y1="328" x2="1025.0" y2="170" stroke="#c2479c" stroke-width="2.5" marker-end="url(#ah)"/><text x="835.0" y="404" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#c2479c">✗ d3과 다르다</text><rect x="960" y="330" width="150" height="46" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="1035.0" y="359.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">…</text><line x1="1045.0" y1="328" x2="1225.0" y2="170" stroke="#b9bdcc" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="1035.0" y="404" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">보지 않는다</text><rect x="1160" y="330" width="150" height="46" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="1235.0" y="359.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">…</text><rect x="350" y="214" width="970" height="56" rx="8" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="835.0" y="249" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">target forward 1번 — 다섯 자리 모두 '여기까지 보고 다음 토큰'을 고른다</text><text x="1235.0" y="404" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">비교할 초안이 없다</text><text x="1235.0" y="426" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">다 맞으면 보너스 토큰</text><rect x="40" y="492" width="1480" height="80" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="525" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">자리 i의 출력은 '자리 i까지 보고 고른 다음 토큰'이다. 그래서 바로 다음 칸(자리 i+1)의 초안과 비교한다.</text><text x="64" y="554" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">화살표는 비교하는 짝이다. 자리 2에서 target은 '.'을 골랐고 초안은 'and'였다 — 여기서 멈춘다.</text></svg>