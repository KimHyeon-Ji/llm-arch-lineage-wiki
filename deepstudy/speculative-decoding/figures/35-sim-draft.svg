<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 520" width="1560" height="520"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">③ draft 비용 — 갱신 패스(직전 a + 1줄) + 직렬 초안, 그래서 스텝마다 바뀐다</text><text x="40" y="132" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">EAGLE-3 · MTP (γ = 3)</text><text x="40" y="154" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">직전 a = 0 → 갱신 1줄</text><rect x="330" y="110" width="76" height="50" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="1.5"/><text x="368.0" y="132" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#d18a1c">갱신</text><text x="368.0" y="150" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#d18a1c">1줄</text><rect x="412" y="110" width="70" height="50" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="447.0" y="139.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">초안 1</text><rect x="488" y="110" width="70" height="50" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="523.0" y="139.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">초안 2</text><rect x="564" y="110" width="70" height="50" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="599.0" y="139.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">초안 3</text><rect x="646" y="110" width="360" height="50" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="1.5"/><text x="826" y="141" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#eb6834">verify (target)</text><text x="40" y="232" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">EAGLE-3 · MTP (γ = 3)</text><text x="40" y="254" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">직전 a = 3 → 갱신 4줄</text><rect x="330" y="210" width="154" height="50" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="1.5"/><text x="407.0" y="232" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#d18a1c">갱신</text><text x="407.0" y="250" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#d18a1c">4줄</text><rect x="490" y="210" width="70" height="50" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="525.0" y="239.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">초안 1</text><rect x="566" y="210" width="70" height="50" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="601.0" y="239.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">초안 2</text><rect x="642" y="210" width="70" height="50" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="677.0" y="239.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">초안 3</text><rect x="724" y="210" width="360" height="50" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="1.5"/><text x="904" y="241" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#eb6834">verify (target)</text><text x="40" y="332" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">DSpark (블록 5칸)</text><text x="40" y="354" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">직전 a = 2 → 투영 3줄</text><rect x="330" y="310" width="128" height="50" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="1.5"/><text x="394.0" y="332" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#d18a1c">투영</text><text x="394.0" y="350" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#d18a1c">3줄</text><rect x="464" y="310" width="150" height="50" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="539.0" y="339.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">블록 1번 → 5칸</text><rect x="620" y="310" width="60" height="50" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="650.0" y="339.2" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#343a4d">보정</text><rect x="692" y="310" width="360" height="50" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="1.5"/><text x="872" y="341" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#eb6834">verify (target)</text><text x="330" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#7b8196">draft 시간 ─────────────▶</text><text x="1180" y="140" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">draft 시간을 바꾸는 것</text><text x="1190" y="170" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">• 배치 B</text><text x="1190" y="196" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">• γ (트리는 깊이 · topk)</text><text x="1190" y="222" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">• 직전 채택 수 a</text><text x="1190" y="248" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">• drafter 문맥 길이</text><text x="1180" y="300" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#7b8196">갱신 · 투영 패스가 첫 초안도 낸다</text><rect x="40" y="420" width="1480" height="80" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="453" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">draft 시간은 상수가 아니다 — 갱신 패스의 줄 수가 직전 스텝의 채택 수를 따라 바뀐다</text><text x="64" y="482" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">ET에 drafter op로 넣거나, 루프라인으로 계산해 ET 앞에 노드 하나로 넣는다 (GPU 시간으로, 커널 바닥 시간 · 통신 포함)</text></svg>