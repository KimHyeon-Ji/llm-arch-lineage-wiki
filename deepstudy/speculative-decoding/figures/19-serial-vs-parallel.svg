<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 620" width="1560" height="620"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">순차 초안과 병렬 초안 — forward를 몇 번 도나</text><text x="40" y="104" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">순차 — 초안 하나에 forward 한 번</text><rect x="60" y="128" width="80" height="40" rx="6" fill="#ffffff" stroke="#7b8196" stroke-width="2" stroke-dasharray="6 4"/><text x="100.0" y="153.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">on</text><line x1="143" y1="148" x2="159" y2="148" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="162" y="130" width="50" height="36" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="187.0" y="152.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#343a4d">1층</text><line x1="215" y1="148" x2="231" y2="148" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="234" y="128" width="80" height="40" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="274.0" y="153.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><line x1="317" y1="148" x2="333" y2="148" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="336" y="130" width="50" height="36" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="361.0" y="152.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#343a4d">1층</text><line x1="389" y1="148" x2="405" y2="148" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="408" y="128" width="80" height="40" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="448.0" y="153.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">mat</text><line x1="491" y1="148" x2="507" y2="148" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="510" y="130" width="50" height="36" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="535.0" y="152.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#343a4d">1층</text><line x1="563" y1="148" x2="579" y2="148" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="582" y="128" width="80" height="40" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="622.0" y="153.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">and</text><line x1="665" y1="148" x2="681" y2="148" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="684" y="130" width="50" height="36" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="709.0" y="152.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#343a4d">1층</text><line x1="737" y1="148" x2="753" y2="148" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="756" y="128" width="80" height="40" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="796.0" y="153.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">slept</text><text x="60" y="200" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">앞에서 뽑은 토큰을 다음 스텝의 입력으로 넣는다. 그래서 차례로 돌 수밖에 없다</text><text x="40" y="262" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">병렬 — 블록 전체에 forward 한 번</text><rect x="60" y="286" width="116" height="38" rx="6" fill="#ffffff" stroke="#7b8196" stroke-width="2" stroke-dasharray="6 4"/><text x="118.0" y="310.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">on</text><line x1="118" y1="327" x2="118" y2="343" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="190" y="286" width="116" height="38" rx="6" fill="#eff0f6" stroke="#c9cddb" stroke-width="2"/><text x="248.0" y="310.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">[M]</text><line x1="248" y1="327" x2="248" y2="343" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="320" y="286" width="116" height="38" rx="6" fill="#eff0f6" stroke="#c9cddb" stroke-width="2"/><text x="378.0" y="310.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">[M]</text><line x1="378" y1="327" x2="378" y2="343" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="450" y="286" width="116" height="38" rx="6" fill="#eff0f6" stroke="#c9cddb" stroke-width="2"/><text x="508.0" y="310.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">[M]</text><line x1="508" y1="327" x2="508" y2="343" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="580" y="286" width="116" height="38" rx="6" fill="#eff0f6" stroke="#c9cddb" stroke-width="2"/><text x="638.0" y="310.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">[M]</text><line x1="638" y1="327" x2="638" y2="343" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="60" y="346" width="636" height="42" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="378.0" y="372.25" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">draft 층 여러 개 — 블록 안의 자리들은 서로를 다 본다</text><line x1="248" y1="391" x2="248" y2="407" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="190" y="410" width="116" height="38" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="248.0" y="434.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><line x1="378" y1="391" x2="378" y2="407" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="320" y="410" width="116" height="38" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="378.0" y="434.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">mat</text><line x1="508" y1="391" x2="508" y2="407" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="450" y="410" width="116" height="38" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="508.0" y="434.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">and</text><line x1="638" y1="391" x2="638" y2="407" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="580" y="410" width="116" height="38" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="638.0" y="434.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">slept</text><text x="60" y="474" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">[M]은 '여기를 채워라'는 빈칸 표시(마스크 토큰)다. 네 자리를 동시에 채운다</text><rect x="840" y="90" width="680" height="400" rx="10" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><text x="860" y="126" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">초안 4개를 만드는 시간</text><text x="860" y="176" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="600" fill="#343a4d">순차</text><rect x="930" y="158" width="64" height="28" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><rect x="1000" y="158" width="64" height="28" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><rect x="1070" y="158" width="64" height="28" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><rect x="1140" y="158" width="64" height="28" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><text x="930" y="214" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">1층 × 4번 — 초안이 늘면 그만큼 는다</text><text x="860" y="276" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="600" fill="#343a4d">병렬</text><rect x="930" y="258" width="130" height="28" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><text x="930" y="314" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">여러 층 × 1번 — 초안이 늘어도 거의 그대로</text><text x="860" y="370" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• 병렬은 한 번이 길다 (층이 더 많다)</text><text x="860" y="398" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• 그래도 초안을 길게 뽑을수록 순차보다 유리하다</text><text x="860" y="426" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• 대신 뒤 자리는 앞 자리에 무엇이 뽑혔는지 모르고 고른다</text><rect x="40" y="510" width="1480" height="80" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="543" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">순차는 초안 하나에 forward 한 번, 병렬은 블록 전체에 forward 한 번이다.</text><text x="64" y="572" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">병렬의 약점은 자리끼리의 의존이다 — 'New York' / 'San Francisco'가 반반이면 'New Francisco'가 나올 수 있다.</text></svg>