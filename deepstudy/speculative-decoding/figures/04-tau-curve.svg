<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 580" width="1560" height="580"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">초안을 길게 뽑아도 τ는 1 / (1 − α) 에서 멈춘다</text><line x1="100" y1="480.0" x2="920" y2="480.0" stroke="#e6e8f1" stroke-width="1"/><text x="90" y="485.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="end" font-weight="400" fill="#7b8196">0</text><line x1="100" y1="404.0" x2="920" y2="404.0" stroke="#e6e8f1" stroke-width="1"/><text x="90" y="409.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="end" font-weight="400" fill="#7b8196">2</text><line x1="100" y1="328.0" x2="920" y2="328.0" stroke="#e6e8f1" stroke-width="1"/><text x="90" y="333.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="end" font-weight="400" fill="#7b8196">4</text><line x1="100" y1="252.0" x2="920" y2="252.0" stroke="#e6e8f1" stroke-width="1"/><text x="90" y="257.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="end" font-weight="400" fill="#7b8196">6</text><line x1="100" y1="176.0" x2="920" y2="176.0" stroke="#e6e8f1" stroke-width="1"/><text x="90" y="181.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="end" font-weight="400" fill="#7b8196">8</text><line x1="100" y1="100.0" x2="920" y2="100.0" stroke="#e6e8f1" stroke-width="1"/><text x="90" y="105.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="end" font-weight="400" fill="#7b8196">10</text><line x1="100" y1="480" x2="920" y2="480" stroke="#8b90a3" stroke-width="1.5"/><line x1="151.25" y1="480" x2="151.25" y2="485" stroke="#8b90a3" stroke-width="1.5"/><text x="151.25" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">1</text><line x1="202.5" y1="480" x2="202.5" y2="485" stroke="#8b90a3" stroke-width="1.5"/><text x="202.5" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">2</text><line x1="305.0" y1="480" x2="305.0" y2="485" stroke="#8b90a3" stroke-width="1.5"/><text x="305.0" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">4</text><line x1="407.5" y1="480" x2="407.5" y2="485" stroke="#8b90a3" stroke-width="1.5"/><text x="407.5" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">6</text><line x1="510.0" y1="480" x2="510.0" y2="485" stroke="#8b90a3" stroke-width="1.5"/><text x="510.0" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">8</text><line x1="612.5" y1="480" x2="612.5" y2="485" stroke="#8b90a3" stroke-width="1.5"/><text x="612.5" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">10</text><line x1="715.0" y1="480" x2="715.0" y2="485" stroke="#8b90a3" stroke-width="1.5"/><text x="715.0" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">12</text><line x1="817.5" y1="480" x2="817.5" y2="485" stroke="#8b90a3" stroke-width="1.5"/><text x="817.5" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">14</text><line x1="920.0" y1="480" x2="920.0" y2="485" stroke="#8b90a3" stroke-width="1.5"/><text x="920.0" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">16</text><text x="510.0" y="532" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">γ — 한 번에 뽑는 초안 토큰 수</text><text x="56" y="84" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">τ — 사이클 한 번에 확정되는 토큰 수</text><polyline points="100.0,442.0 151.2,404.0 202.5,366.0 253.8,328.0 305.0,290.0 356.2,252.0 407.5,214.0 458.8,176.0 510.0,138.0 561.2,100.0" fill="none" stroke="#8b90a3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><text x="422.875" y="138.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="end" font-weight="400" fill="#7b8196">α = 1  (전부 맞을 때)  τ = γ + 1</text><polyline points="100.0,442.0 151.2,407.8 202.5,377.0 253.8,349.3 305.0,324.4 356.2,301.9 407.5,281.8 458.8,263.6 510.0,247.2 561.2,232.5 612.5,219.2 663.8,207.3 715.0,196.6 766.2,186.9 817.5,178.2 868.8,170.4 920.0,163.4" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="151.2" cy="407.8" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><circle cx="202.5" cy="377.0" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><circle cx="305.0" cy="324.4" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><circle cx="510.0" cy="247.2" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><circle cx="920.0" cy="163.4" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><line x1="928.0" y1="99.99999999999994" x2="950.0" y2="99.99999999999994" stroke="#2a78d6" stroke-width="2" stroke-dasharray="4 4"/><text x="958.0" y="104.99999999999994" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">천장 10</text><text x="914.0" y="151.37329045873292" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="end" font-weight="700" fill="#343a4d">α = 0.9</text><polyline points="100.0,442.0 151.2,411.6 202.5,387.3 253.8,367.8 305.0,352.3 356.2,339.8 407.5,329.8 458.8,321.9 510.0,315.5 561.2,310.4 612.5,306.3 663.8,303.1 715.0,300.4 766.2,298.4 817.5,296.7 868.8,295.3 920.0,294.3" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="151.2" cy="411.6" r="5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><circle cx="202.5" cy="387.3" r="5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><circle cx="305.0" cy="352.3" r="5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><circle cx="510.0" cy="315.5" r="5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><circle cx="920.0" cy="294.3" r="5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><line x1="928.0" y1="290.0" x2="950.0" y2="290.0" stroke="#eb6834" stroke-width="2" stroke-dasharray="4 4"/><text x="958.0" y="295.0" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">천장 5</text><text x="914.0" y="282.2784196460019" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="end" font-weight="700" fill="#343a4d">α = 0.8</text><polyline points="100.0,442.0 151.2,419.2 202.5,405.5 253.8,397.3 305.0,392.4 356.2,389.4 407.5,387.7 458.8,386.6 510.0,386.0 561.2,385.6 612.5,385.3 663.8,385.2 715.0,385.1 766.2,385.1 817.5,385.0 868.8,385.0 920.0,385.0" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="151.2" cy="419.2" r="5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><circle cx="202.5" cy="405.5" r="5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><circle cx="305.0" cy="392.4" r="5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><circle cx="510.0" cy="386.0" r="5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><circle cx="920.0" cy="385.0" r="5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/><line x1="928.0" y1="385.0" x2="950.0" y2="385.0" stroke="#1baf7a" stroke-width="2" stroke-dasharray="4 4"/><text x="958.0" y="390.0" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">천장 2.5</text><text x="914.0" y="373.01608032647255" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="end" font-weight="700" fill="#343a4d">α = 0.6</text><rect x="1056" y="96" width="480" height="392" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="1080" y="134" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">α — 한 자리가 채택될 확률</text><text x="1080" y="160" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">(앞 자리가 모두 채택됐다는 조건에서)</text><text x="1080" y="206" font-family="Consolas,'Courier New',monospace" font-size="20" text-anchor="start" font-weight="700" fill="#343a4d">τ = 1 + α + α² + … + α^γ</text><text x="1080" y="240" font-family="Consolas,'Courier New',monospace" font-size="20" text-anchor="start" font-weight="700" fill="#343a4d">  = (1 − α^(γ+1)) / (1 − α)</text><text x="1080" y="290" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">• 맨 앞의 1은 target이 직접 주는 토큰이다</text><text x="1080" y="320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">• k번째 초안은 앞의 k−1개가 다 맞아야 산다</text><text x="1080" y="350" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">  그래서 α^k 씩 줄어든다</text><text x="1080" y="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">• α 0.8 → 0.9면 천장이 5 → 10이다</text><text x="1080" y="410" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">• γ를 늘리는 것보다 α를 올리는 쪽이 크다</text><text x="100" y="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">점은 γ = 1, 2, 4, 8, 16.  α가 자리마다 같다고 둔 단순 모형이다 (실제로는 자리마다 다르다 — 2장).</text></svg>