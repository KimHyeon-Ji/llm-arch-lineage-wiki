<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 570" width="1560" height="570"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">사이클 하나의 시간은 거의 같고, 확정되는 토큰 수만 달라진다</text><text x="40" y="130" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="600" fill="#343a4d">일반 생성 — forward 한 번</text><rect x="420" y="106" width="280" height="40" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="560" y="132" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">target forward (1자리)</text><rect x="920" y="106" width="84" height="40" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="962.0" y="131.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><text x="1400" y="132" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#343a4d">1개</text><text x="40" y="214" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="600" fill="#343a4d">speculative · 첫 초안부터 틀림 (a = 0)</text><rect x="420" y="190" width="26" height="40" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><rect x="450" y="190" width="26" height="40" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><rect x="480" y="190" width="26" height="40" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><rect x="510" y="190" width="26" height="40" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><rect x="548" y="190" width="300" 