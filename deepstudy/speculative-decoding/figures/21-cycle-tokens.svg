t="400" fill="#343a4d">mat</text><rect x="1104" y="274" width="84" height="40" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="1146.0" y="299.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">.</text><text x="1400" y="300" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#343a4d">3개</text><text x="40" y="382" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="600" fill="#343a4d">speculative · 전부 채택 (a = 4, 가정)</text><rect x="420" y="358" width="26" height="40" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><rect x="450" y="358" width="26" height="40" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><rect x="480" y="358" width="26" height="40" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><rect x="510" y="358" width="26" height="40" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><rect x="548" y="358" width="300" height="40" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="698" y="384" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">verify (5자리)</text><rect x="920" y="358" width="84" height="40" rx="6" fill="#e4f0e4" stroke="#4d9a56" stroke-width="2"/><text x="962.0" y="383.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">d1</text><rect x="1012" y="358" width="84" height="40" rx="6" fill="#e4f0e4" stroke="#4d9a56" stroke-width="2"/><text x="1054.0" y="383.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">d2</text><rect x="1104" y="358" width="84" height="40" rx="6" fill="#e4f0e4" stroke="#4d9a56" stroke-width="2"/><text x="1146.0" y="383.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">d3</text><rect x="1196" y="358" width="84" height="40" rx="6" fill="#e4f0e4" stroke="#4d9a56" stroke-width="2"/><text x="1238.0" y="383.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">d4</text><rect x="1288" y="358" width="84" height="40" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="1330.0" y="383.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">+1</text><text x="1400" y="384" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#343a4d">5개</text><text x="620" y="92" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">사이클 시간</text><text x="1100" y="92" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">확정되는 토큰</text><text x="40" y="448" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• 마지막 칸(주황)은 언제나 target이 직접 고른 토큰이다 — 그래서 최소 1개는 확정된다</text><text x="40" y="476" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• a = 4일 때 다섯째 토큰(+1)은 마지막 자리의 출력, 즉 보너스 토큰이다</text><rect x="40" y="496" width="1480" height="52" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="529" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">속도는 '사이클 하나의 시간'과 '평균 몇 개가 확정되나'의 비다.</text></svg>