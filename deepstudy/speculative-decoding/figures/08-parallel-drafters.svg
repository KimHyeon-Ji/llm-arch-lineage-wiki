<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 530" width="1560" height="530"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">DFlash 계열의 장치 — target 정보를 모든 층에 넣고, 블록 안의 의존을 되살린다</text><text x="40" y="76" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">target의 정보는 어디로 들어가나 — 입력이 아니라 모든 draft 층의 K · V로</text><rect x="60" y="104" width="150" height="200" rx="8" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="135" y="130" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#343a4d">target</text><rect x="74" y="154" width="122" height="20" rx="3" fill="#ffffff" stroke="#eb6834" stroke-width="1.2"/><line x1="214" y1="164" x2="300" y2="204" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="74" y="184" width="122" height="20" rx="3" fill="#ffffff" stroke="#eb6834" stroke-width="1.2"/><line x1="214" y1="194" x2="300" y2="204" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="74" y="214" width="122" height="20" rx="3" fill="#ffffff" stroke="#eb6834" stroke-width="1.2"/><line x1="214" y1="224" x2="300" y2="204" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="74" y="244" width="122" height="20" rx="3" fill="#ffffff" stroke="#eb6834" stroke-width="1.2"/><line x1="214" y1="254" x2="300" y2="204" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="74" y="274" width="122" height="20" rx="3" fill="#ffffff" stroke="#eb6834" stroke-width="1.2"/><line x1="214" y1="284" x2="300" y2="204" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="135" y="326" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">5개 층의 hidden을 꺼낸다</text><rect x="304" y="176" width="300" height="56" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="2"/><text x="454.0" y="208.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">이어 붙이기 5d → 선형 → d · RMSNorm</text><text x="454" y="256" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">확정된 토큰마다 한 줄</text><line x1="608" y1="204" x2="716" y2="130" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="720" y="116" width="92" height="28" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="766" y="136" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">K · V</text><rect x="820" y="116" width="250" height="28" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><text x="945" y="136" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">draft 층 1</text><line x1="608" y1="204" x2="716" y2="168" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="720" y="154" width="92" height="28" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="766" y="174" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">K · V</text><rect x="820" y="154" width="250" height="28" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><text x="945" y="174" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">draft 층 2</text><line x1="608" y1="204" x2="716" y2="206" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="720" y="192" width="92" height="28" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="766" y="212" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">K · V</text><rect x="820" y="192" width="250" height="28" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><text x="945" y="212" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">draft 층 3</text><line x1="608" y1="204" x2="716" y2="244" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="720" y="230" width="92" height="28" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="766" y="250" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">K · V</text><rect x="820" y="230" width="250" height="28" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><text x="945" y="250" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">draft 층 4</text><line x1="608" y1="204" x2="716" y2="282" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="720" y="268" width="92" height="28" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><text x="766" y="288" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">K · V</text><rect x="820" y="268" width="250" height="28" rx="4" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.5"/><text x="945" y="288" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">draft 층 5</text><text x="895" y="326" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">층마다 자기 투영으로 K · V를 만들어 캐시에 둔다</text><text x="1110" y="132" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• 초안 블록의 자리들이 이 K · V를 읽는다</text><text x="1110" y="160" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• target이 이미 계산한 표현을</text><text x="1110" y="188" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">  모든 층에서 직접 참조하는 셈이다</text><text x="1110" y="216" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• EAGLE-3는 같은 정보를 입력 한 곳에만 넣는다</text><text x="1110" y="244" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• 그래서 draft를 깊게 쌓을수록 잘 맞는다</text><line x1="40" y1="346" x2="1520" y2="346" stroke="#d3d6e2" stroke-width="1.5"/><rect x="40" y="370" width="480" height="136" rx="10" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><text x="60" y="402" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2a78d6">DFlash</text><text x="60" y="432" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">블록의 모든 자리를 동시에 뽑는다</text><text x="60" y="457" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">뒤 자리는 앞 자리가 무엇으로 뽑혔는지 모른다</text><text x="60" y="482" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">→ 블록 뒤쪽으로 갈수록 덜 맞는다</text><line x1="522" y1="438" x2="538" y2="438" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="540" y="370" width="480" height="136" rx="10" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><text x="560" y="402" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2a78d6">DSpark</text><text x="560" y="432" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">직전에 실제로 뽑힌 토큰으로 다음 자리의 로짓을 고친다</text><text x="560" y="457" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">(표 조회 + 작은 곱 한 번 · rank 256)</text><text x="560" y="482" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">자리마다 통과 확률도 함께 낸다 → 검증 길이를 정한다</text><line x1="1022" y1="438" x2="1038" y2="438" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1040" y="370" width="480" height="136" rx="10" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><text x="1060" y="402" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2a78d6">DFlash 2</text><text x="1060" y="432" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">자리마다 상위 16개 후보를 남긴다</text><text x="1060" y="457" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">이웃한 후보 쌍에 점수를 매겨 이어지는 경로 하나를 고른다</text><text x="1060" y="482" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">층 안에 앞 자리를 섞는 2-tap conv를 넣는다</text></svg>