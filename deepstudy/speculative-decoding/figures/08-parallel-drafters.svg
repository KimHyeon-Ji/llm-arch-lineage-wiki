lgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• EAGLE-3는 같은 정보를 입력 한 곳에만 넣는다</text><text x="1110" y="514" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">• 그래서 draft를 깊게 쌓을수록 잘 맞는다</text><line x1="40" y1="616" x2="1520" y2="616" stroke="#d3d6e2" stroke-width="1.5"/><rect x="40" y="640" width="480" height="136" rx="10" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><text x="60" y="672" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2a78d6">DFlash</text><text x="60" y="702" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">블록의 모든 자리를 동시에 뽑는다</text><text x="60" y="727" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">뒤 자리는 앞 자리가 무엇으로 뽑혔는지 모른다</text><text x="60" y="752" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">→ 블록 뒤쪽으로 갈수록 덜 맞는다</text><line x1="522" y1="708" x2="538" y2="708" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="540" y="640" width="480" height="136" rx="10" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><text x="560" y="672" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2a78d6">DSpark</text><text x="560" y="702" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">직전에 실제로 뽑힌 토큰으로 다음 자리의 로짓을 고친다</text><text x="560" y="727" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">(표 조회 + 작은 곱 한 번 · rank 256)</text><text x="560" y="752" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-