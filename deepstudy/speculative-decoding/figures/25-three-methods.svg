<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 930" width="1560" height="930"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">EAGLE-3 · MTP · DSpark — 같은 사이클, 다른 초안과 검증</text><text x="40" y="76" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">이번 그림의 설정: EAGLE-3 트리 (topk 2 · 깊이 3 · 예산 6) · MTP-1 · DSpark adaptive (한가할 때, 요청 A)   |   직전 확정 토큰 on, target의 답은 'the mat .'</text><text x="230" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#6b4fc8">① 초안을 어떻게 만드나</text><text x="820" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#6b4fc8">② target에 얼마나 넣나</text><text x="1250" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#6b4fc8">③ 시뮬레이터에서 다르게 셀 것</text><line x1="40" y1="132" x2="1520" y2="132" stroke="#e3e5ee" stroke-width="2"/><text x="40" y="190" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#343a4d">EAGLE-3</text><text x="40" y="216" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">트리</text><text x="230" y="174" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">얇은 drafter를 깊이마다 1번 — 노드마다 상위 2개씩 붙인다</text><text x="230" y="200" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">깊이마다 점수 높은 노드 2개만 다시 펼친다</text><text x="230" y="226" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#2a78d6">다 펼친 10개 중 점수 순 6개만 남긴다 (예산)</text><line x1="304" y1="335" x2="350" y2="295" stroke="#a3a7b8" stroke-width="1.5"/><line x1="304" y1="335" x2="350" y2="375" stroke="#a3a7b8" stroke-width="1.5"/><line x1="414" y1="295" x2="460" y2="270" stroke="#a3a7b8" stroke-width="1.5"/><line x1="414" y1="295" x2="460" y2="320" stroke="#a3a7b8" stroke-width="1.5"/><line x1="414" y1="375" x2="460" y2="375" stroke="#a3a7b8" stroke-width="1.5"/><line x1="524" y1="270" x2="570" y2="270" stroke="#a3a7b8" stroke-width="1.5"/><rect x="240" y="320" width="64" height="30" rx="6" fill="#ffffff" stroke="#7b8196" stroke-width="2" stroke-dasharray="6 4"/><text x="272.0" y="339.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">on</text><rect x="350" y="280" width="64" height="30" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="382.0" y="299.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><rect x="350" y="360" width="64" height="30" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="382.0" y="379.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">a</text><rect x="460" y="255" width="64" height="30" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="492.0" y="274.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">mat</text><rect x="460" y="305" width="64" height="30" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="492.0" y="324.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">floor</tex