l="#343a4d">mat</text><rect x="1044" y="164" width="50" height="30" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="1069.0" y="183.2" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#343a4d">floor</text><rect x="1100" y="164" width="50" height="30" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="1125.0" y="183.2" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#343a4d">mat</text><rect x="1156" y="164" width="50" height="30" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="1181.0" y="183.2" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#343a4d">and</text><text x="820" y="226" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">노드 6개 + 직전 토큰 1 = 7줄을 한 번에</text><text x="820" y="252" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">각 노드는 자기 조상만 본다 (트리 마스크)</text><text x="820" y="278" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">the ✓ → mat ✓ → 답 '.'은 트리에 없다 → 멈춤</text><text x="820" y="304" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#c2479c">확정 3 · 버림 4</text><text x="820" y="330" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">최대 확정 = 깊이 + 1 (노드 수가 아니다)</text><text x="1250" y="174" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">검증 줄(노드 수 + 1)과</text><text x="1250" y="200" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">최대 채택(깊이)을 따로 센다</text><text x="1250" y="226" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">트리를 넓히면 채택 기회와 함께</text><text x="1250" y="252" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">검증 비용 · KV도 는다</text><line x1="40" y1="428" x2="1520" y2="428" stroke="#eef0f5" stroke-width="1.5"/><text x="40" y="485" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#343a4d">MTP</text><text x="40" y="511" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">MTP-1 · 일렬</text><text x="230" y="469" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">MTP 블록(본체 층과 같은 층)으로 하나씩 만든다</text><text x="230" y="495" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">MTP-1은 1개. 더 뽑으려면 같은 블록을 반복한다</text><rect x="240" y="525" width="64" height="30" rx="6" fill="#ffffff" stroke="#7b8196" stroke-width="2" stroke-dasharray="6 4"/><text x="272.0" y="544.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">on</text><line x1="308" y1="540" x2="346" y2="540" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="350" y="525" width="64" height="30" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="382.0" y="544.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><rect x="820" y="459" width="50" height="30" rx="6" fill="#ffffff" stroke="#7b8196" stroke-width="2" stroke-dasharray="6 4"/><text x="845.0" y="478.55" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">on</text><rect x="876" y="459" width="50" height="30" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="901.0" y="478.2" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><text x="820" y="521" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">초안 1 + 직전 토큰 1 = 2줄 — 모든 요청 같다</text><text x="820" y="547" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">앞에서부터 비교: the ✓ + 보너스 mat</text><text x="820" y="573" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#4d9a56">확정 2 · 버림 0</text><text x="1250" y="469" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">초안을 늘리면 draft가</text><text x="1250" y="495" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">직렬로 길어진다</text><text x="1250" y="521" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">draft ≈ γ × (블록 1개 + head)</text><text x="1250" y="547" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">뒤 칸 채택률이 빨리 떨어진다</text><line x1="40" y1="585" x2="1520" y2="585" stroke="#eef0f5" stroke-width="1.5"/><text x="40" y="640" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#343a4d">DSpark</text><text x="40" y="666" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">일렬 + 검증 길이 고르기</text><text x="230" y="624" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">블록을 한 번에 → 5칸, 직전 토큰으로 가볍게 보정</text><text x="230" y="650" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#2a78d6">칸마다 '여기까지 맞을 확률'도 낸다</text><rect x="240" y="686" width="56" height="30" rx="6" fill="#ffffff" stroke="#7b8196" stroke-width="2" stroke-dasharray="6 4"/><text x="268.0" y="705.55" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">on</text><rect x="306" y="686" width="80" height="30" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="346.0" y="705.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><text x="346" y="736" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#7b8196">.95</text><rect x="394" y="686" width="80" height="30" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="434.0" y="705.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">mat</text><text x="434" y="736" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#7b8196">.85</text><rect x="482" y="686" width="80" height="30" rx="6" fill="#f4f5f9" stroke="#c9cddb" stroke-width="1.5" stroke-dasharray="4 3"/><text x="522" y="706" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#9aa0b3">and</text><text x="522" y="736" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#7b8196">.51</text><rect x="570" y="686" width="80" height="30" rx="6" fill="#f4f5f9" stroke="#c9cddb" stroke-width="1.5" stroke-dasharray="4 3"/><text x="610" y="706" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#9aa0b3">slept</text><text x="610" y="736" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#7b8196">.18</text><rect x="658" y="686" width="80" height="30" rx="6" fill="#f4f5f9" stroke="#c9cddb" stroke-width="1.5" stroke-dasharray="4 3"/><text x="698" y="706" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#9aa0b3">…</text><text x="698" y="736" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#7b8196">.04</text><line x1="478" y1="676" x2="478" y2="726" stroke="#c2479c" stroke-width="2.5"/><text x="482" y="762" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="700" fill="#c2479c">스케줄러가 여기서 자른다</text><rect x="820" y="614" width="50" height="30" rx="6" fill="#ffffff" stroke="#7b8196" stroke-width="2" stroke-dasharray="6 4"/><text x="845.0" y="633.55" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">on</text><rect x="876" y="614" width="50" height="30" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="901.0" y="633.2" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><rect x="932" y="614" width="50" height="30" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="957.0" y="633.2" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="400" fill="#343a4d">mat</text><text x="820" y="676" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">5칸 중 앞 2칸 + 직전 토큰 1 = 3줄</text><text x="820" y="702" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#c2479c">몇 칸 넣을지는 요청마다 · 스텝마다 다르다</text><text x="820" y="728" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">(배치 전체의 확률과 부하를 보고 정한다)</text><text x="820" y="754" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#4d9a56">확정 3 · 버림 0 — 자른 칸은 검증하지 않는다</text><text x="1250" y="624" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">생성 길이(5칸)와</text><text x="1250" y="650" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">검증 길이(ℓ)를 따로 센다</text><text x="1250" y="676" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">검증 길이는 부하 · confidence로</text><text x="1250" y="702" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">스텝마다 바뀐다 — 스케줄러를 돌린다</text><rect x="40" y="818" width="1480" height="80" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="851" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">트리는 많이 넣고 많이 버린다 · MTP-1은 적게 넣고 적게 얻는다 · DSpark는 통과할 만큼만 골라 넣는다</text><text x="64" y="880" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">넣는 줄 수가 verify 비용을, 초안을 만드는 방식이 draft 비용을 정한다</text></svg>