<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 620" width="1560" height="620"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">MTP — 본체 층과 같은 블록 하나를 본체 위에 붙여, 그다음 토큰을 미리 맞힌다</text><text x="70" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">target (본체)</text><rect x="70" y="150" width="230" height="36" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="185.0" y="172.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">출력 head</text><rect x="70" y="200" width="230" height="36" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="185.0" y="222.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">층 61</text><text x="185.0" y="256" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#7b8196">⋮</text><rect x="70" y="286" width="230" height="36" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="185.0" y="308.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">층 2</text><rect x="70" y="332" width="230" height="36" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="185.0" y="354.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">층 1</text><rect x="70" y="378" width="230" height="36" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="185.0" y="400.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">임베딩</text><text x="185.0" y="136" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="middle" font-weight="700" fill="#343a4d">▲ 출력: on (다음 토큰)</text><text x="185.0" y="440" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="middle" font-weight="400" fill="#7b8196">입력: … The cat sat</text><text x="185.0" y="464" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#7b8196">층 61개</text><text x="520" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">MTP 모듈 (초안 1개)</text><rect x="520" y="150" width="160" height="40" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="2"/><text x="600.0" y="174.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">h — 층 61의 출력</text><rect x="696" y="150" width="150" height="40" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="771.0" y="174.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">임베딩(on)</text><line x1="304" y1="218" x2="514" y2="176" stroke="#d18a1c" stroke-width="2" stroke-dasharray="5 4"/><text x="416.0" y="166" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#d18a1c">본체가 on을 낼 때 쓴 hidden</text><line x1="600" y1="192" x2="660" y2="224" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><line x1="771" y1="192" x2="710" y2="224" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="514" y="222" width="338" height="76" rx="10" fill="#ffffff" stroke="#6b4fc8" stroke-width="2.5" stroke-dasharray="7 4"/><rect x="520" y="228" width="326" height="64" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="683" y="256" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">MTP 블록 × 1</text><text x="683" y="280" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#7b8196">본체 층 1개와 같은 구조 (V3: MLA + MoE)</text><line x1="683" y1="300" x2="683" y2="324" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="560" y="326" width="246" height="36" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="683.0" y="348.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">출력 head (본체와 공유)</text><line x1="683" y1="364" x2="683" y2="388" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="633" y="390" width="100" height="36" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="683.0" y="413.25" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><text x="683" y="448" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#2a78d6">초안 = 그다음 토큰</text><line x1="930" y1="80" x2="930" y2="500" stroke="#e3e5ee" stroke-width="2" stroke-dasharray="6 6"/><text x="960" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">한 사이클 (MTP-1)</text><rect x="960" y="130" width="150" height="44" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1035.0" y="156.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">draft: 블록 1번</text><line x1="1114" y1="152" x2="1146" y2="152" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1150" y="130" width="210" height="44" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="1.5"/><text x="1255" y="157" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#eb6834">verify: on · the = 2줄</text><text x="960" y="214" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#343a4d">결과는 둘 중 하나</text><rect x="960" y="228" width="230" height="30" rx="13" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.5"/><text x="1075.0" y="247.68" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#4d9a56">the 맞음 → 2개 확정</text><text x="1202" y="249" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">85 ~ 90% (DeepSeek-V3)</text><rect x="960" y="268" width="230" height="30" rx="13" fill="#f8e6f1" stroke="#c2479c" stroke-width="1.5"/><text x="1075.0" y="287.68" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#c2479c">틀림 → 1개 (target 토큰)</text><text x="960" y="334" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#343a4d">초안을 3개로 늘리면</text><rect x="960" y="350" width="92" height="36" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1006.0" y="372.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">블록</text><line x1="1054" y1="368" x2="1072" y2="368" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1076" y="350" width="92" height="36" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1122.0" y="372.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">블록</text><line x1="1170" y1="368" x2="1188" y2="368" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1192" y="350" width="92" height="36" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1238.0" y="372.55" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#343a4d">블록</text><text x="960" y="414" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">블록을 직렬로 3번 · verify 4줄</text><text x="960" y="438" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">뒤 칸일수록 잘 안 맞는다 (학습 때 없던 쓰임)</text><rect x="40" y="520" width="1480" height="80" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="553" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">draft 한 번 = 본체 층 1개 + head — 가볍지 않다. 더 뽑으려면 같은 블록을 직렬로 반복한다</text><text x="64" y="582" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">모델에 들어 있는 모듈이라 따로 학습하지 않는다</text></svg>