<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 640" width="1560" height="640"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">drafter가 hidden과 토큰을 둘 다 받는 이유</text><text x="40" y="104" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">target이 자리 'sat'을 처리했다 (prefill)</text><rect x="60" y="130" width="118" height="40" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="2"/><text x="119.0" y="155.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">The</text><rect x="188" y="130" width="118" height="40" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="2"/><text x="247.0" y="155.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">cat</text><rect x="316" y="130" width="118" height="40" rx="6" fill="#eceafa" stroke="#6b4fc8" stroke-width="2"/><text x="375.0" y="155.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">sat</text><rect x="60" y="196" width="374" height="60" rx="8" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="247" y="232" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">target의 층들을 모두 지난다</text><line x1="247" y1="259" x2="247" y2="293" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="150" y="296" width="194" height="44" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="2"/><text x="247.0" y="323.95" font-family="Consolas,'Courier New',monospace" font-size="17" text-anchor="middle" font-weight="400" fill="#343a4d">hidden  h_sat</text><text x="247" y="362" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">'The cat sat까지 읽은 이해'</text><text x="247" y="384" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">벡터 한 줄 (8B 모델이면 숫자 4,096개)</text><line x1="247" y1="396" x2="247" y2="428" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="150" y="431" width="194" height="40" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="247.0" y="456.6" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">출력 head</text><text x="247" y="494" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">어휘 전체에 대한 확률 → 'on' 0.6 · 'down' 0.3 …</text><text x="247" y="516" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">여기서 'on'이 뽑혔다</text><line x1="520" y1="90" x2="520" y2="540" stroke="#d3d6e2" stroke-width="2" stroke-dasharray="6 6"/><text x="560" y="104" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">hidden만 주면 drafter가 모르는 것</text><text x="560" y="144" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">h_sat은 'on'을 고르기 전의 상태다.</text><text x="560" y="174" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">다음 칸에 'on'이 뽑혔는지 'down'이 뽑혔는지</text><text x="560" y="204" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">hidden에는 들어 있지 않다.</text><text x="560" y="234" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d"></text><text x="560" y="264" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">그다음 토큰은 그 선택에 따라 달라진다.</text><rect x="560" y="316" width="150" height="40" rx="6" fill="#eff0f6" stroke="#c9cddb" stroke-width="2"/><text x="635.0" y="341.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">on  →  the</text><rect x="730" y="316" width="150" height="40" rx="6" fill="#eff0f6" stroke="#c9cddb" stroke-width="2"/><text x="805.0" y="341.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">down  →  on</text><text x="720" y="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">같은 h_sat이어도 다음 칸의 토큰이 다르면</text><text x="720" y="402" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">맞혀야 할 답이 다르다</text><line x1="940" y1="90" x2="940" y2="540" stroke="#d3d6e2" stroke-width="2" stroke-dasharray="6 6"/><text x="980" y="104" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">그래서 drafter는 둘을 함께 받는다</text><rect x="990" y="150" width="220" height="46" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="2"/><text x="1100.0" y="178.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">hidden  h_sat</text><text x="1100" y="218" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">여기까지의 이해</text><rect x="1250" y="150" width="230" height="46" rx="6" fill="#eff0f6" stroke="#c9cddb" stroke-width="2"/><text x="1365.0" y="178.6" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">임베딩  Emb(on)</text><text x="1365" y="218" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">그다음에 실제로 온 토큰</text><line x1="1100" y1="232" x2="1200" y2="284" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><line x1="1365" y1="232" x2="1265" y2="284" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1060" y="288" width="350" height="56" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1235.0" y="321.95" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#343a4d">drafter — 얇은 층 하나</text><line x1="1235" y1="347" x2="1235" y2="383" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1160" y="386" width="150" height="44" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1235.0" y="414.3" font-family="Consolas,'Courier New',monospace" font-size="18" text-anchor="middle" font-weight="400" fill="#343a4d">the</text><text x="1235" y="456" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">on 다음 토큰을 맞힌다 — 첫 초안 d1</text><text x="1235" y="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#7b8196">임베딩: 토큰 ID를 벡터로 바꾼 것 (target의 표를 함께 쓴다)</text><rect x="40" y="548" width="1480" height="80" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="581" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">hidden은 '여기까지 읽은 이해', 임베딩은 '그다음에 실제로 온 토큰'이다. drafter는 둘로 그다음 토큰을 맞힌다.</text><text x="64" y="610" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">문맥을 읽는 일은 target이 이미 했다. 그 결과를 받아 쓰니 drafter는 층 하나로도 꽤 잘 맞힌다.</text></svg>