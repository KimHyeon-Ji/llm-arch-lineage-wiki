 Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="700" fill="#4d9a56">가장 바쁜 GPU의 일: 14.3 → 24.7</text><text x="1118.0" y="252.40000000000003" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">(×1.73 — 토큰은 ×2인데)</text><rect x="40" y="590" width="1480" height="112" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="624" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">verify의 MoE 비용 = 불린 expert의 가중치 읽기 + 토큰 × 8의 곱셈 + GPU 간 주고받기(토큰 × 8) + 가장 바쁜 GPU 기다리기</text><text x="64" y="652" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">버려질 초안도 라우팅된다 — 버린 줄만큼 expert 곱셈과 통신을 헛쓴다</text><text x="64" y="678" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">그림은 '고르고 서로 독립인 라우팅'을 가정했다. 실제로는 인기 expert가 있고 이웃 토큰이 같은 expert를 자주 고른다 → 합집합은 더 작고, 쏠림은 더 크다</text></svg>