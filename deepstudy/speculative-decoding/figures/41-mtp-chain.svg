0" y="227.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">mat</text><line x1="918" y1="223" x2="944" y2="223" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="948" y="200" width="120" height="46" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1008.0" y="227.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">MTP 블록</text><line x1="1072" y1="223" x2="1098" y2="223" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1102" y="206" width="64" height="34" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1134.0" y="227.9" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">and</text><rect x="1206" y="200" width="230" height="46" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="1.5"/><text x="1321" y="229" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#eb6834">verify 4줄</text><text x="260" y="290" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">draft 시간 ─────────────────────────▶   블록 수만큼 직렬로 늘어난다</text><text x="40" y="336" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">h = 직전 위치의 target hidden.  블록 = 본체 층 하나와 같은 구조 (DeepSeek: MLA + MoE) + target의 출력 head</text><rect x="40" y="362" width="1480" height="80" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="395" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">모델에 들어 있는 모듈이라 따로 학습하지 않는다. 대신 블록이 본체 층과 같아 draft 한 번이 무겁다</text><text x="64" y="424" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">반복해서 뒤 칸을 뽑으면 학습 때 없던 쓰임이라 채택률이 빨리 떨어진다 (DeepSeek-V3는 MTP 모듈 1개로 학습)</text></svg>