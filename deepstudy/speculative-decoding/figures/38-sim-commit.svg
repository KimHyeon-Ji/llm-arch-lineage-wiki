ill="#343a4d">a 2 → n 3</text><rect x="416" y="246" width="110" height="30" rx="4" fill="#f4f5f9" stroke="#c9cddb" stroke-width="1"/><rect x="508" y="224" width="14" height="14" rx="3" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.2"/><text x="466" y="266" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="700" fill="#343a4d">a 0 → n 1</text><rect x="532" y="246" width="110" height="30" rx="4" fill="#f4f5f9" stroke="#c9cddb" stroke-width="1"/><rect x="624" y="224" width="14" height="14" rx="3" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.2"/><rect x="624" y="207" width="14" height="14" rx="3" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.2"/><rect x="624" y="190" width="14" height="14" rx="3" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.2"/><rect x="624" y="173" width="14" height="14" rx="3" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.2"/><text x="582" y="266" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="700" fill="#343a4d">a 3 → n 4</text><rect x="648" y="246" width="110" height="30" rx="4" fill="#f4f5f9" stroke="#c9cddb" stroke-width="1"/><rect x="740" y="224" width="14" height="14" rx="3" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.2"/><text x="698" y="266" font-family="Consolas,'Courier New',monospace" font-size="12" text-anchor="middle" font-weight="700" fill="#343a4d">a 0 → n 1</text><rect x="764" y="246" width="110" height="30" rx="4" fill="#f4f5f9" stroke="#c9cddb" stroke-width="1"/><rect x="856" y="224" width="14" height="14" rx="3" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.2"/><rect x="856" y="207" width="14" height="14" rx="3" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.2"/><rect x="856" y="190" width="14" height="14" rx="3" fill="#ffffff" stroke="#c2479c" stroke-width="1.2" stroke-dasharray="3 2"/><rect x="856" y="173" width="14" height="14" rx="3" fill="#ffffff" stroke="#c2479c" stroke-width="1.2" stroke-dasharray="3 2"/><text x="8