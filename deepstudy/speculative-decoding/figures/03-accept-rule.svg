<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 560" width="1560" height="560"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">채택 규칙 — 겹치는 만큼 받고, 모자란 만큼 다시 뽑는다</text><line x1="70" y1="400" x2="640" y2="400" stroke="#8b90a3" stroke-width="1.5"/><line x1="70" y1="348.0" x2="640" y2="348.0" stroke="#e6e8f1" stroke-width="1"/><text x="60" y="353.0" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="end" font-weight="400" fill="#7b8196">0.1</text><line x1="70" y1="296.0" x2="640" y2="296.0" stroke="#e6e8f1" stroke-width="1"/><text x="60" y="301.0" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="end" font-weight="400" fill="#7b8196">0.2</text><line x1="70" y1="244.0" x2="640" y2="244.0" stroke="#e6e8f1" stroke-width="1"/><text x="60" y="249.0" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="end" font-weight="400" fill="#7b8196">0.3</text><line x1="70" y1="192.0" x2="640" y2="192.0" stroke="#e6e8f1" stroke-width="1"/><text x="60" y="197.0" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="end" font-weight="400" fill="#7b8196">0.4</text><line x1="70" y1="140.0" x2="640" y2="140.0" stroke="#e6e8f1" stroke-width="1"/><text x="60" y="145.0" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="end" font-weight="400" fill="#7b8196">0.5</text><rect x="110" y="140.0" width="44" height="260.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><rect x="156" y="244.0" width="44" height="156.0" rx="4" fill="#eb6834" stroke="none" stroke-width="2"/><text x="132.0" y="132.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">0.5</text><text x="178.0" y="236.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">0.3</text><rect x="105" y="244.0" width="100" height="156.0" rx="3" fill="none" stroke="#343a4d" stroke-width="2" stroke-dasharray="5 4"/><text x="155" y="424" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">토큰 A</text><rect x="246" y="244.0" width="44" height="156.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><rect x="292" y="192.0" width="44" height="208.0" rx="4" fill="#eb6834" stroke="none" stroke-width="2"/><text x="268.0" y="236.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">0.3</text><text x="314.0" y="184.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">0.4</text><rect x="241" y="244.0" width="100" height="156.0" rx="3" fill="none" stroke="#343a4d" stroke-width="2" stroke-dasharray="5 4"/><text x="291" y="424" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">토큰 B</text><rect x="382" y="348.0" width="44" height="52.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><rect x="428" y="296.0" width="44" height="104.0" rx="4" fill="#eb6834" stroke="none" stroke-width="2"/><text x="404.0" y="340.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">0.1</text><text x="450.0" y="288.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">0.2</text><rect x="377" y="348.0" width="100" height="52.0" rx="3" fill="none" stroke="#343a4d" stroke-width="2" stroke-dasharray="5 4"/><text x="427" y="424" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">토큰 C</text><rect x="518" y="348.0" width="44" height="52.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="2"/><rect x="564" y="348.0" width="44" height="52.0" rx="4" fill="#eb6834" stroke="none" stroke-width="2"/><text x="540.0" y="340.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">0.1</text><text x="586.0" y="340.0" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#343a4d">0.1</text><rect x="513" y="348.0" width="100" height="52.0" rx="3" fill="none" stroke="#343a4d" stroke-width="2" stroke-dasharray="5 4"/><text x="563" y="424" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">토큰 D</text><rect x="110" y="76" width="16" height="16" rx="3" fill="#2a78d6" stroke="none" stroke-width="2"/><text x="134" y="90" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">q — drafter의 분포</text><rect x="300" y="76" width="16" height="16" rx="3" fill="#eb6834" stroke="none" stroke-width="2"/><text x="324" y="90" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">p — target의 분포</text><rect x="490" y="76" width="16" height="16" rx="3" fill="none" stroke="#343a4d" stroke-width="2" stroke-dasharray="5 4"/><text x="514" y="90" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">겹치는 부분 min(p, q)</text><text x="70" y="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">겹치는 부분의 합 = 0.3 + 0.3 + 0.1 + 0.1 = 0.8  →  이 위치의 채택 확률</text><text x="70" y="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">두 분포가 같으면 1, 전혀 안 겹치면 0이다</text><rect x="720" y="76" width="800" height="150" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="744" y="112" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">drafter가 q에서 토큰 x를 뽑았다</text><text x="744" y="146" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#343a4d">① 확률 min(1, p(x) / q(x)) 로 채택한다</text><text x="744" y="178" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#343a4d">② 거부되면  max(0, p − q) 를 정규화한 분포에서 다시 뽑는다</text><text x="744" y="208" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">    여기서는 [0, 0.1, 0.1, 0] → [0, 0.5, 0.5, 0]</text><text x="760" y="268" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">토큰</text><text x="940" y="268" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">q로 뽑혀 채택</text><text x="1160" y="268" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">거부 뒤 다시 뽑힘</text><text x="1400" y="268" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">합</text><line x1="720" y1="280" x2="1520" y2="280" stroke="#b9bdcc" stroke-width="1.5"/><text x="760" y="312" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">A</text><text x="940" y="312" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">0.5 × 0.6 = 0.30</text><text x="1160" y="312" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">0.2 × 0 = 0</text><text x="1400" y="312" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">0.30</text><text x="760" y="348" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">B</text><text x="940" y="348" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">0.3 × 1 = 0.30</text><text x="1160" y="348" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">0.2 × 0.5 = 0.10</text><text x="1400" y="348" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">0.40</text><text x="760" y="384" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">C</text><text x="940" y="384" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">0.1 × 1 = 0.10</text><text x="1160" y="384" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">0.2 × 0.5 = 0.10</text><text x="1400" y="384" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">0.20</text><text x="760" y="420" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">D</text><text x="940" y="420" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">0.1 × 1 = 0.10</text><text x="1160" y="420" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">0.2 × 0 = 0</text><text x="1400" y="420" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">0.10</text><line x1="720" y1="430" x2="1520" y2="430" stroke="#b9bdcc" stroke-width="1.5"/><text x="744" y="464" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">합 열이 target의 분포 p = [0.3, 0.4, 0.2, 0.1] 과 정확히 같다</text><text x="744" y="494" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">0.2는 거부될 확률이다 (1 − 0.8). 깎은 몫을 거부했을 때 그대로 돌려준다</text></svg>