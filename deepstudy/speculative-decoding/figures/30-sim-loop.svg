<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 800" width="1560" height="800"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">e2e 서빙 시뮬레이터의 한 스텝 — speculation이 더하는 것 (파랑)</text><rect x="40" y="92" width="340" height="340" rx="10" fill="#ffffff" stroke="#c9cddb" stroke-width="1.8"/><text x="60" y="126" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">① 워크로드</text><text x="60" y="152" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">LMBenchmark 세션 · InferenceX</text><text x="60" y="172" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">closed loop · JSONL trace</text><rect x="54" y="198" width="312" height="220" rx="8" fill="#e2eefc" stroke="none" stroke-width="2"/><text x="70" y="230" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ 요청마다 채택 프로필</text><text x="70" y="258" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">  (작업 종류 · 온도 · 배율)</text><text x="70" y="286" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ 세션의 뒤 턴 = 긴 문맥</text><text x="70" y="314" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">  → α가 S에 따라 변한다</text><text x="70" y="342" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ closed loop: 빨라지면</text><text x="70" y="370" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">  다음 요청도 빨리 온다</text><rect x="420" y="92" width="340" height="340" rx="10" fill="#ffffff" stroke="#c9cddb" stroke-width="1.8"/><text x="440" y="126" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">② 스케줄러 (Python)</text><text x="440" y="152" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">continuous batching · 토큰 예산</text><text x="440" y="172" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">KV 블록 · 선점 · prefix cache · P/D</text><rect x="434" y="198" width="312" height="220" rx="8" fill="#e2eefc" stroke="none" stroke-width="2"/><text x="450" y="230" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ γ 정책 → 요청마다 K</text><text x="450" y="258" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ 토큰 예산에서 Σ K를 먼저 뗀다</text><text x="450" y="286" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ KV: S + K줄 예약 · 버린 줄의 블록</text><text x="450" y="314" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ prefix 적중: drafter 상태 복원</text><text x="450" y="342" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ P/D: drafter 상태도 넘긴다</text><text x="450" y="370" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ drafter 가중치 · 캐시 · 버퍼</text><rect x="800" y="92" width="340" height="340" rx="10" fill="#ffffff" stroke="#c9cddb" stroke-width="1.8"/><text x="820" y="126" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">③ STAGE — ET 생성</text><text x="820" y="152" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">배치의 연산을 그래프로</text><rect x="814" y="198" width="312" height="220" rx="8" fill="#e2eefc" stroke="none" stroke-width="2"/><text x="830" y="230" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ drafter 문맥 갱신 (직전 a + 1줄)</text><text x="830" y="258" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ 초안 op (스텝마다 직렬)</text><text x="830" y="286" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ verify Σ K줄 · 트리는 조상 마스크</text><text x="830" y="314" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ MoE 라우팅에 Σ K줄 (버릴 줄 포함)</text><text x="830" y="342" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ 로짓 K × 어휘 · 거부 샘플링</text><text x="830" y="370" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ graph 크기: 요청당 1 + γ줄 단위</text><rect x="1180" y="92" width="340" height="340" rx="10" fill="#ffffff" stroke="#c9cddb" stroke-width="1.8"/><text x="1200" y="126" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">④ ASTRA-sim</text><text x="1200" y="152" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">ET → 스텝 시간 (연산 + 통신)</text><rect x="1194" y="198" width="312" height="220" rx="8" fill="#e2eefc" stroke="none" stroke-width="2"/><text x="1210" y="230" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ drafter 갱신 → 초안 → verify</text><text x="1210" y="258" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">  직렬 의존 그대로</text><text x="1210" y="286" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ drafter TP는 따로</text><text x="1210" y="314" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ 채택 처리의 host 직렬 몫</text><line x1="382" y1="262" x2="418" y2="262" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><line x1="762" y1="262" x2="798" y2="262" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><line x1="1142" y1="262" x2="1178" y2="262" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="400" y="248" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#7b8196">도착</text><text x="780" y="248" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#7b8196">배치</text><text x="1160" y="248" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#7b8196">ET</text><rect x="800" y="500" width="720" height="168" rx="10" fill="#e4f0e4" stroke="#4d9a56" stroke-width="2"/><text x="820" y="534" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">⑤ 스텝 끝 — 채택을 뽑고 확정한다 (새로 넣는 단계)</text><text x="830" y="566" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">• 요청마다 채택 수 a를 분포에서 뽑는다 (자리 · 요청 · 출력 구간에 따라)</text><text x="830" y="592" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">• a + 1개 확정 — EOS · max_tokens가 끼면 거기서 자른다</text><text x="830" y="618" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">• 유효 길이 S += 출력 수 · 버린 줄은 prefix cache에 넣지 않는다</text><text x="830" y="644" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#343a4d">• 확정 토큰을 스텝 끝 시각에 한꺼번에 내보낸다</text><line x1="1350" y1="434" x2="1350" y2="498" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="1362" y="474" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">Δt → 시계 전진</text><line x1="800" y1="560" x2="590" y2="560" stroke="#5d6377" stroke-width="2.2"/><line x1="590" y1="560" x2="590" y2="436" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="700" y="550" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#7b8196">다음 스텝</text><rect x="40" y="500" width="340" height="168" rx="10" fill="#ffffff" stroke="#c9cddb" stroke-width="1.8"/><text x="60" y="534" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">⑥ 지표</text><text x="60" y="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">TTFT · TPOT · ITL · 처리량</text><rect x="54" y="576" width="312" height="78" rx="8" fill="#e2eefc" stroke="none" stroke-width="2"/><text x="70" y="606" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ τ · 채택 히스토그램</text><text x="70" y="636" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#2a78d6">+ 버린 줄 · 사용자당 속도 분포</text><line x1="800" y1="640" x2="384" y2="640" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="600" y="630" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#7b8196">토큰 · 시각</text><line x1="210" y1="498" x2="210" y2="436" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="222" y="474" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">완료 → 다음 요청 (closed loop)</text><rect x="40" y="700" width="1480" height="84" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="732" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">결정은 ②(이번 스텝에 무엇을 넣나)와 ⑤(스텝 끝에 무엇을 확정하나)에서 일어난다. ③ · ④는 그 결과를 연산 · 통신으로 센다.</text><text x="64" y="762" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">e2e라서 보이는 것: 큐 대기 · K줄 예약에 따른 메모리 압박과 선점 · 토큰 예산 경쟁 · closed loop의 되먹임 · 앞뒤 요청의 간섭</text></svg>