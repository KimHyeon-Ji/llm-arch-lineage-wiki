<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 520" width="1560" height="520"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">target forward 한 번의 시간은 '읽기'가 정한다 — 그래서 여러 줄을 한 번에 태운다</text><text x="60" y="104" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">일반 decode — 토큰 4개에 target forward 4번</text><rect x="60" y="124" width="190" height="54" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="155.0" y="156.6" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">가중치 전체 읽기</text><text x="155.0" y="204" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">토큰 1</text><rect x="258" y="124" width="190" height="54" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="353.0" y="156.6" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">가중치 전체 읽기</text><text x="353.0" y="204" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">토큰 2</text><rect x="456" y="124" width="190" height="54" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="551.0" y="156.6" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">가중치 전체 읽기</text><text x="551.0" y="204" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">토큰 3</text><rect x="654" y="124" width="190" height="54" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="749.0" y="156.6" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">가중치 전체 읽기</text><text x="749.0" y="204" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">토큰 4</text><text x="60" y="280" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">speculative decoding — 초안 4개 + target forward 1번</text><rect x="60" y="300" width="20" height="54" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><rect x="86" y="300" width="20" height="54" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><rect x="112" y="300" width="20" height="54" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><rect x="138" y="300" width="20" height="54" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="109" y="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">초안 4번</text><rect x="170" y="300" width="220" height="54" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="280.0" y="332.6" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">가중치 전체 읽기 — 한 번</text><text x="280.0" y="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#7b8196">5줄을 함께 검증 → 토큰 1 ~ 5개</text><line x1="404" y1="327" x2="844" y2="327" stroke="#4d9a56" stroke-width="2" stroke-dasharray="6 6"/><text x="624.0" y="318" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#3d7c45">아낀 시간</text><line x1="60" y1="440" x2="874" y2="440" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="874" y="466" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="end" font-weight="400" fill="#7b8196">시간</text><rect x="936" y="80" width="600" height="400" rx="10" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><text x="960" y="116" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#343a4d">target forward 한 번을 뜯어보면</text><text x="960" y="166" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#343a4d">1줄을 태울 때 (decode)</text><text x="960" y="200" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">읽기</text><rect x="1012" y="182" width="420" height="24" rx="4" fill="#fdeadf" stroke="#eb6834" stroke-width="1.5"/><text x="960" y="232" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">연산</text><rect x="1012" y="214" width="7" height="24" rx="3" fill="#6b4fc8" stroke="none" stroke-width="2"/><text x="960" y="284" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#343a4d">5줄을 태울 때 (verify)</text><text x="960" y="318" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">읽기</text><rect x="1012" y="300" width="420" height="24" rx="4" fill="#fdeadf" stroke="#eb6834" stroke-width="1.5"/><text x="960" y="350" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">연산</text><rect x="1012" y="332" width="35" height="24" rx="3" fill="#6b4fc8" stroke="none" stroke-width="2"/><text x="960" y="400" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">• 읽기 — 가중치를 메모리에서 가져온다. 줄 수와 무관하다</text><text x="960" y="427" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">• 연산 — 줄 수에 비례한다. 배치가 작으면 읽기보다 훨씬 짧다</text><text x="960" y="454" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">• 걸리는 시간은 둘 중 긴 쪽이 정한다 → 5줄이어도 거의 그대로</text></svg>