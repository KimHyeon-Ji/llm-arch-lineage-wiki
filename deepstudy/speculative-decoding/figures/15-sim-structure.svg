<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 620" width="1560" height="620"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">시뮬레이터에 넣을 것 — 사이클 하나를 네 단계로 센다</text><text x="40" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">입력</text><rect x="40" y="116" width="300" height="68" rx="8" fill="#fafbfd" stroke="#b9bdcc" stroke-width="1.5"/><text x="60" y="145" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">target의 op 표</text><text x="60" y="169" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">decode 한 스텝의 연산 · shape</text><line x1="344" y1="150" x2="400" y2="310" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="200" width="300" height="68" rx="8" fill="#fafbfd" stroke="#b9bdcc" stroke-width="1.5"/><text x="60" y="229" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">drafter 명세</text><text x="60" y="253" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">층 수 · 종류 · γ · 순차/병렬</text><line x1="344" y1="234" x2="400" y2="310" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="284" width="300" height="68" rx="8" fill="#fafbfd" stroke="#b9bdcc" stroke-width="1.5"/><text x="60" y="313" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">채택 모형</text><text x="60" y="337" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">자리별 채택 확률 α₁ … α_γ</text><line x1="344" y1="318" x2="400" y2="310" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="368" width="300" height="68" rx="8" fill="#fafbfd" stroke="#b9bdcc" stroke-width="1.5"/><text x="60" y="397" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">하드웨어</text><text x="60" y="421" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">메모리 대역폭 · 연산 성능 · 용량</text><line x1="344" y1="402" x2="400" y2="310" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="452" width="300" height="68" rx="8" fill="#fafbfd" stroke="#b9bdcc" stroke-width="1.5"/><text x="60" y="481" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">부하</text><text x="60" y="505" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">동시 요청 수 B · 컨텍스트 길이 S</text><line x1="344" y1="486" x2="400" y2="310" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="404" y="100" width="780" height="440" rx="14" fill="#f6f5fd" stroke="#6b4fc8" stroke-width="2.5"/><text x="428" y="136" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#6b4fc8">사이클 한 번</text><rect x="428" y="158" width="732" height="74" rx="8" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="448" y="190" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">① draft</text><text x="590" y="188" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">drafter의 연산을 센다</text><text x="590" y="214" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">순차면 γ번, 병렬이면 1번</text><line x1="794" y1="235" x2="794" y2="247" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="428" y="250" width="732" height="74" rx="8" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="448" y="282" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">② verify</text><text x="590" y="280" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">target의 op 표에서 새 토큰 1줄을 K줄로 바꿔 센다</text><text x="590" y="306" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">가중치 읽기는 그대로, 연산과 KV 쓰기는 K배</text><line x1="794" y1="327" x2="794" y2="339" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="428" y="342" width="732" height="74" rx="8" fill="#e4f0e4" stroke="#4d9a56" stroke-width="2"/><text x="448" y="374" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">③ accept</text><text x="590" y="372" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">채택 수 a를 채택 모형에서 뽑는다</text><text x="590" y="398" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">앞에서부터 보다가 처음 틀린 자리에서 멈춘다</text><line x1="794" y1="419" x2="794" y2="431" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="428" y="434" width="732" height="74" rx="8" fill="#eceafa" stroke="#6b4fc8" stroke-width="2"/><text x="448" y="466" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">④ commit</text><text x="590" y="464" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#343a4d">컨텍스트 S += a + 1,  KV는 K줄 쓰고 γ − a줄 버린다</text><text x="590" y="490" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">drafter의 캐시도 새로 확정된 줄만큼 채운다</text><path d="M1160,471 C1176,471 1176,195 1163,195" fill="none" stroke="#5d6377" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="794" y="528" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">요청이 끝날 때까지 되풀이한다</text><text x="1240" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">출력</text><line x1="1188" y1="310" x2="1236" y2="150" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1240" y="116" width="280" height="68" rx="8" fill="#fafbfd" stroke="#b9bdcc" stroke-width="1.5"/><text x="1260" y="145" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">토큰/초</text><text x="1260" y="169" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">요청 하나 · 시스템 전체</text><line x1="1188" y1="310" x2="1236" y2="256" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1240" y="222" width="280" height="68" rx="8" fill="#fafbfd" stroke="#b9bdcc" stroke-width="1.5"/><text x="1260" y="251" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">토큰 간격의 분포</text><text x="1260" y="275" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">평균과 p99 — 들쭉날쭉해진다</text><line x1="1188" y1="310" x2="1236" y2="362" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1240" y="328" width="280" height="68" rx="8" fill="#fafbfd" stroke="#b9bdcc" stroke-width="1.5"/><text x="1260" y="357" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">KV 사용량</text><text x="1260" y="381" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">target + drafter + 여유 K줄</text><line x1="1188" y1="310" x2="1236" y2="468" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1240" y="434" width="280" height="68" rx="8" fill="#fafbfd" stroke="#b9bdcc" stroke-width="1.5"/><text x="1260" y="463" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">버려진 일</text><text x="1260" y="487" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">거부된 줄의 연산과 쓰기</text><text x="40" y="590" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">②가 새 코드를 가장 적게 요구한다 — 이미 있는 decode 비용 모형에서 새 토큰의 줄 수만 바꾸면 된다.</text></svg>