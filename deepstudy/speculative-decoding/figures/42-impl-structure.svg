<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 530" width="1560" height="530"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">구현할 부분 — 한 사이클은 draft → verify → accept</text><rect x="40" y="90" width="440" height="360" rx="14" fill="#e2eefc" stroke="#2a78d6" stroke-width="2.5"/><text x="68" y="138" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" text-anchor="start" font-weight="700" fill="#343a4d">① Draft</text><text x="68" y="174" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#7b8196">초안을 만든다</text><rect x="290" y="114" width="166" height="34" rx="17" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="373.0" y="137" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#2a78d6">갈래마다 다르다</text><rect x="560" y="90" width="440" height="360" rx="14" fill="#fdeadf" stroke="#eb6834" stroke-width="2.5"/><text x="588" y="138" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" text-anchor="start" font-weight="700" fill="#343a4d">② Verify</text><text x="588" y="174" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#7b8196">target이 초안을 한 번에 확인한다</text><rect x="844" y="114" width="132" height="34" rx="17" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="910.0" y="137" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#eb6834">연산은 같다</text><rect x="1080" y="90" width="440" height="360" rx="14" fill="#e4f0e4" stroke="#4d9a56" stroke-width="2.5"/><text x="1108" y="138" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" text-anchor="start" font-weight="700" fill="#343a4d">③ Accept</text><text x="1108" y="174" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#7b8196">어디까지 받을지 정한다</text><rect x="1347" y="114" width="149" height="34" rx="17" fill="#ffffff" stroke="#4d9a56" stroke-width="2"/><text x="1421.5" y="137" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#4d9a56">갈래마다 같다</text><line x1="484" y1="270.0" x2="556" y2="270.0" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><line x1="1004" y1="270.0" x2="1076" y2="270.0" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="68" y="220" width="190" height="36" rx="18" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="163.0" y="244" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">별도 draft 모델</text><rect x="272" y="220" width="190" height="36" rx="18" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="367.0" y="244" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">EAGLE-3</text><rect x="68" y="270" width="190" height="36" rx="18" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="163.0" y="294" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">MTP 모듈</text><rect x="272" y="270" width="190" height="36" rx="18" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="367.0" y="294" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">Gemma 4 MTP</text><rect x="68" y="320" width="120" height="36" rx="18" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="128.0" y="344" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">DFlash</text><rect x="202" y="320" width="120" height="36" rx="18" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="262.0" y="344" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">DSpark</text><rect x="336" y="320" width="120" height="36" rx="18" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="396.0" y="344" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">DFlash 2</text><text x="588" y="226" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">연산 = target forward 1번 (갈래마다 같다)</text><text x="588" y="262" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#7b8196">넣는 모양 — 갈래 · 설정마다 다르다</text><rect x="588" y="276" width="384" height="38" rx="19" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="606" y="301" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">일렬</text><text x="956" y="301" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="end" font-weight="700" fill="#eb6834">MTP · EAGLE-3 topk 1 · DFlash</text><rect x="588" y="326" width="384" height="38" rx="19" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="606" y="351" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">트리</text><text x="956" y="351" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="end" font-weight="700" fill="#eb6834">EAGLE-3 topk &gt; 1</text><rect x="588" y="376" width="384" height="38" rx="19" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="606" y="401" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">요청마다 다른 길이</text><text x="956" y="401" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="end" font-weight="700" fill="#eb6834">DSpark</text><text x="1108" y="226" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">앞에서부터 비교하고, 처음 틀린 곳에서 멈춘다</text><text x="1108" y="262" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#7b8196">채택 규칙 — 엔진(vLLM · SGLang 등) 설정으로 고른다</text><rect x="1108" y="276" width="384" height="38" rx="19" fill="#ffffff" stroke="#4d9a56" stroke-width="2"/><text x="1126" y="301" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">토큰별 거부 샘플링 (기본)</text><text x="1476" y="301" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="end" font-weight="700" fill="#4d9a56">vLLM · SGLang</text><rect x="1108" y="326" width="384" height="38" rx="19" fill="#ffffff" stroke="#4d9a56" stroke-width="2"/><text x="1126" y="351" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">block verification</text><text x="1476" y="351" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="end" font-weight="700" fill="#4d9a56">vLLM · SGLang</text><rect x="1108" y="376" width="384" height="38" rx="19" fill="#ffffff" stroke="#4d9a56" stroke-width="2"/><text x="1126" y="401" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#343a4d">손실 허용</text><text x="1476" y="401" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="end" font-weight="700" fill="#