xt><text x="1132" y="365" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">2026.02 · 5층 · 블록 diffusion</text><rect x="960" y="386" width="160" height="38" rx="19" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.8"/><text x="1040.0" y="411" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="600" fill="#343a4d">DSpark</text><text x="1132" y="411" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">2026.07 · + 마르코프 head</text><rect x="960" y="432" width="160" height="38" rx="19" fill="#e2eefc" stroke="#2a78d6" stroke-width="1.8"/><text x="1040.0" y="457" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="600" fill="#343a4d">DFlash 2</text><text x="1132" y="457" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">2026.08 · + 후보 경로 선택</text><line x1="770" y1="268" x2="1090" y2="268" stroke="#6b4fc8" stroke-width="2.2" marker-end="url(#ah)"/><text x="930.0" y="262" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#6b4fc8">2026년의 이동</text><rect x="330" y="506" width="1200" height="96" rx="10" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><rect x="350" y="522" width="260" height="38" rx="19" fill="#eff0f6" stroke="#c9cddb" stroke-width="1.8"/><text x="480.0" y="547" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="600" fill="#343a4d">n-gram  (prompt lookup)</text><rect x="630" y="522" width="210" height="38" rx="19" fill="#eff0f6" stroke="#c9cddb" stroke-width="1.8"/><text x="735.0" y="547" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="600" fill="#343a4d">suffix decoding</text><text x="350" y="586" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">초안 비용이 거의 없다 · 입력을 베끼는 작업(코드 수정, RAG)에서만 잘 맞는다 · 다른 방법의 보조로 쓴다</text><text x="40" y="640" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">파란색 = target의 hidden state를 받아 쓰는 drafter.  이름 옆은 공개 시점과 한 줄 특징.</text></svg>