<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 660" width="1560" height="660"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">drafter를 두 축으로 놓으면 — 어디에 사나 × 초안을 어떻게 뽑나</text><text x="625.0" y="92" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#343a4d">순차 — 초안 토큰마다 forward 한 번  (γ번)</text><text x="1235.0" y="92" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#343a4d">병렬 — 블록 전체를 forward 한 번에</text><text x="40" y="167.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">별도 모델</text><text x="40" y="193.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">자기 임베딩 · 자기 층 · 자기 KV</text><text x="40" y="364.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">target에 붙는 얇은 모듈</text><text x="40" y="390.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">target의 hidden과 LM head를 쓴다</text><text x="40" y="550.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">모델 없음</text><text x="40" y="576.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">토큰 열에서 찾아 온다</text><rect x="330" y="112" width="590" height="118" rx="10" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><rect