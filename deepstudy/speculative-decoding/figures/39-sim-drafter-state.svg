<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 480" width="1560" height="480"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">⑦ drafter 상태 — drafter의 문맥(KV · hidden)을 만들거나 옮겨야 하는 네 순간</text><rect x="40" y="90" width="350" height="290" rx="10" fill="#ffffff" stroke="#c9cddb" stroke-width="1.5"/><text x="60" y="122" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">처음 들어올 때</text><rect x="410" y="90" width="350" height="290" rx="10" fill="#ffffff" stroke="#c9cddb" stroke-width="1.5"/><text x="430" y="122" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">P/D로 나눠 돌릴 때</text><rect x="780" y="90" width="350" height="290" rx="10" fill="#ffffff" stroke="#c9cddb" stroke-width="1.5"/><text x="800" y="122" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">prefix 캐시가 적중할 때</text><rect x="1150" y="90" width="350" height="290" rx="10" fill="#ffffff" stroke="#c9cddb" stroke-width="1.5"/><text x="1170" y="122" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">선점됐다 돌아올 때</text><text x="60" y="160" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">prefill 스텝</text><rect x="60" y="172" width="300" height="40" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="210.0" y="196.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-w