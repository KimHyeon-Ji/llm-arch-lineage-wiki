 Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="700" fill="#2a78d6">+ drafter KV + 마지막 hidden</text><text x="430" y="352" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#343a4d">DSpark는 최근 128토큰만</text><text x="800" y="160" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">프롬프트 블록</text><rect x="800" y="172" width="44" height="30" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><rect x="850" y="172" width="44" height="30" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><rect x="900" y="172" width="44" height="30" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><rect x="950" y="172" width="44" height="30" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><rect x="1000" y="172" width="44" height="30" rx="4" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.5"/><rect x="1050" y="172" width="44" height="30" rx="4" fill="#fdeadf" stroke="#eb6834" stroke-width="1.5"/><text x="1072" y="222" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#eb6834">다시 계산</text><text x="800" y="222" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#6b4fc8">적중</text><text x="800" y="266" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="700" fill="#343a4d">drafter KV도 적중했나?</text><text x="800" y="290" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#343a4d">아니면 그 구간 drafter prefill</text><text x="800" y="314" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#343a4d">vLLM EAGLE: 적중을 블록 하나 줄여</text><text x="800" y="338" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#343a4d">다시 계산한다</text><text x="800" y="362" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#343a4d">버린 초안 줄은 등록하지 않는다</text><rect x="1170" y="172" width="90" height="30" rx="4" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.2"/><text x="1215" y="192" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#343a4d">decode</text><text x="1270" y="194" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#c2479c">✕</text><line x1="1282" y1="187" x2="1360" y2="187" stroke="#c2479c" stroke-width="2" stroke-dasharray="5 4"/><text x="1321" y="178" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#c2479c">대기</text><rect x="1366" y="172" width="110" height="30" rx="4" fill="#fdeadf" stroke="#eb6834" stroke-width="1.2"/><text x="1421" y="192" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#eb6834">다시 prefill</text><text x="1170" y="266" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#343a4d">프롬프트 + 이미 생성한 토큰을</text><text x="1170" y="290" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#343a4d">다시 prefill한다</text><text x="1170" y="314" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="700" fill="#2a78d6">drafter prefill도 다시</text><rect x="40" y="404" width="1480" height="52" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="437" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">target KV만 생각하면 drafter 