<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 740" width="1560" height="740"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">얇은 순차 drafter 둘 — EAGLE-3와 MTP 모듈은 거의 같은 모양이다</text><rect x="40" y="70" width="720" height="500" rx="12" fill="#fafbfd" stroke="#d3d6e2" stroke-width="1.5"/><text x="64" y="104" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#343a4d">EAGLE-3</text><text x="64" y="130" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">target은 그대로 두고 나중에 따로 학습한다</text><rect x="80" y="164" width="300" height="44" rx="6" fill="#fdefd8" stroke="#d18a1c" stroke-width="2"/><text x="230.0" y="191.25" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">target hidden — 낮은 · 중간 · 높은 층  ·  3d</text><rect x="430" y="164" width="280" height="44" rx="6" fill="#eff0f6" stroke="#c9cddb" stroke-width="2"/><text x="570.0" y="191.25" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">토큰 임베딩 Emb(t)  ·  d</text><line x1="230" y1="211" x2="230" y2="235" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><line x1="570" y1="211" x2="570" y2="235" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="110" y="238" width="240" height="38" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="230.0" y="262.25" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">선형 3