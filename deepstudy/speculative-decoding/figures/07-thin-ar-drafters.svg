nd="url(#ah)"/><line x1="1330" y1="279" x2="1230" y2="305" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="950" y="308" width="420" height="38" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1160.0" y="332.25" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">이어 붙이기 → 선형 M  2d → d</text><line x1="1160" y1="349" x2="1160" y2="371" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="840" y="374" width="600" height="44" rx="6" fill="#e2eefc" stroke="#2a78d6" stroke-width="2"/><text x="1140.0" y="401.25" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#343a4d">Transformer 블록 × 1  —  본체와 같은 블록 (V3: MLA + MoE)</text><line x1="1160" y1="421" x2="1160" y2="443" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="950" y="446" width="420" height="38" rx="6" fill="#fdeadf" stroke="#eb6834" stroke-width="2"/><text x="1160.0" y="470.25" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">target의 출력 head (공유)  d → V</text><line x1="1160" y1="487" x2="1160" y2="506" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="1160" y="528" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#343a4d">그다음 토큰의 분포</text><polyline points="1444.0,396.0 1500.0,396.0 1500.0,144.0 990.0,144.0" fill="none" stroke="#5d6377" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="990" y1="144" x2="990" y2="160" stroke="#5d6377" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="400" y="596" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">점선 — 두 번째 스텝부터는 자기가 낸 hidden이 target hidden 자리에 들어간다</text><text x="1160" y="596" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#7b8196">점선 — 더 뽑으려면 같은 블록을 다시 돈다 (V3는 모듈이 하나다)</text><line x1="40" y1="614" x2="1520" y2="614" stroke="#d3d6e2" stroke-width="1.5"/><text x="60" y="640" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d"></text><text x="360" y="640" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">EAGLE-3</text><text x="960" y="640" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">MTP 모듈</text><text x="60" y="670" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">언제 학습하나</text><text x="360" y="670" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">target을 다 학습한 뒤, target은 얼려 두고</text><text x="960" y="670" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">target과 함께 처음부터 (보조 손실)</text><text x="60" y="697" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">target에서 받는 것</text><text x="360" y="697" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">세 층의 hidden을 섞은 것</text><text x="960" y="697" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">마지막 층의 hidden</text><text x="60" y="724" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">target과 함께 쓰는 것</text><text x="360" y="724" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">임베딩 표  (LM head는 작은 어휘로 따로 둔다)</text><text x="960" y="724" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343a4d">임베딩 표 · 출력 head</text></svg>