chor="start" font-weight="400" fill="#7b8196">다음 verify의 첫 줄이 된다</text><line x1="376" y1="104" x2="414" y2="104" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><line x1="756" y1="104" x2="794" y2="104" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><line x1="1136" y1="104" x2="1174" y2="104" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="440" width="1480" height="184" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="474" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">남는 줄 수 = 이번에 확정된 토큰 수  (채택 a개 + target의 1개).  target이 준 토큰 자신의 줄은 다음 사이클에 쓴다</text><text x="64" y="514" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">버리는 방법 ①  길이만 되돌린다</text><text x="64" y="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">요청의 길이 값을 거부된 수만큼 줄인다. 버린 줄은 그 자리에 그대로 있다가 다음 verify가 덮어쓴다  (vLLM)</text><text x="64" y="572" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">버리는 방법 ②  자리를 반납한다</text><text x="64" y="596" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">캐시 자리를 토큰 단위로 나눠 주는 경우. 버린 줄의 자리를 돌려주고 '토큰 → 자리' 표만 고친다. 트리 검증에는 이 방식이 필요하다</text></svg>