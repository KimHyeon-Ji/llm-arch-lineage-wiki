# Kimi K3 KDA 층 (Kimi Delta Attention · linear) — 층 1개 · decode 1스텝 연산 그래프 (HW와 무관)
#
# KDA = Gated DeltaNet과 같은 delta rule이지만 감쇠 α가 채널(key 차원)마다 다르다 — full-rank gate로 만든다.
# - head 96개 × [128 × 128] state를 매 스텝 전부 읽고 다시 씀. q · k · v head 수가 같다(96).
# - 출력 gate는 low-rank(d → 128 → head × 128)로 가정. attention 가중치는 BF16(양자화 제외 목록)
# - 참조 구현 검증 없음: config 값 + 위키 02-linear-attention 2.3(KDA)으로 세운 식

model: Kimi K3 (KDA · linear attention 층)
scope: KDA 층 1개 · decode 1스텝 · linear attention 블록 (MoE · MLA 층 제외)

dims:
  B:      {value: 1,      short: 요청,       desc: 동시 요청 수, var: true}
  T:      {value: 131072, short: 토큰,       desc: "컨텍스트 길이 — KDA 층에는 영향 없음 (비교용)", var: true}
  d:      {value: 7168,   short: hidden 폭,  desc: hidden 폭}
  n_h:    {value: 96,     short: head,       desc: "q · k · v head 수 = state head 수"}
  d_k:    {value: 128,    short: key 폭,     desc: head당 q · k 폭}
  d_v:    {value: 128,    short: value 폭,   desc: head당 v 폭}
  d_conv: {value: 4,      short: conv 탭,    desc: short_conv_kernel_size}
  C:      {value: 36864,  short: conv 채널,  desc: "q · k · v 채널 = 3 × 96 × 128"}
  n_layer: {value: 93,    short: 층 수,      desc: "전체 층 수 = KDA 69 + MLA 24"}
  n_kda:  {value: 69,     short: KDA 층 수,  desc: KDA 층 수}
  T_max:  {value: 1048576, short: 지원 길이, desc: max_position_embeddings}

formats:
  state_b:
    desc: state 원소 1개 바이트
    title: state 정밀도
    ui: true
    options:
      fp32: {value: 4, label: "FP32 (가정 · Kimi Linear 커널 기준)"}
      bf16: {value: 2, label: "BF16 (가정 · 이동량 절반)"}
    default: fp32

kinds:
  weight: {label: 가중치,          share: 공유,   color: gray,   persistent: true, desc: 모든 요청이 같이 쓴다}
  state:  {label: recurrent state, share: 요청별, color: green,  persistent: true, desc: "요청마다 head 96개 × 128 × 128 — 매 스텝 전부 읽고 다시 씀"}
  conv:   {label: conv state,      share: 요청별, color: pink,   persistent: true, desc: "요청마다 최근 3토큰의 q · k · v 채널"}
  act:    {label: 토큰 벡터,       share: 요청별, color: violet, desc: 토큰 1개짜리 중간 결과 벡터}
  inter:  {label: 중간 결과,       share: 요청별, color: yellow, desc: 커널 안에서 잠깐 쓰는 값}

tensors:
  W_qkv:  {label: W_qkv, shape: [d, C],         bytes: 2*d*C,         kind: weight, desc: x → q · k · v}
  W_f:    {label: W_f,   shape: [d, n_h*d_k],   bytes: 2*d*n_h*d_k,   kind: weight, desc: "x → 채널별 감쇠 α (full-rank gate)"}
  W_b:    {label: W_b,   shape: [d, n_h],       bytes: 2*d*n_h,       kind: weight, desc: x → 쓰기 강도 β}
  W_ga:   {label: W_ga,  shape: [d, d_v],       bytes: 2*d*d_v,       kind: weight, desc: "출력 gate low-rank a (가정)"}
  W_gb:   {label: W_gb,  shape: [d_v, n_h*d_v], bytes: 2*d_v*n_h*d_v, kind: weight, desc: "출력 gate low-rank b (가정)"}
  w_conv: {label: conv 가중치, shape: [C, d_conv], bytes: 2*C*d_conv, kind: weight}
  w_norm: {label: norm 가중치, shape: [d_v], bytes: 2*d_v, kind: weight}
  W_out:  {label: W_out, shape: [n_h*d_v, d],   bytes: 2*n_h*d_v*d,   kind: weight, desc: 출력 투영}
  conv_state: {label: conv state, shape: [B, C, d_conv-1], bytes: 2*B*C*(d_conv-1), kind: conv, desc: "최근 3토큰의 q · k · v 채널 (BF16)"}
  ssm_state:  {label: state, shape: [B, n_h, d_k, d_v], bytes: state_b*B*n_h*d_k*d_v, kind: state, desc: "head마다 [128 × 128] — KV cache를 대신하는 고정 크기 기억"}
  x:      {label: x,       shape: [B, d],          bytes: 2*B*d,          kind: act}
  qkv:    {label: qkv,     shape: [B, C],          bytes: 2*B*C,          kind: act}
  f:      {label: f,       shape: [B, n_h*d_k],    bytes: 2*B*n_h*d_k,    kind: act, desc: 채널별 감쇠 logit}
  b:      {label: b,       shape: [B, n_h],        bytes: 2*B*n_h,        kind: act}
  g_lat:  {label: gate latent, shape: [B, d_v],    bytes: 2*B*d_v,        kind: act}
  conv_win: {label: conv 창, shape: [B, C, d_conv], bytes: 2*B*C*d_conv,  kind: inter}
  qkv_c:  {label: qkv (합성곱 후), shape: [B, C],  bytes: 2*B*C,          kind: act}
  q:      {label: q,       shape: [B, n_h, d_k],   bytes: 4*B*n_h*d_k,    kind: inter}
  k:      {label: k,       shape: [B, n_h, d_k],   bytes: 4*B*n_h*d_k,    kind: inter}
  v:      {label: v,       shape: [B, n_h, d_v],   bytes: 4*B*n_h*d_v,    kind: inter}
  alpha:  {label: α,       shape: [B, n_h, d_k],   bytes: 4*B*n_h*d_k,    kind: inter, desc: "채널별 감쇠 (하한 −5)"}
  beta:   {label: β,       shape: [B, n_h],        bytes: 4*B*n_h,        kind: inter}
  S_dec:  {label: 감쇠한 state, shape: [B, n_h, d_k, d_v], bytes: state_b*B*n_h*d_k*d_v, kind: inter}
  kv_mem: {label: 기억 읽기 값, shape: [B, n_h, d_v], bytes: 4*B*n_h*d_v, kind: inter}
  S_new:  {label: 새 state, shape: [B, n_h, d_k, d_v], bytes: state_b*B*n_h*d_k*d_v, kind: state}
  o:      {label: o,       shape: [B, n_h, d_v],   bytes: 2*B*n_h*d_v,    kind: act}
  o_n:    {label: o (gate 후), shape: [B, n_h, d_v], bytes: 2*B*n_h*d_v,  kind: act}
  y:      {label: y,       shape: [B, d],          bytes: 2*B*d,          kind: act}

steps:
  - {id: l1, group: 입력 투영, label: 입력 투영, unit: gemm, prec: bf16, in: [x, W_qkv, W_f, W_b, W_ga], out: [qkv, f, b, g_lat], flops: 2*B*d*(C+n_h*d_k+n_h+d_v), desc: "같은 x로 q · k · v, 채널별 감쇠, 쓰기 강도, 출력 gate latent를 만든다."}
  - {id: l2, group: 짧은 합성곱, label: 짧은 합성곱, unit: vec, in: [qkv, conv_state, w_conv], out: [qkv_c], flops: 2*B*C*d_conv, desc: 채널마다 최근 4칸 가중합 + SiLU.}
  - {id: l3, group: 짧은 합성곱, label: conv state 갱신, unit: mem, viz: append, in: [qkv], out: [conv_state], elems: B*C*(d_conv-1), desc: conv state 3칸을 한 칸 밀어 다시 쓴다.}
  - {id: l4, group: state 갱신, label: q·k 정규화 · gate, unit: vec, in: [qkv_c, f, b], out: [q, k, v, alpha, beta], flops: 6*B*n_h*d_k+4*B*n_h*d_k, desc: "q · k L2 정규화, α = 채널별 감쇠(하한 −5), β = sigmoid(b)."}
  - {id: l5, group: state 갱신, label: state 감쇠 (채널별), unit: vec, in: [ssm_state, alpha], out: [S_dec], flops: B*n_h*d_k*d_v, desc: "state의 key 차원마다 다른 α를 곱한다 — GDN과의 차이."}
  - {id: l6, group: state 갱신, label: 기억 읽기, unit: gemv, in: [S_dec, k], out: [kv_mem], flops: 2*B*n_h*d_k*d_v, desc: 지금 k로 state를 읽는다.}
  - {id: l7, group: state 갱신, label: delta 기록, unit: vec, in: [S_dec, k, v, kv_mem, beta], out: [S_new], flops: 2*B*n_h*d_k*d_v+3*B*n_h*d_v, desc: "새 v와 기억한 값의 차이만 β만큼 기록 — state 전체를 다시 쓴다."}
  - {id: l8, group: 출력 읽기, label: 출력 읽기, unit: gemv, in: [S_new, q], out: [o], flops: 2*B*n_h*d_k*d_v, desc: 갱신한 state에 q를 곱해 출력을 읽는다.}
  - {id: l9, group: 출력 읽기, label: gate 정규화, unit: gemm, prec: bf16, in: [o, g_lat, W_gb, w_norm], out: [o_n], flops: 2*B*d_v*n_h*d_v+8*B*n_h*d_v, desc: "gate latent를 head별로 펼쳐(low-rank b) RMSNorm 후 곱한다."}
  - {id: l10, group: 출력 투영, label: 출력 투영, unit: gemm, prec: bf16, in: [o_n, W_out], out: [y], flops: 2*B*n_h*d_v*d, desc: head 출력 12,288폭을 hidden 7,168로.}

phases:
  - {id: P1, focus: l1, label: "입력 투영", tag: "공통 투영", tag_style: plain, steps: [l1], plain: "x로 q · k · v와 채널별 감쇠 · 쓰기 강도 · gate를 만든다"}
  - {id: P2, focus: l2, label: "짧은 합성곱", tag: "Linear 고유", tag_style: strong, steps: [l2, l3], plain: "최근 4토큰을 채널마다 섞는다"}
  - {id: P3, focus: l7, label: "state 갱신", tag: "KDA 채널별 감쇠", tag_style: strong, steps: [l4, l5, l6, l7], plain: "state를 채널마다 다르게 감쇠하고 delta만 기록한다"}
  - {id: P4, focus: l8, label: "출력 읽기", tag: "KV 대신 state", tag_style: outline, steps: [l8, l9], plain: "갱신한 state에 q를 곱해 출력을 읽고 gate로 다듬는다"}
  - {id: P5, focus: l10, label: "출력 투영", tag: "공통 투영", tag_style: plain, steps: [l10], plain: "head 출력을 hidden 폭으로"}

