    - "Kimi K3 차원(head 96 × 128, hidden 7,168)의 KDA 층 1개 · decode 1스텝. MLA 24층 · MoE는 데이터 성격 패널의 모델 전체에 식으로 포함"
    - "KDA = Gated DeltaNet + 채널별 감쇠(full-rank gate). 커널 묶음은 fla KDA decode 경로를 GDN과 같은 5단계로 단순화"
    - "attention 가중치 BF16(config의 양자화 제외 목록), state FP32 가정, 출력 gate low-rank 가정"
    - "이론 시간 = max(바이트 ÷ 4.8 TB/s, FLOP ÷ 피크). 원소별 · 행렬 × 벡터는 CUDA core FP32 피크"
