# Gated DeltaNet (Qwen3.6-27B linear attention 층) — 층 1개 · decode 1스텝 연산 그래프 (HW와 무관)
#
# - shape · bytes · flops는 차원 식이다. build.py가 실제 차원의 meta 실행으로 ref_decode.py의
#   텐서 shape · GEMM FLOP과 맞는지 검사한다. check_flops = 그 단계에서 aten GEMM으로 잡히는 FLOP.
# - bytes는 배포 저장 형식 기준. state_b는 state 정밀도 변수(FP32 배포 · BF16 가정).
# - 범위: linear attention 블록만 (input RMSNorm 이후 ~ out_proj 출력). 잔차 · FFN · full 층 제외.

model: Qwen3.6-27B (Gated DeltaNet · linear attention 층)
scope: 층 1개 · decode 1스텝 · linear attention 블록 (FFN · full attention 층 제외)

dims:
  B:      {value: 1,      short: 요청,       desc: 동시 요청 수, var: true}
  T:      {value: 131072, short: 토큰,       desc: "컨텍스트 길이 — linear 층에는 영향 없음 (비교용)", var: true}
  d:      {value: 5120,   short: hidden 폭,  desc: hidden 폭}
  n_k:    {value: 16,     short: key head,   desc: q · k head 수}
  n_v:    {value: 48,     short: value head, desc: v head 수 = state head 수}
  d_k:    {value: 128,    short: key 폭,     desc: head당 q · k 폭}
  d_v:    {value: 128,    short: value 폭,   desc: head당 v 폭}
  d_conv: {value: 4,      short: conv 탭,    desc: 짧은 합성곱 길이}
  C:      {value: 10240,  short: conv 채널,  desc: "q · k · v 채널 = 2 × 16 × 128 + 48 × 128"}
  n_layer: {value: 64,    short: 층 수,      desc: 전체 층 수}
  n_lin:  {value: 48,     short: linear 층 수, desc: "linear attention 층 수 (4층마다 full 1층)"}
  T_max:  {value: 262144, short: 지원 길이,  desc: max_position_embeddings}
  n_kv_f: {value: 4,      short: full KV head, desc: "같은 모델 full attention 층의 KV head 수 (비교용)"}
  d_hf:   {value: 256,    short: full head 폭, desc: "full attention 층 head 폭 (비교용)"}

formats:
  state_b:
    desc: state 원소 1개 바이트
    title: state 정밀도
    ui: true
    options:
      fp32: {value: 4, label: "FP32 (배포 · mamba_ssm_dtype)"}
      bf16: {value: 2, label: "BF16 (가정 · 이동량 절반)"}
    default: fp32

kinds:
  weight: {label: 가중치,         share: 공유,   color: gray,   persistent: true, desc: 모든 요청이 같이 쓴다 — B가 늘어도 그대로}
  state:  {label: recurrent state, share: 요청별, color: green,  persistent: true, desc: "요청마다 head 48개 × 128 × 128 고정 크기 — 매 스텝 전부 읽고 다시 씀"}
  conv:   {label: conv state,     share: 요청별, color: pink,   persistent: true, desc: "요청마다 최근 3토큰의 q · k · v 채널 — 매 스텝 한 칸 밀어 다시 씀"}
  act:    {label: 토큰 벡터,      share: 요청별, color: violet, desc: 토큰 1개짜리 중간 결과 벡터. 앞 커널이 HBM에 쓰고 다음 커널이 읽음 — 작음}
  inter:  {label: 중간 결과,      share: 요청별, color: yellow, desc: 커널 안에서 잠깐 쓰는 값 (감쇠한 state · 기억 읽기 값 등)}

tensors:
  # ── 가중치 (BF16) ──
  W_qkv:   {label: W_qkv,   shape: [d, C],         bytes: 2*d*C,       kind: weight, desc: x → q · k · v}
  W_z:     {label: W_z,     shape: [d, n_v*d_v],   bytes: 2*d*n_v*d_v, kind: weight, desc: x → 출력 gate z}
  W_b:     {label: W_b,     shape: [d, n_v],       bytes: 2*d*n_v,     kind: weight, desc: x → 쓰기 강도 β}
  W_a:     {label: W_a,     shape: [d, n_v],       bytes: 2*d*n_v,     kind: weight, desc: x → 감쇠 a}
  w_conv:  {label: conv 가중치, shape: [C, d_conv], bytes: 2*C*d_conv,  kind: weight, desc: 채널마다 4탭}
  A_log:   {label: A_log,   shape: [n_v],          bytes: 4*n_v,       kind: weight, desc: head별 감쇠 크기}
  dt_bias: {label: dt_bias, shape: [n_v],          bytes: 4*n_v,       kind: weight, desc: head별 감쇠 bias}
  w_norm:  {label: norm 가중치, shape: [d_v],      bytes: 2*d_v,       kind: weight}
  W_out:   {label: W_out,   shape: [n_v*d_v, d],   bytes: 2*n_v*d_v*d, kind: weight, desc: 출력 투영}

  # ── 요청별 상주 데이터 (HBM) ──
  conv_state: {label: conv state, shape: [B, C, d_conv-1], bytes: 2*B*C*(d_conv-1), kind: conv, trace: cache.conv, desc: "최근 3토큰의 q · k · v 채널 (BF16)"}
  ssm_state:  {label: state,      shape: [B, n_v, d_k, d_v], bytes: state_b*B*n_v*d_k*d_v, kind: state, trace: cache.ssm, desc: "head마다 [128 × 128] 행렬 — KV cache를 대신하는 고정 크기 기억"}

  # ── 활성값 · 중간값 ──
  x:        {label: x,        shape: [B, d],             bytes: 2*B*d,           kind: act, desc: input RMSNorm 이후 hidden}
  qkv:      {label: qkv,      shape: [B, C],             bytes: 2*B*C,           kind: act, desc: 합성곱 전 q · k · v}
  z:        {label: z,        shape: [B, n_v*d_v],       bytes: 2*B*n_v*d_v,     kind: act, desc: 출력 gate}
  b:        {label: b,        shape: [B, n_v],           bytes: 2*B*n_v,         kind: act}
  a:        {label: a,        shape: [B, n_v],           bytes: 2*B*n_v,         kind: act}
  conv_win: {label: conv 창,  shape: [B, C, d_conv],     bytes: 2*B*C*d_conv,    kind: inter, desc: state 3칸 + 새 값}
  qkv_c:    {label: qkv (합성곱 후), shape: [B, C],      bytes: 2*B*C,           kind: act}
  q:        {label: q,        shape: [B, n_v, d_k],      bytes: 4*B*n_v*d_k,     kind: inter, desc: "L2 정규화 · scale 후 value head 수로 확장"}
  k:        {label: k,        shape: [B, n_v, d_k],      bytes: 4*B*n_v*d_k,     kind: inter}
  v:        {label: v,        shape: [B, n_v, d_v],      bytes: 4*B*n_v*d_v,     kind: inter}
  beta:     {label: β,        shape: [B, n_v],           bytes: 4*B*n_v,         kind: inter, desc: 쓰기 강도 (sigmoid)}
  g:        {label: g,        shape: [B, n_v],           bytes: 4*B*n_v,         kind: inter, desc: "감쇠 (log 공간, 음수)"}
  S_dec:    {label: 감쇠한 state, shape: [B, n_v, d_k, d_v], bytes: state_b*B*n_v*d_k*d_v, kind: inter}
  kv_mem:   {label: 기억 읽기 값, shape: [B, n_v, d_v],  bytes: 4*B*n_v*d_v,     kind: inter, desc: 지금 k로 state에서 읽은 값}
  S_new:    {label: 새 state,  shape: [B, n_v, d_k, d_v], bytes: state_b*B*n_v*d_k*d_v, kind: state}
  o:        {label: o,        shape: [B, n_v, d_v],      bytes: 2*B*n_v*d_v,     kind: act, desc: state에서 읽은 출력}
  o_n:      {label: o (정규화), shape: [B, n_v, d_v],    bytes: 2*B*n_v*d_v,     kind: act}
  y:        {label: y,        shape: [B, d],             bytes: 2*B*d,           kind: act, desc: linear attention 출력 (잔차 더하기 전)}

# unit: gemm(행렬곱) · gemv(행렬 × 벡터) · vec(원소별 · 정규화 · 축약) · mem(쓰기)
steps:
  - id: l1
    group: 입력 투영
    label: 입력 투영
    unit: gemm
    prec: bf16
    in: [x, W_qkv, W_z, W_b, W_a]
    out: [qkv, z, b, a]
    flops: 2*B*d*(C+n_v*d_v+2*n_v)
    desc: 같은 x로 q · k · v(10,240), 출력 gate z(6,144), 쓰기 강도 β와 감쇠 a(head 48개씩)를 만든다.
  - id: l2
    group: 짧은 합성곱
    label: 짧은 합성곱
    unit: vec
    in: [qkv, conv_state, w_conv]
    out: [qkv_c]
    flops: 2*B*C*d_conv
    desc: 채널마다 최근 3토큰 + 지금 값, 4칸을 가중합하고 SiLU를 씌운다. 채널끼리는 섞지 않는다.
  - id: l3
    group: 짧은 합성곱
    label: conv state 갱신
    unit: mem
    viz: append
    in: [qkv]
    out: [conv_state]
    elems: B*C*(d_conv-1)
    desc: 가장 오래된 칸을 버리고 지금 값을 붙여 conv state 3칸을 다시 쓴다.
  - id: l4
    group: state 갱신
    label: q·k 정규화 · gate
    unit: vec
    in: [qkv_c, a, b, A_log, dt_bias]
    out: [q, k, v, beta, g]
    flops: 6*B*n_k*d_k+8*B*n_v
    desc: q · k를 L2 정규화하고 value head 48개로 넓힌다(key head 1개를 3개가 공유). β = sigmoid(b), g = −exp(A_log) · softplus(a + dt_bias).
  - id: l5
    group: state 갱신
    label: state 감쇠
    unit: vec
    in: [ssm_state, g]
    out: [S_dec]
    flops: B*n_v*d_k*d_v
    desc: state 전체에 exp(g)를 곱해 오래된 기억을 줄인다. head마다 128 × 128 원소 전부를 건드린다.
  - id: l6
    group: state 갱신
    label: 기억 읽기
    unit: gemv
    in: [S_dec, k]
    out: [kv_mem]
    flops: 2*B*n_v*d_k*d_v
    check_flops: 2*B*n_v*d_k*d_v
    desc: 지금 k로 state를 읽어 "이미 기억한 값"을 꺼낸다 (head마다 128 × 128 행렬 × 벡터).
  - id: l7
    group: state 갱신
    label: delta 기록
    unit: vec
    in: [S_dec, k, v, kv_mem, beta]
    out: [S_new]
    flops: 2*B*n_v*d_k*d_v+3*B*n_v*d_v
    desc: 새 v와 기억한 값의 차이(delta)만 β만큼 k 방향으로 더한다 — rank-1 갱신. state 전체를 다시 쓴다.
  - id: l8
    group: 출력 읽기
    label: 출력 읽기
    unit: gemv
    in: [S_new, q]
    out: [o]
    flops: 2*B*n_v*d_k*d_v
    check_flops: 2*B*n_v*d_k*d_v
    desc: 갱신한 state에 q를 곱해 출력을 읽는다. full attention의 "KV 전부와 내적"을 이 행렬 × 벡터 한 번이 대신한다.
  - id: l9
    group: 출력 읽기
    label: gate 정규화
    unit: vec
    in: [o, z, w_norm]
    out: [o_n]
    flops: 8*B*n_v*d_v
    desc: head마다 RMSNorm 후 SiLU(z)를 곱한다.
  - id: l10
    group: 출력 투영
    label: 출력 투영
    unit: gemm
    prec: bf16
    in: [o_n, W_out]
    out: [y]
    flops: 2*B*n_v*d_v*d
    desc: head 출력 6,144폭을 hidden 5,120으로 투영한다.

phases:
  - {id: P1, focus: l1, label: "입력 투영",   tag: "공통 투영",    tag_style: plain,   steps: [l1], plain: "x로 q · k · v와 gate · 쓰기 강도 · 감쇠를 한 번에 만든다"}
  - {id: P2, focus: l2, label: "짧은 합성곱", tag: "Linear 고유",  tag_style: strong,  steps: [l2, l3], plain: "최근 4토큰을 채널마다 섞는다 — conv state 3칸을 밀어 갱신"}
  - {id: P3, focus: l7, label: "state 갱신",  tag: "Linear 고유",  tag_style: strong,  steps: [l4, l5, l6, l7], plain: "state를 감쇠하고, 기억과 새 v의 차이만 기록한다 (delta rule)"}
  - {id: P4, focus: l8, label: "출력 읽기",   tag: "KV 대신 state", tag_style: outline, steps: [l8, l9], plain: "갱신한 state에 q를 곱해 출력을 읽고 gate로 정규화"}
  - {id: P5, focus: l10, label: "출력 투영",  tag: "공통 투영",    tag_style: plain,   steps: [l10], plain: "head 출력을 hidden 폭으로 되돌린다"}

# 약식 화면 문구 (viewer/template-lite.html이 읽는다). scope · verify = 화면 맨 아래 '가정 · 검증' ({checks} = meta 실행 검사 결과)
page:
  file: gdn-qwen36
  nav: "Hybrid · Qwen3.6-27B (GDN 층)"
  doc_title: Gated DeltaNet 데이터 이동
  lite:
    doc_title: Gated DeltaNet 데이터 이동
    sub: "Qwen3.6-27B · linear attention 층 1개 · 새 토큰 1개 생성(decode) · H200"
    sibling: {label: "DSA 약식", file: dsa-v32}
  crumbs: [Hybrid attention · linear 층, Qwen3.6-27B · Gated DeltaNet, 층 1개 · decode 1스텝]
  scope:
    - "Qwen3.6-27B 차원(value head 48 · key head 16 · 128 × 128, hidden 5,120)의 Gated DeltaNet 층 1개 · decode 1스텝. 잔차 · FFN · full attention 층 제외"
    - "기준 보고서의 Qwen3.8-Flash-Next와 state 크기(48 × 128 × 128 FP32 ≈ 층당 3.2 MB)가 같다. Qwen3.8 config는 로컬에 없어 hidden 폭 등은 Qwen3.6-27B 값"
    - "커널 묶음은 SGLang · vLLM의 Qwen3-Next / Qwen3.5 경로(in_proj GEMM → causal_conv1d_update → fused recurrent gated delta rule → gated RMSNorm → out_proj)를 대표로 단순화"
    - "가중치 BF16(배포 config dtype). state는 FP32(mamba_ssm_dtype) — BF16 버튼은 가정"
    - "이론 시간 = max(바이트 ÷ 4.8 TB/s, FLOP ÷ 피크). state 감쇠 · 갱신 같은 원소별 · 행렬 × 벡터 연산은 CUDA core FP32 피크 67 TFLOPS 적용"
  verify:
    - "참조 구현 ref_decode.py(1스텝 recurrent · conv state 3칸) = HF Qwen3_5GatedDeltaNet(전체 시퀀스 chunk 방식) 출력 일치, 상대 오차 4e-6 수준"
    - "실제 차원 meta 실행으로 텐서 shape · GEMM FLOP 식 검사 {checks}"
    - "보고서 수치 재현: state + conv state 층당 3.21 MB (보고서 약 3.2 MB/층)"

