# Qwen3.6-27B 모델 전체 — 데이터 장부용 (tools/ledger.py가 읽음)
#
# 규칙은 dsa-v32/model.yaml과 같다. block = linear attention 층 1개(algo · map) × layers.
# full attention 16층은 algo로 그리지 않아 식으로 적는다 (q head 24 + 출력 gate · KV head 4 · head 256 · BF16).
# config: reports/llm-memory-requirements/data/raw/cfg_Qwen_Qwen3.6-27B.json

model: Qwen3.6-27B
deploy: {n_gpu: 1, desc: "H200 1장 — BF16 가중치 약 54 GB"}

dims:
  L_full: {value: 16,     desc: full attention 층 수 (4층마다 1층)}
  n_q:    {value: 24,     desc: full 층 q head 수}
  d_ff:   {value: 17408,  desc: FFN 폭}
  V:      {value: 248320, desc: 어휘 수}

data:
  - {id: w_lin,  label: "가중치 · linear attention", block: {kind: weight}, layers: n_lin}
  - {id: w_full, label: "가중치 · full attention", share: 공유, pat: stream, layers: L_full,
     store: "L_full*(2*d*(2*n_q*d_hf + 2*n_kv_f*d_hf) + 2*n_q*d_hf*d)",
     read:  "L_full*(2*d*(2*n_q*d_hf + 2*n_kv_f*d_hf) + 2*n_q*d_hf*d)", note: "q는 출력 gate까지 2배"}
  - {id: w_ffn,  label: "가중치 · FFN", share: 공유, pat: stream, layers: n_layer,
     store: "n_layer*3*d*d_ff*2", read: "n_layer*3*d*d_ff*2"}
  - {id: w_emb,  label: "가중치 · 임베딩", share: 공유, pat: gather, layers: 1, store: "2*V*d", read: "2*B*d", note: "토큰 B개의 행만 읽음"}
  - {id: w_head, label: "가중치 · LM head", share: 공유, pat: stream, layers: 1, store: "2*V*d", read: "2*V*d"}
  - {id: kv_full, label: "KV cache · full 16층", share: 요청별, pat: stream, layers: L_full,
     store: "L_full*B*T*2*n_kv_f*d_hf*2", read: "L_full*B*T*2*n_kv_f*d_hf*2", write: "L_full*B*2*n_kv_f*d_hf*2",
     note: "GQA KV head 4 · BF16 · 토큰당 4,096 B/층"}
  - {id: state,  label: recurrent state, block: {t: [ssm_state]},  layers: n_lin}
  - {id: conv,   label: conv state,      block: {t: [conv_state]}, layers: n_lin}
  - {id: temp,   label: 커널 사이 중간값, block: {rest: true}, layers: n_lin, note: "linear 층만 — full 층 중간값은 뺌"}

# 메모리 옆에서 한 번에 처리한다고 볼 커널 묶음 (dsa-v32/model.yaml groups와 같은 규칙)
groups:
  - {ids: [K3],         label: "state 갱신"}
  - {ids: [K2, K3, K4], label: "합성곱 + state 갱신 + gate 정규화"}
