# Qwen3.8-Flash-Next QSA 층 (Qwen Sparse Attention) — 층 1개 · decode 1스텝 연산 그래프 (HW와 무관)
#
# QSA = 토큰을 고정 크기 micro-block(b=4)으로 묶어 블록 키 하나로 대표하고, 블록 점수로 상위 블록(예산 2,048토큰 = 512블록)만
#       골라 그 블록 안 토큰 전체로 GQA attention (q head 24 · KV head 2 · head 256 · 출력 gate).
# - 블록 키는 b토큰마다 1줄 → 스텝당 쓰기를 1/b로 나눠 셈. KV는 BF16 K + V = 2,048 B/토큰
# - 색인: index_qk_proj [640 × 2560]이 색인 q(4 × 128)와 색인 k(128)를 같이 만들고 Q/K RMSNorm. head 가중치 투영 없음 —
#   블록 점수 = head 4개의 ReLU(q · 블록 키) 합 (Qwen3.8 기술 보고서 식 12–15). 블록 키 = 색인 k 4개 평균 → RMSNorm → 부분 RoPE
# - 참조 구현 검증 없음: config · 체크포인트 shape + 위키 01-attention 3.5(QSA)로 세운 식. 블록 키 형식(BF16 256 B)은 배포 선택

model: Qwen3.8-Flash-Next (QSA · 블록 선택)
scope: QSA 층 1개 · decode 1스텝 · attention 블록 (MoE · GDN 층 제외)

dims:
  B:      {value: 1, short: 요청, desc: 동시 요청 수, var: true}
  T:      {value: 131072, short: 토큰, desc: 컨텍스트 길이, var: true}
  d:      {value: 2560, short: hidden 폭, desc: hidden 폭}
  n_q:    {value: 24, short: q head, desc: attention head 수}
  n_kv:   {value: 2, short: KV head, desc: num_key_value_heads}
  d_h:    {value: 256, short: head 폭, desc: head_dim}
  n_I:    {value: 4, short: 색인 head, desc: indexer_n_heads}
  d_I:    {value: 128, short: 색인 폭, desc: indexer_head_dim}
  b:      {value: 4, short: 블록 크기, desc: "indexer_compress_ratio — 토큰 4개가 블록 1개"}
  k:      {value: 2048, short: 선택 토큰, desc: "indexer_budget — 고르는 토큰 수 (블록 512개)"}
  n_layer: {value: 48, short: 층 수, desc: "전체 층 수 = GDN 36 + QSA 12"}
  n_qsa:  {value: 12, short: QSA 층 수, desc: QSA 층 수}
  T_max:  {value: 262144, short: 지원 길이, desc: max_position_embeddings}

formats:
  kv_row:
    desc: KV 1줄(토큰) 바이트
    title: KV cache 1줄 형식
    ui: true
    options:
      bf16: {value: 2048, label: "BF16 2,048 B (배포)", desc: "K · V × KV head 2 × 256 × BF16"}
      fp8:  {value: 1024, label: "FP8 1,024 B (가정)", desc: "같은 값 FP8"}
    default: bf16
  idx_row:
    desc: 블록 키 1줄 바이트
    options:
      bf16: {value: 256, desc: "128값 × BF16 (배포 선택 — 엔진 형식 확인 필요)"}
    default: bf16

kinds:
  weight: {label: 가중치,       share: 공유,   color: gray,   persistent: true, desc: 모든 요청이 같이 쓴다}
  kv:     {label: KV cache,     share: 요청별, color: blue,   persistent: true, desc: "요청마다 T줄 — 고른 블록만 읽음"}
  idxk:   {label: 블록 키,      share: 요청별, color: orange, persistent: true, desc: "4토큰마다 1줄 — 매 스텝 전부 읽음"}
  inter:  {label: 중간 결과,    share: 요청별, color: yellow, desc: 점수 · 부분합처럼 커널 사이에서 잠깐 쓰는 데이터}
  sel:    {label: 선택 위치,    share: 요청별, color: pink,   desc: top-k 결과}
  act:    {label: 토큰 벡터,    share: 요청별, color: violet, desc: 토큰 1개짜리 중간 결과 벡터}

tensors:
  W_q:   {label: W_q,  shape: [d, 2*n_q*d_h], bytes: 2*d*2*n_q*d_h, kind: weight, desc: "x → q + 출력 gate (2배)"}
  W_kv:  {label: W_kv, shape: [d, 2*n_kv*d_h], bytes: 2*d*2*n_kv*d_h, kind: weight, desc: x → K · V}
  W_Iqk: {label: W_Iqk, shape: [d, n_I*d_I+d_I], bytes: 2*d*(n_I*d_I+d_I), kind: weight, desc: "x → 색인 q(4 × 128) + 색인 k(128) — index_qk_proj [640 × 2560]"}
  W_o:   {label: W_o,  shape: [n_q*d_h, d],   bytes: 2*n_q*d_h*d,   kind: weight, desc: 출력 투영}
  kv_cache:  {label: KV cache, shape: [B, T, 2*n_kv*d_h], bytes: B*T*kv_row, kind: kv, desc: "토큰마다 K · V (KV head 2 × 256)"}
  blk_cache: {label: 블록 키, shape: [B, T/b, d_I], bytes: B*(T/b)*idx_row, kind: idxk, desc: "4토큰의 색인 키를 묶은 블록 키 (학습 없는 고정 묶기)"}
  x:       {label: x,        shape: [B, d],            bytes: 2*B*d,          kind: act}
  q:       {label: q · gate, shape: [B, 2*n_q, d_h],   bytes: 2*B*2*n_q*d_h,  kind: act}
  kv_new:  {label: KV 새 줄, shape: [B, 2*n_kv*d_h],   bytes: B*kv_row,       kind: kv}
  qI:      {label: 색인 q,   shape: [B, n_I, d_I],     bytes: 2*B*n_I*d_I,    kind: act}
  kI_new:  {label: 블록 키 새 줄, shape: [B, d_I],     bytes: B*idx_row/b,    kind: idxk, desc: "4토큰마다 1줄 — 스텝당 1/4줄"}
  logits:  {label: head별 블록 점수, shape: [B, n_I, T/b], bytes: 4*B*n_I*T/b, kind: inter}
  s:       {label: 블록 점수, shape: [B, T/b],         bytes: 4*B*T/b,        kind: inter}
  idx:     {label: 선택 블록, shape: [B, k/b],         bytes: 4*B*k/b,        kind: sel, desc: 고른 블록 512개 번호}
  kv_sel:  {label: 선택 KV,   shape: [B, k, 2*n_kv*d_h], bytes: B*k*kv_row,   kind: kv, desc: "고른 블록 안 토큰 2,048줄 (4줄씩 연속)"}
  sc:      {label: attention 점수, shape: [B, n_q, k], bytes: 4*B*n_q*k,      kind: inter}
  p:       {label: 확률,      shape: [B, n_q, k],      bytes: 2*B*n_q*k,      kind: inter}
  o_u:     {label: o (gate 전), shape: [B, n_q, d_h],  bytes: 4*B*n_q*d_h,    kind: inter}
  o:       {label: o,         shape: [B, n_q, d_h],    bytes: 2*B*n_q*d_h,    kind: act, desc: 출력 gate를 곱한 head 출력}
  y:       {label: y,         shape: [B, d],           bytes: 2*B*d,          kind: act}

steps:
  - {id: p1, group: 투영, label: 입력 투영, unit: gemm, prec: bf16, in: [x, W_q, W_kv], out: [q, kv_new], flops: 2*B*d*(2*n_q*d_h+2*n_kv*d_h), desc: "같은 x로 q · 출력 gate와 K · V 1줄을 만든다."}
  - {id: p2, group: 투영, label: KV cache 쓰기, unit: mem, viz: append, in: [kv_new], out: [kv_cache], elems: B*2*n_kv*d_h, desc: KV 1줄을 끝에 붙인다.}
  - {id: i1, group: 색인 투영, label: 색인 q · k, unit: gemm, prec: bf16, in: [x, W_Iqk], out: [qI], flops: 2*B*d*(n_I*d_I+d_I), desc: "색인 q(head 4개 × 128)와 색인 k 1개 → Q/K RMSNorm · 부분 RoPE."}
  - {id: i2, group: 색인 투영, label: 블록 키 쓰기, unit: mem, viz: append, in: [x], out: [blk_cache], elems: B*d_I/b, desc: "4토큰마다 색인 k 4개를 평균 → RMSNorm → 부분 RoPE로 블록 키 1줄을 쓴다 (학습 없는 묶기)."}
  - {id: i3, group: 블록 점수, label: 블록 점수 (head별), unit: gemm, prec: bf16, in: [qI, blk_cache], out: [logits], flops: 2*B*n_I*d_I*T/b, desc: "색인 q를 블록 키 T/4줄 전부와 내적한다."}
  - {id: i4, group: 블록 점수, label: ReLU · head 합, unit: vec, viz: reduce, in: [logits], out: [s], flops: 2*B*n_I*T/b, desc: "head 4개의 ReLU 점수를 더해 블록마다 1개로 (head 가중치 없음)."}
  - {id: s1, group: 선택, label: top-k 블록, unit: sel, viz: select, in: [s], out: [idx], elems: B*T/b, desc: "T/4개 블록 중 상위 512개 (토큰 2,048개)."}
  - {id: a1, group: 블록 attention, label: 블록 gather, unit: gather, viz: gather, in: [idx, kv_cache], out: [kv_sel], elems: B*k*2*n_kv*d_h, desc: "고른 블록 512개(4줄씩 연속)의 K · V를 모은다."}
  - {id: a2, group: 블록 attention, label: QK 점수, unit: gemm, prec: bf16, in: [q, kv_sel], out: [sc], flops: 2*B*n_q*d_h*k, desc: "q head 24개 × 2,048줄 (KV head 1개를 q head 12개가 공유)."}
  - {id: a3, group: 블록 attention, label: softmax, unit: vec, in: [sc], out: [p], elems: B*n_q*k, desc: online softmax.}
  - {id: a4, group: 블록 attention, label: PV, unit: gemm, prec: bf16, in: [p, kv_sel], out: [o_u], flops: 2*B*n_q*d_h*k, desc: 확률로 V를 가중합한다.}
  - {id: a5, group: 블록 attention, label: 출력 gate, unit: vec, in: [o_u, q], out: [o], flops: 4*B*n_q*d_h, desc: "q와 함께 만든 gate로 sigmoid(gate) × o (커널 끝에서)."}
  - {id: o1, group: 출력, label: 출력 투영, unit: gemm, prec: bf16, in: [o, W_o], out: [y], flops: 2*B*n_q*d_h*d, desc: "6,144폭을 hidden 2,560으로."}

phases:
  - {id: P1, focus: p1, label: "쿼리 · KV 만들기", tag: "기존 GQA", tag_style: plain, steps: [p1, p2], plain: "q · gate와 KV 1줄을 만들어 KV cache 끝에 붙인다"}
  - {id: P2, focus: i3, label: "블록 점수 매기기", tag: "QSA 추가", tag_style: strong, steps: [i1, i2, i3, i4], plain: "4토큰 블록 키 T/4줄 전부와 비교해 블록마다 점수"}
  - {id: P3, focus: s1, label: "512블록 고르기", tag: "QSA 추가", tag_style: strong, steps: [s1], plain: "점수 상위 512블록(토큰 2,048개)만 남긴다"}
  - {id: P4, focus: a1, label: "고른 블록으로 attention", tag: "QSA로 변경", tag_style: outline, steps: [a1, a2, a3, a4, a5], plain: "고른 블록 안 토큰 2,048줄만 읽어 attention, 출력 gate까지"}
  - {id: P5, focus: o1, label: "출력 투영", tag: "기존 GQA", tag_style: plain, steps: [o1], plain: "head 출력을 hidden 폭으로"}

page:
  file: qsa-qwen38
  nav: "Hybrid · Qwen3.8-Flash-Next (GDN + QSA)"
  doc_title: QSA 데이터 이동
  lite:
    doc_title: QSA 데이터 이동
    sub: "Qwen3.8-Flash-Next · QSA(블록 선택) 층 1개 · 새 토큰 1개 생성(decode) · H200"
  crumbs: [Hybrid attention · linear + sparse, Qwen3.8-Flash-Next · QSA, 층 1개 · decode 1스텝]
  scope:
    - "Qwen3.8-Flash-Next 차원 · QSA 층 1개 · decode 1스텝 · attention 블록만. GDN 36층 · MoE는 데이터 성격 패널의 모델 전체에 식으로 포함"
    - "블록 키는 4토큰마다 1줄 → 스텝당 쓰기를 1/4로 나눠 셈(여러 스텝 평균). 블록 키 BF16 256 B는 배포 선택"
    - "블록 수 = floor(T/4). 미완성 꼬리 0~3토큰은 항상 함께 읽음 — 이번 조건(T가 4의 배수)에서는 0"
    - "커널 묶음은 DSA 경로(색인 → top-k → sparse attention)를 블록 단위로 바꾼 것으로 단순화"
    - "hyper-connection · PLE 투영 · n-gram 표(host)는 데이터 성격 패널의 모델 전체에만 넣음"
    - "이론 시간 = max(바이트 ÷ 4.8 TB/s, FLOP ÷ 피크). 가중치 · KV BF16"
  verify:
    - "참조 구현 검증 없음 — config 값 + 위키 01-attention 3.5(QSA)로 세운 식"

sources:
  - {label: "Qwen3.8-Flash-Next config.json", ref: "48층 = GDN 36 + full(QSA) 12 · hidden 2560 · q head 24 · KV head 2 · head 256 · indexer head 4 × 128 · compress_ratio 4 · budget 2048 · MoE 512개 중 10개"}
  - {label: "위키 01-attention 3.5 (QSA) · 02-linear-attention", ref: "micro-block 묶기 → 블록 점수 → 상위 블록 gather, GDN과 3:1 교차"}
