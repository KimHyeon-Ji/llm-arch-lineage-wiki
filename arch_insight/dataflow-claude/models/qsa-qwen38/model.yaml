# Qwen3.8-Flash-Next 모델 전체 — 약식 뷰어 "데이터 성격 한눈에" · tools/traits.py(보고서 그림)가 읽음
#
# 48층 = GDN 36 + QSA 12 (3:1). block = QSA 층 1개(algo · map) × 12.
# GDN 층(식): linear key head 16 · value head 48 · 128 × 128, conv 4, state FP32 (Qwen3.6과 같은 층 구조, hidden만 2,560)
# MoE: 48층 모두, expert 512개 중 10개 + shared 1개, 폭 640, BF16
# n-gram 임베딩 · PLE · hyper-connection · MTP는 뺌
# config: reports/llm-memory-requirements/data/raw/cfg_Qwen_Qwen3.8-Flash-Next.json

model: Qwen3.8-Flash-Next
layer_label: QSA 층 1개
deploy: {n_gpu: 2, desc: "H200 2장 — BF16 가중치 약 250 GB"}

dims:
  L_gdn:   {value: 36,     desc: GDN 층 수}
  g_k:     {value: 16,     desc: GDN key head 수}
  g_v:     {value: 48,     desc: GDN value head 수}
  g_d:     {value: 128,    desc: GDN head 폭}
  g_C:     {value: 10240,  desc: "GDN conv 채널 = 2 × 16 × 128 + 48 × 128"}
  d_moe:   {value: 640,    desc: expert FFN 폭}
  E:       {value: 512,    desc: routed expert 수}
  E_k:     {value: 10,     desc: 토큰당 고르는 expert 수}
  E_s:     {value: 1,      desc: shared expert 수}
  V:       {value: 248320, desc: 어휘 수}

derived:
  E_hit: {expr: "E*(1-(1-E_k/E)**B)", desc: "요청 B개가 건드리는 expert 수 기댓값 — 균등 라우팅 가정"}

data:
  - {id: w_qsa,  label: "가중치 · QSA attention", short: QSA attention, group: attention 가중치, block: {kind: weight}, layers: n_qsa}
  - {id: w_gdn,  label: "가중치 · GDN attention", short: GDN attention, group: attention 가중치, color: gray, share: 공유, layers: L_gdn,
     store: "L_gdn*2*(d*(g_C + g_v*g_d + 2*g_v) + g_v*g_d*d + 4*g_C)",
     read:  "L_gdn*2*(d*(g_C + g_v*g_d + 2*g_v) + g_v*g_d*d + 4*g_C)", note: "BF16 · qkv · z · β · 감쇠 · 출력 · conv"}
  - {id: w_moe,  label: "가중치 · MoE expert", short: MoE expert, group: MoE 가중치, color: gray-l, share: 공유, layers: n_layer,
     store: "n_layer*((E+E_s)*3*d*d_moe*2 + 2*d*E)", read: "n_layer*((E_hit+E_s)*3*d*d_moe*2 + 2*d*E)",
     note: "BF16 · router 포함. 읽기 = 요청들이 건드린 expert만 (균등 라우팅 가정)"}
  - {id: w_head, label: "가중치 · LM head", short: LM head, group: "LM head · 임베딩", color: gray-ll, share: 공유, layers: 1, store: "2*V*d", read: "2*V*d"}
  - {id: w_emb,  label: "가중치 · 임베딩", short: 임베딩, group: "LM head · 임베딩", color: gray-ll, share: 공유, layers: 1, store: "2*V*d", read: "2*B*d", note: "토큰 B개의 행만 읽음"}
  - {id: kv,     label: "KV cache · QSA 12층", short: KV cache (QSA 12층), group: KV cache, block: {t: [kv_cache]}, layers: n_qsa}
  - {id: blk,    label: 블록 키, short: 블록 키, group: 블록 키, block: {t: [blk_cache]}, layers: n_qsa}
  - {id: state,  label: "recurrent state · GDN 36층", short: GDN state, group: recurrent state, color: green, share: 요청별, layers: L_gdn,
     store: "L_gdn*B*g_v*g_d*g_d*4", read: "L_gdn*B*g_v*g_d*g_d*4", write: "L_gdn*B*g_v*g_d*g_d*4", note: "FP32 · 매 스텝 전부 읽고 다시 씀"}
  - {id: conv,   label: "conv state · GDN 36층", short: conv state, group: conv state, color: pink, share: 요청별, layers: L_gdn,
     store: "L_gdn*B*g_C*3*2", read: "L_gdn*B*g_C*3*2", write: "L_gdn*B*g_C*3*2", note: "최근 3토큰 · BF16"}
  - {id: temp,   label: 커널 사이 중간값, short: "q · 점수 · 선택 블록 등", group: 커널 사이 중간값, color: yellow, block: {rest: true}, layers: n_qsa, note: "QSA 층만 — GDN 층 중간값은 뺌"}
