# DeepSeek-V3.2 DSA — 층 1개 · decode 1스텝 연산 그래프 (HW와 무관)
#
# - shape · bytes · flops는 차원 식이다. build.py가 실제 차원(T = 131,072)의 meta 실행으로
#   ref_decode.py의 텐서 shape · GEMM FLOP과 맞는지 검사한다.
# - bytes는 배포 저장 형식 기준이다 (계산 정밀도와 다를 수 있음). kv_row · idx_row는 형식 변수.
# - 범위: attention 블록만 (input RMSNorm 이후 ~ o_proj 출력). 잔차 · MoE · FFN 제외.

model: DeepSeek-V3.2 (DSA · lightning indexer + 흡수형 MLA)
scope: 층 1개 · decode 1스텝 · attention 블록 (MoE · FFN 제외)

dims:
  B:      {value: 1, short: 요청,      desc: 동시 요청 수, var: true}
  T:      {value: 131072, short: 토큰, desc: 컨텍스트 길이 (새 토큰 포함), var: true}
  d:      {value: 7168, short: hidden 폭,   desc: hidden 폭}
  c_q:    {value: 1536, short: q latent 폭,   desc: q latent 폭 (q_lora_rank)}
  c_kv:   {value: 512, short: KV latent,    desc: KV latent 폭 (kv_lora_rank)}
  n_h:    {value: 128, short: head,    desc: attention head 수}
  d_nope: {value: 128, short: nope 폭,    desc: head당 RoPE 없는 q·k 폭}
  d_rope: {value: 64, short: RoPE,     desc: RoPE 폭 (q · k 공통)}
  d_v:    {value: 128, short: V 폭,    desc: head당 V 폭}
  n_I:    {value: 64, short: 색인 head,     desc: 색인 head 수}
  d_I:    {value: 128, short: 색인 폭,    desc: 색인 head 폭}
  k:      {value: 2048, short: 선택 줄,   desc: top-k 선택 줄 수}
  n_layer: {value: 61,    short: 층 수,    desc: 전체 층 수 (보관량 계산용)}
  T_max:  {value: 163840, short: 지원 길이, desc: 학습 · 공식 지원 컨텍스트 (max_position_embeddings)}

formats:
  kv_row:
    desc: KV cache 1줄 바이트
    title: KV cache 1줄 형식
    ui: true
    options:
      fp8:  {value: 656,  label: "FP8 656 B (배포)", desc: "배포 형식 — c_kv 512 FP8 + scale 4개(FP32) + k_rope 64 BF16"}
      bf16: {value: 1152, label: "BF16 1,152 B (비교 기준)", desc: "구조 비교 기준 — 576값 × BF16"}
    default: fp8
  idx_row:
    desc: 색인 K 1줄 바이트
    options:
      fp8: {value: 132, desc: "128 FP8 + scale 1개(FP32)"}
    default: fp8

kinds:
  weight: {label: 가중치,       share: 공유,   color: gray,   persistent: true, desc: 모든 요청이 같이 쓴다 — B가 늘어도 그대로}
  kv:     {label: KV cache,     share: 요청별, color: blue,   persistent: true, desc: 요청마다 T줄 — 보관량이 가장 큼}
  idxk:   {label: 색인 K cache, share: 요청별, color: orange, persistent: true, desc: 요청마다 T줄 — 매 스텝 전부 읽음}
  inter:  {label: 중간 결과,    share: 요청별, color: yellow, desc: 점수 · 부분합처럼 커널 사이에서 잠깐 쓰는 데이터}
  sel:    {label: 선택 위치,    share: 요청별, color: pink, desc: top-k 결과}
  act:    {label: 토큰 벡터,    share: 요청별, color: violet, desc: 토큰 1개짜리 중간 결과 벡터(x · q 등). 앞 커널이 HBM에 쓰고 다음 커널이 읽음 — 작음}

tensors:
  # ── 가중치 (FP8, block scale 생략) ──
  W_qa:  {label: W_qa,  shape: [d, c_q],                   bytes: d*c_q,                  kind: weight, desc: x → q latent}
  W_kva: {label: W_kva, shape: [d, c_kv+d_rope],           bytes: d*(c_kv+d_rope),        kind: weight, desc: x → KV latent + k_rope}
  W_qb:  {label: W_qb,  shape: [c_q, n_h*(d_nope+d_rope)], bytes: c_q*n_h*(d_nope+d_rope), kind: weight, desc: q latent → head별 q}
  W_UK:  {label: W_UK,  shape: [n_h, d_nope, c_kv],        bytes: 2*n_h*d_nope*c_kv,      kind: weight, desc: "q_nope를 latent 공간으로 흡수 (BF16 가정 — 구현마다 다름)"}
  W_UV:  {label: W_UV,  shape: [n_h, c_kv, d_v],           bytes: 2*n_h*c_kv*d_v,         kind: weight, desc: "latent 출력 → head별 V 폭 (BF16 가정)"}
  W_o:   {label: W_o,   shape: [n_h*d_v, d],               bytes: n_h*d_v*d,              kind: weight, desc: 출력 투영}
  W_Iq:  {label: W_Iq,  shape: [c_q, n_I*d_I],             bytes: c_q*n_I*d_I,            kind: weight, desc: q latent → 색인 q}
  W_Ik:  {label: W_Ik,  shape: [d, d_I],                   bytes: d*d_I,                  kind: weight, desc: x → 색인 k}
  W_Iw:  {label: W_Iw,  shape: [d, n_I],                   bytes: 4*d*n_I,                kind: weight, desc: "x → 색인 head 가중치 (FP32 — HF _keep_in_fp32_modules)"}

  # ── 요청별 상주 데이터 (HBM) ──
  kv_cache:  {label: KV cache,     shape: [B, T, c_kv+d_rope], bytes: B*T*kv_row,  kind: kv,   trace: cache.kv, desc: "줄마다 c_kv(512) + k_rope(64). head 128개가 같은 줄을 공유 (MQA처럼)"}
  idx_cache: {label: 색인 K cache, shape: [B, T, d_I],         bytes: B*T*idx_row, kind: idxk, trace: cache.ik, desc: "줄마다 128값 FP8 + scale. head 64개가 같은 키를 공유"}

  # ── 활성값 · 중간값 ──
  x:      {label: x,      shape: [B, d],                 bytes: 2*B*d,                 kind: act,   desc: input RMSNorm 이후 hidden}
  q_a:    {label: q_a,    shape: [B, c_q],               bytes: 2*B*c_q,               kind: act}
  kv_a:   {label: kv_a,   shape: [B, c_kv+d_rope],       bytes: 2*B*(c_kv+d_rope),     kind: act}
  kv_new: {label: kv 새 줄, shape: [B, c_kv+d_rope],     bytes: B*kv_row,              kind: kv,    desc: 정규화 + RoPE를 마친 KV 1줄}
  qr:     {label: qr,     shape: [B, c_q],               bytes: 2*B*c_q,               kind: act,   desc: 정규화한 q latent — MLA와 색인이 같이 씀}
  q:      {label: q,      shape: [B, n_h, d_nope+d_rope], bytes: 2*B*n_h*(d_nope+d_rope), kind: act}
  q_full: {label: q_full, shape: [B, n_h, c_kv+d_rope],  bytes: 2*B*n_h*(c_kv+d_rope), kind: act,   desc: latent 공간 쿼리 (흡수 q 512 + q_rope 64)}
  qI:     {label: 색인 q, shape: [B, n_I, d_I],          bytes: B*n_I*(d_I+4),         kind: act,   desc: FP8 + head별 scale}
  kI:     {label: 색인 k 새 줄, shape: [B, d_I],         bytes: B*idx_row,             kind: idxk}
  wI:     {label: w,      shape: [B, n_I],               bytes: 4*B*n_I,               kind: act,   desc: head별 가중치 (q scale 포함)}
  logits: {label: head별 점수, shape: [B, n_I, T],       bytes: 4*B*n_I*T,             kind: inter, desc: head 64개 × T — 온칩에서 바로 축약하면 HBM에 안 씀}
  s:      {label: 색인 점수, shape: [B, T],              bytes: 4*B*T,                 kind: inter, desc: 토큰별 점수 1개 (FP32)}
  idx:    {label: 선택 위치, shape: [B, k],              bytes: 4*B*k,                 kind: sel,   desc: top-k 토큰 번호 (int32)}
  kv_sel: {label: 선택 KV, shape: [B, k, c_kv+d_rope],   bytes: B*k*kv_row,            kind: kv,    desc: 선택한 2,048줄}
  sc:     {label: attention 점수, shape: [B, n_h, k],    bytes: 4*B*n_h*k,             kind: inter}
  p:      {label: 확률,   shape: [B, n_h, k],            bytes: 2*B*n_h*k,             kind: inter}
  o_lat:  {label: o_lat,  shape: [B, n_h, c_kv],         bytes: 2*B*n_h*c_kv,          kind: act,   desc: latent 공간 출력}
  o:      {label: o,      shape: [B, n_h, d_v],          bytes: 2*B*n_h*d_v,           kind: act}
  y:      {label: y,      shape: [B, d],                 bytes: 2*B*d,                 kind: act,   desc: attention 출력 (잔차 더하기 전)}

# unit: gemm(행렬곱) · vec(원소별·정규화·축약) · sel(비교·선택) · gather(흩어진 행 모으기) · mem(쓰기)
# prec: 행렬곱 계산 정밀도 (이론 시간의 피크 성능 선택에 씀)
steps:
  - id: p1
    group: MLA 투영
    label: 입력 투영
    unit: gemm
    prec: fp8
    in: [x, W_qa, W_kva]
    out: [q_a, kv_a]
    flops: 2*B*d*(c_q+c_kv+d_rope)
    desc: 같은 x로 q latent(1536)와 KV latent(512) + k_rope(64)를 만든다.
  - id: p2
    group: MLA 투영
    label: KV 정규화 · RoPE
    unit: vec
    in: [kv_a]
    out: [kv_new]
    elems: B*(c_kv+d_rope)
    desc: c_kv에 RMSNorm, k_rope에 RoPE를 적용해 KV 1줄(576값)을 완성한다.
  - id: p3
    group: MLA 투영
    label: KV cache 쓰기
    unit: mem
    viz: append
    in: [kv_new]
    out: [kv_cache]
    elems: B*(c_kv+d_rope)
    desc: 새 줄 1개를 KV cache 끝에 붙인다 (배포 형식 FP8 656 B).
  - id: p4
    group: MLA 투영
    label: q 정규화 · 업투영
    unit: gemm
    prec: fp8
    in: [q_a, W_qb]
    out: [qr, q]
    flops: 2*B*c_q*n_h*(d_nope+d_rope)
    desc: q latent를 정규화(qr)하고 head 128개 × 192폭으로 펼친다.
  - id: p5
    group: MLA 투영
    label: q RoPE · W_UK 흡수
    unit: gemm
    prec: bf16
    in: [q, W_UK]
    out: [q_full]
    flops: 2*B*n_h*d_nope*c_kv
    desc: head마다 q_nope(128)에 W_UK를 곱해 latent 폭(512)으로 바꾼다. KV를 풀지 않고 latent 그대로 비교하기 위해서다.
  - id: i1
    group: 색인 투영
    label: 색인 q
    unit: gemm
    prec: fp8
    in: [qr, W_Iq]
    out: [qI]
    flops: 2*B*c_q*n_I*d_I
    desc: qr로 색인 q(head 64개 × 128)를 만들고 RoPE · Hadamard 회전 · FP8 양자화한다.
  - id: i2
    group: 색인 투영
    label: 색인 k
    unit: gemm
    prec: fp8
    in: [x, W_Ik]
    out: [kI]
    flops: 2*B*d*d_I
    desc: x로 색인 k 1줄(128)을 만들고 LayerNorm · RoPE · Hadamard · FP8 양자화한다.
  - id: i3
    group: 색인 투영
    label: 색인 K cache 쓰기
    unit: mem
    viz: append
    in: [kI]
    out: [idx_cache]
    elems: B*d_I
    desc: 새 색인 키 1줄(132 B)을 색인 K cache 끝에 붙인다.
  - id: i4
    group: 색인 투영
    label: head 가중치 w
    unit: gemm
    prec: bf16
    in: [x, W_Iw]
    out: [wI]
    flops: 2*B*d*n_I
    desc: 토큰마다 색인 head 64개의 가중치를 만든다. 점수 합산에 쓴다.
  - id: i5
    group: 색인 점수
    label: 색인 점수 (head별)
    unit: gemm
    prec: fp8
    in: [qI, idx_cache]
    out: [logits]
    flops: 2*B*n_I*d_I*T
    desc: 색인 q(64 head)를 T줄 색인 키 전부와 내적한다. 키 1줄을 head 64개가 재사용한다.
  - id: i6
    group: 색인 점수
    label: ReLU · head 가중합
    unit: vec
    viz: reduce
    in: [logits, wI]
    out: [s]
    flops: 2*B*n_I*T
    gemm_traced: true
    desc: head별 점수에 ReLU를 씌우고 w로 가중합해 토큰마다 점수 1개로 줄인다.
  - id: s1
    group: 선택
    label: top-k
    unit: sel
    viz: select
    in: [s]
    out: [idx]
    elems: B*T
    desc: T개 점수 중 상위 2,048개 위치를 고른다. 결과는 위치 번호뿐이다 (8 KB).
  - id: a1
    group: Sparse MLA
    label: KV gather
    unit: gather
    viz: gather
    in: [idx, kv_cache]
    out: [kv_sel]
    elems: B*k*(c_kv+d_rope)
    desc: 선택 위치의 KV 줄 2,048개를 흩어진 주소에서 모은다. top-k가 끝나야 주소가 정해진다.
  - id: a2
    group: Sparse MLA
    label: QK 점수
    unit: gemm
    prec: bf16
    in: [q_full, kv_sel]
    out: [sc]
    flops: 2*B*n_h*(c_kv+d_rope)*k
    desc: head 128개 × 선택 2,048줄. 모든 head가 같은 KV 줄을 쓴다.
  - id: a3
    group: Sparse MLA
    label: softmax
    unit: vec
    in: [sc]
    out: [p]
    elems: B*n_h*k
    desc: head마다 2,048개 점수를 확률로 바꾼다 (커널 안에서는 online softmax).
  - id: a4
    group: Sparse MLA
    label: PV
    unit: gemm
    prec: bf16
    in: [p, kv_sel]
    out: [o_lat]
    flops: 2*B*n_h*c_kv*k
    desc: 확률로 선택 KV의 c_kv(512) 부분을 가중합한다. V를 따로 저장하지 않고 latent를 V로 쓴다.
  - id: o1
    group: 출력
    label: W_UV 풀기
    unit: gemm
    prec: bf16
    in: [o_lat, W_UV]
    out: [o]
    flops: 2*B*n_h*c_kv*d_v
    desc: head마다 latent 출력(512)을 V 폭(128)으로 바꾼다.
  - id: o2
    group: 출력
    label: 출력 투영
    unit: gemm
    prec: fp8
    in: [o, W_o]
    out: [y]
    flops: 2*B*n_h*d_v*d
    desc: head 출력 16,384폭을 hidden 7,168로 투영한다.

# 화면의 "흐름 한눈에" 5단계. tag: 기존 MLA · DSA 추가 · DSA로 변경
phases:
  - {id: P1, focus: p1, label: "쿼리 · KV 만들기", tag: "기존 MLA", tag_style: plain,   steps: [p1, p2, p3, p4, p5], plain: "새 토큰으로 q와 KV 1줄을 만들고 KV cache 끝에 붙인다"}
  - {id: P2, focus: i5, label: "색인 점수 매기기", tag: "DSA 추가", tag_style: strong,   steps: [i1, i2, i3, i4, i5, i6], plain: "지난 모든 토큰의 색인 키와 비교해 토큰마다 점수를 낸다"}
  - {id: P3, focus: s1, label: "2,048개 고르기", tag: "DSA 추가", tag_style: strong,   steps: [s1], plain: "점수 상위 2,048개 토큰의 위치만 남긴다"}
  - {id: P4, focus: a1, label: "고른 KV로 attention", tag: "DSA로 변경", tag_style: outline, steps: [a1, a2, a3, a4], plain: "고른 2,048줄만 모아 읽고 attention을 계산한다"}
  - {id: P5, focus: o2, label: "출력 투영", tag: "기존 MLA", tag_style: plain,   steps: [o1, o2], plain: "head 출력을 hidden 폭으로 되돌린다"}

# 뷰어 페이지 문구 (viewer/template.html이 읽는다). {B:식} = 바이트, {N:식} = 숫자, {per}/{sum} = 요청이 여러 개일 때 문구, {sw:종류} = 색 표시
page:
  file: dsa-v32
  start: i5
  links:
    - {label: "Gated DeltaNet (Hybrid linear 층)", url: "https://kimhyeon-ji.github.io/llm-arch-lineage-wiki/arch_insight/dataflow-claude/viewer/gdn-qwen36.html"}
  doc_title: DSA 데이터 플로우
  lite:   # 약식 페이지 (viewer/template-lite.html)
    doc_title: DSA 데이터 이동
    sub: "DeepSeek-V3.2 · attention 층 1개 · 새 토큰 1개 생성(decode) · H200"
    sibling: {label: "Gated DeltaNet 약식", file: gdn-qwen36}
  title: "DSA 데이터 플로우 — 고르고, 모으고, 계산하는 동안 데이터는 어디로 가나"
  crumbs: [Sparse attention, DeepSeek-V3.2 · DSA, 층 1개 · decode 1스텝]
  sub: "새 토큰 1개를 생성할 때 DSA attention 층 하나에서 데이터가 HBM과 칩 사이를 어떻게 오가고 어디서 계산되는지 커널 단위로 보여 준다. MoE · FFN은 빼고 attention 블록만."
  t_hint: 길수록 색인 키 읽기가 비례해서 늘어난다
  flow_note: "DSA는 ②③을 더하고 ④를 바꾼다 · 카드 위 색 막대 = 그 단계가 주로 읽는 데이터 · 누르면 아래 그림의 해당 단계로"
  hl2: "DSA는 {sw:kv}KV를 {per}<b>{N:k}줄만</b> 읽는다({B:B*k*kv_row}{sum}). 대신 그 줄을 고르려고 {sw:idxk}<b>색인 키 {N:T}줄</b>을 {per}매 스텝 전부 읽는다({B:B*T*idx_row}{sum})."
  store: {expr: "B*T*(kv_row+idx_row)*n_layer", label: "61층 KV + 색인 키 보관"}
  sweep_cap: "막대 = 층 1개의 HBM 읽기 + 쓰기. 가중치(회색)는 T와 무관하고 색인 키(주황)는 T에 비례한다. KV(파랑)는 2,048줄만 읽어 거의 일정하다. 점선 오른쪽은 지원 길이 밖 외삽. 막대를 누르면 T가 바뀐다."
  scope:
    - "DeepSeek-V3.2 차원 · 층 1개 · decode 1스텝 · attention 블록만. 잔차 · MoE · FFN · 집합통신 제외"
    - "head 128개가 모두 GPU 1개에 있다고 가정(DP attention). TP로 head를 나누면 GPU당 가중치 · 연산이 줄어 K8 성격과 같아지는 B가 달라진다"
    - "커널 묶음은 SGLang · vLLM의 V3.2 경로를 대표로 단순화. 실제 융합 경계는 프레임워크 · 버전마다 다름"
    - "K8 split 수는 FlashMLA 공개 코드의 스케줄러 규칙(SM 절반 = 66 파트 · 64줄 블록 · 고정 비용 3)을 H200에 적용한 시뮬레이션"
    - "이론 시간 = max(바이트 ÷ 4.8 TB/s, FLOP ÷ 피크). 커널 실행 지연 · 동기화 · gather 비효율 미포함. top-k처럼 병렬성이 낮은 단계는 실제로 훨씬 길 수 있음"
    - "가중치는 FP8(블록 scale 생략), W_UK · W_UV는 BF16, W_Iw는 FP32(HF 기준) 가정"
    - "보관량 경고는 61층 KV + 색인 키만 셈. 가중치 · 활성 메모리는 빼서 실제 여유는 더 작다"
    - "격자에서 선택된 위치(진한 칸)는 설명용 예시 패턴. 실측 분포 아님"
  verify:
    - "참조 구현 ref_decode.py(흡수형 MLA + 2,048줄 gather) = HF DeepseekV32Attention(풀어 쓴 MLA + 마스크) 출력 일치, 상대 오차 1e-6 수준"
    - "실제 차원(T = 131,072) meta 실행으로 텐서 shape · GEMM FLOP 식 검사 {checks}"
    - "보고서 수치 재현: 색인 키 17.3 MB · 2.15 GFLOP · 124 FLOP/B · 선택 KV 2.36 MB(BF16)"

