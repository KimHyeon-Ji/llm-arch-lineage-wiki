# DeepSeek-V3.2 모델 전체 — 약식 뷰어 "데이터 성격 한눈에" · tools/ledger.py가 읽음
#
# - block 항목 = algo.yaml · map-gpu.yaml의 attention 층 1개 값 × layers.
#     kind: 그 종류의 텐서 전부 · t: 텐서 목록 · rest: 다른 block 항목이 가져가지 않은 나머지(커널 사이 중간값)
#     보관 = 해당 텐서 바이트 합, 스텝당 읽기 · 쓰기 = 커널 HBM 이동(via 기준) 합
# - 식 항목 = attention 밖(FFN · MoE · 임베딩 · LM head). config 값으로 적는다.
# - 식의 차원 = algo.yaml dims + 아래 dims · derived. B · T는 조건마다 바뀐다.
# - 성격(read-only · 끝에 추가 · 전부 다시 씀 · 임시)은 적지 않는다 — 뷰어가 보관 · 쓰기 값에서 판정한다.
# - color = 뷰어 색 토큰 (없으면 텐서 종류 색). short = 성격 표에서 쓰는 짧은 이름
# config: reports/llm-memory-requirements/data/raw/cfg_deepseek-ai_DeepSeek-V3.2.json

model: DeepSeek-V3.2
deploy: {n_gpu: 8, desc: "H200 8장 1대 — FP8 가중치 약 680 GB를 나눠 담음. DP attention의 가중치 복제는 뺌"}

dims:
  L_dense: {value: 3,      desc: dense FFN 층 수 (first_k_dense_replace)}
  L_moe:   {value: 58,     desc: MoE 층 수}
  d_ff:    {value: 18432,  desc: dense FFN 폭}
  d_moe:   {value: 2048,   desc: expert FFN 폭}
  E:       {value: 256,    desc: routed expert 수}
  E_k:     {value: 8,      desc: 토큰당 고르는 expert 수}
  E_s:     {value: 1,      desc: shared expert 수}
  V:       {value: 129280, desc: 어휘 수}

derived:
  E_hit: {expr: "E*(1-(1-E_k/E)**B)", desc: "요청 B개가 건드리는 expert 수 기댓값 — 균등 라우팅 가정 (쏠림이 있으면 더 적음)"}

data:
  - {id: w_attn, label: "가중치 · attention", short: attention, group: attention 가중치, block: {kind: weight}, layers: n_layer}
  - {id: w_ffn,  label: "가중치 · dense FFN", short: dense FFN, group: "MoE · FFN 가중치", color: gray-l, share: 공유, layers: L_dense,
     store: "L_dense*3*d*d_ff", read: "L_dense*3*d*d_ff", note: "FP8"}
  - {id: w_moe,  label: "가중치 · MoE expert", short: MoE expert, group: "MoE · FFN 가중치", color: gray-l, share: 공유, layers: L_moe,
     store: "L_moe*((E+E_s)*3*d*d_moe + 2*d*E)", read: "L_moe*((E_hit+E_s)*3*d*d_moe + 2*d*E)",
     note: "FP8 · router 포함. 읽기 = 요청들이 건드린 expert만 (균등 라우팅 가정 기댓값)"}
  - {id: w_head, label: "가중치 · LM head", short: LM head, group: "LM head · 임베딩", color: gray-l, share: 공유, layers: 1,
     store: "2*V*d", read: "2*V*d", note: "BF16"}
  - {id: w_emb,  label: "가중치 · 임베딩", short: 임베딩, group: "LM head · 임베딩", color: gray-l, share: 공유, layers: 1,
     store: "2*V*d", read: "2*B*d", note: "BF16 · 토큰 B개의 행만 읽음"}
  - {id: kv,     label: KV cache,     short: KV cache,     group: KV cache,     block: {t: [kv_cache]},  layers: n_layer}
  - {id: idxk,   label: 색인 K cache, short: 색인 K cache, group: 색인 K cache, block: {t: [idx_cache]}, layers: n_layer}
  - {id: temp,   label: 커널 사이 중간값, short: "q · 점수 · 선택 위치 · split 부분 출력", group: 커널 사이 중간값, color: yellow, block: {rest: true}, layers: n_layer}
