<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 약식 — 보고서 그림 문법(연한 레인 패널 · 흰 카드 · 굵은 수치). 위 "흐름 한눈에" = 단계별 HBM 막대 + 칩 레인,
   아래 "커널별 이동" = HBM 레인 | 굵은 화살표(굵기 = 바이트) | 칩 레인 3열. 커널 칸을 누르면 텐서 모양이 아래로 펼쳐진다.
   색 = 데이터 종류 (yaml kinds.color). 설명 문장 · 결론은 보고서(report/)에 둔다. */
:root {
  --bg: #f1f3f8; --surface: #ffffff; --surface2: #f6f7fb; --lane: #f2f4f9; --tint: #eef0f6; --hbm-r: #2f4b8c; --hbm-w: #c0304f;
  /* 화면 틀 — 진한 남색 블록 · 보라 강조 · 옅은 띠 (데이터 색과 별개) */
  --navy: #4a5573; --navy-d: #2f3850; --navy-chip: #6a7499; --on-navy: #d9deeb; --white: #ffffff;
  --purple: #7b61c9; --purple-t: #ebe5fa; --slate-t: #e3e6ef; --band: #eef0f6;
  --ink: #2b2f3a; --ink2: #4a5573; --muted: #6b7080; --line: #dfe2ec; --line2: #e6e8f1; --axis: #9aa0b0;
  --c-gray: #9c9a92; --c-gray-l: #dddcd6; --c-blue: #2a78d6; --c-blue-l: #b7d3f6; --c-orange: #eb6834; --c-orange-l: #f8c6b1;
  --c-green: #1baf7a; --c-green-l: #a9e0cb; --c-yellow: #eda100; --c-yellow-l: #f7d98f; --c-pink: #e87ba4; --c-pink-l: #f6c9da; --c-violet: #6250d6; --c-violet-l: #d6d1f5; --c-gray-ll: #efeeea;
  --font-text: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --bridge: #f8f9fc;
  --l-svc: #2f4b8c; --l-req: #5b74b8; --l-step: #a9b8e2;   /* 수명 — 길수록 진한 남색 */
  --cols: 290px 232px minmax(0, 1fr);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --surface: #1a1d24; --surface2: #20242c; --lane: #1f232b; --tint: #262a33; --bridge: #1d2027; --l-svc: #9db0ea; --l-req: #6b82c4; --l-step: #2f3b5e; --hbm-r: #7f9be0; --hbm-w: #ef7b93;
    --navy: #3d4767; --navy-d: #2c3550; --navy-chip: #5a6590; --on-navy: #c3cbe0; --purple: #8c74de; --purple-t: #2f2852; --slate-t: #2a2f3b; --band: #20242d;
    --ink: #eceef3; --ink2: #b6bfd3; --muted: #8b92a3; --line: #2f3440; --line2: #262b35; --axis: #5d6474;
    --c-gray: #8f8d86; --c-gray-l: #45443f; --c-blue: #3987e5; --c-blue-l: #1f3a5f; --c-orange: #d95926; --c-orange-l: #5a2f1c;
    --c-green: #199e70; --c-green-l: #1b4537; --c-yellow: #c98500; --c-yellow-l: #4f3c12; --c-pink: #d55181; --c-pink-l: #552538; --c-violet: #9085e9; --c-violet-l: #2f2a5c; --c-gray-ll: #34332f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --surface: #1a1d24; --surface2: #20242c; --lane: #1f232b; --tint: #262a33; --bridge: #1d2027; --l-svc: #9db0ea; --l-req: #6b82c4; --l-step: #2f3b5e; --hbm-r: #7f9be0; --hbm-w: #ef7b93;
    --navy: #3d4767; --navy-d: #2c3550; --navy-chip: #5a6590; --on-navy: #c3cbe0; --purple: #8c74de; --purple-t: #2f2852; --slate-t: #2a2f3b; --band: #20242d;
  --ink: #eceef3; --ink2: #b6bfd3; --muted: #8b92a3; --line: #2f3440; --line2: #262b35; --axis: #5d6474;
  --c-gray: #8f8d86; --c-gray-l: #45443f; --c-blue: #3987e5; --c-blue-l: #1f3a5f; --c-orange: #d95926; --c-orange-l: #5a2f1c;
  --c-green: #199e70; --c-green-l: #1b4537; --c-yellow: #c98500; --c-yellow-l: #4f3c12; --c-pink: #d55181; --c-pink-l: #552538; --c-violet: #9085e9; --c-violet-l: #2f2a5c; --c-gray-ll: #34332f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px; font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 30px; font-weight: 800; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.mono { font-family: var(--font-mono); }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--c-blue); outline-offset: 2px; }

header.top { display: flex; flex-direction: column; gap: 6px; padding: 2px; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.crumb { font-size: 12px; font-weight: 700; color: var(--ink2); background: var(--tint); border-radius: 999px; padding: 2px 10px; }
.h1row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.litechip { font-size: 12.5px; font-weight: 800; color: var(--white); background: var(--purple); border-radius: 7px; padding: 3px 10px; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.links a { font-size: 13px; color: var(--ink2); font-weight: 700; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--surface); }
.links a.main { background: var(--ink2); color: var(--surface); border-color: var(--ink2); }
.links .navcur { font-size: 13px; font-weight: 800; color: var(--white); background: var(--navy); border: 1px solid var(--navy); border-radius: 999px; padding: 3px 12px; }
.links a:hover { border-color: var(--ink); }

.panel { background: var(--surface); border: 1px solid var(--line2); border-radius: 16px; padding: 18px 22px 20px; min-width: 0; box-shadow: 0 1px 2px rgba(30, 40, 70, 0.04); }
/* 섹션 제목 = 옅은 띠 + 왼쪽 남색 강조선 */
.blk { position: relative; overflow: hidden; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 16px; background: var(--band); border-radius: 10px; padding: 10px 14px 10px 22px; }
.blk::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--navy); }
.blk .name { font-size: 17px; font-weight: 800; }
.blk .what { font-size: 13px; color: var(--muted); }

/* 조건 + 범례 */
.ctlbar { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; padding: 12px 16px; }
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl .cl { font-size: 13px; font-weight: 800; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 4px 11px; border: 0; border-radius: 999px; background: transparent; color: var(--ink2); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button:hover { background: var(--tint); }
.seg button.ext { color: var(--muted); font-style: italic; }
.seg button[aria-pressed=true] { background: var(--navy); color: var(--white); font-weight: 800; font-style: normal; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); width: 100%; padding-top: 10px; border-top: 1px solid var(--line2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 4px; }
.legend .ar { font-weight: 800; color: var(--ink); }
.legend .dash { width: 18px; height: 11px; border: 1.5px dashed var(--ink2); border-radius: 6px; background: transparent; }

.scroll { overflow-x: auto; }
#sum svg { display: block; width: 100%; min-width: 900px; height: auto; }
svg text { fill: var(--ink); font-family: var(--font-text); }
svg .t-muted { fill: var(--muted); }
svg .t-inv { fill: var(--surface); }
svg .t-mono { font-family: var(--font-mono); }
svg .lane { fill: var(--lane); }
svg .box { fill: var(--navy); }
svg .boxhit { cursor: pointer; }
svg .boxhit:hover .box { fill: var(--navy-d); }
svg .t-white { fill: var(--white); }
svg .t-onnavy { fill: var(--on-navy); }
svg .t-purple { fill: var(--purple); }
svg .t-navy { fill: var(--navy); }

/* 커널별 이동 */
.kgrid { display: grid; grid-template-columns: var(--cols); min-width: 900px; position: relative; }
.lane-bg { background: var(--lane); border-radius: 14px; }
.lh { padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 1px; }
.lh b { align-self: flex-start; font-size: 15px; font-weight: 800; color: var(--white); background: var(--navy); border-radius: 8px; padding: 3px 13px; margin-bottom: 4px; }
.lh span { font-size: 12.5px; color: var(--muted); }
.lh.mid { justify-content: flex-end; align-items: center; text-align: center; padding: 14px 6px 8px; }
.lh.mid span { font-size: 12px; }
.phrow { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 30px 18px 14px; scroll-margin-top: 12px; }
.phrow .phn { font-size: 16px; font-weight: 800; }
.phrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }
/* 단계 태그: DSA 추가 = 보라 · DSA로 변경 = 연보라 · 기존 = 회청 */
.tag { font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; color: var(--navy); background: var(--slate-t); }
.tag.strong { background: var(--purple); color: var(--white); }
.tag.outline { background: var(--purple-t); color: var(--purple); }
/* 커널 1개 = 한 줄 묶음: HBM 카드(읽기 칸 + 쓰기 칸) · 화살표 띠 · 커널 카드가 같은 높이, 커널 사이에 간격 줄 */
.hcell { grid-column: 1; margin: 0 12px 0 14px; background: var(--surface); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.hcell.r { border-bottom: 0; border-radius: 12px 12px 0 0; padding: 16px 16px 14px; }
.hcell.w { border-top: 0; border-radius: 0 0 12px 12px; padding: 14px 16px 16px; position: relative; }
.hcell.w::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; border-top: 1px dashed var(--line); }
.hk-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.hk { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--white); background: var(--navy); border-radius: 6px; padding: 1px 7px; line-height: 1.5; }
.hk-row .hl-t { margin-bottom: 0; }
.bridge { grid-column: 2; background: var(--bridge); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2); }
.kgap { grid-column: 1 / -1; height: 30px; }
.hl-t { font-size: 12.5px; font-weight: 800; margin-bottom: 3px; color: var(--ink); }
.hl-i { display: grid; grid-template-columns: 11px minmax(0, 1fr) auto; gap: 7px; align-items: center; font-size: 12.5px; line-height: 1.75; }
.hl-i i { width: 10px; height: 10px; border-radius: 2px; }
.hl-i .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-i .b { color: var(--muted); font-size: 12px; }
.l2 { font-style: normal; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--muted); border: 1px dashed var(--axis); border-radius: 4px; padding: 0 4px; margin-right: 6px; line-height: 1.4; display: inline-block; }
.hl-i.sm { color: var(--muted); }
.hl-i.sm i { opacity: 0.7; }
.hl-i.zero { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--axis); }
.acell { grid-column: 2; display: flex; align-items: center; justify-content: center; margin: 0 -14px 0 -12px; padding: 18px 0; min-width: 0; position: relative; z-index: 1; }
.acell svg { display: block; overflow: visible; }
.acell .al { font-size: 12px; fill: var(--muted); font-weight: 700; }
.acell .ab { font-size: 16px; font-weight: 800; }
.kcard { grid-column: 3; margin: 0 14px; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 9px; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; cursor: pointer; min-width: 0; }
.kcard:hover { border-color: var(--navy); }
.kcard[aria-expanded=true] { border-color: var(--navy); box-shadow: 0 0 0 1.5px var(--navy); }
.khead { display: flex; align-items: center; gap: 10px; }
.kid { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; background: var(--navy); color: var(--white); border-radius: 6px; padding: 2px 8px; flex: none; }
.kname { font-size: 17.5px; font-weight: 800; }
.kchev { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--purple); background: var(--purple-t); border-radius: 999px; padding: 3px 12px; white-space: nowrap; flex: none; }
.kcard[aria-expanded=true] .kchev { background: var(--purple); color: var(--white); }
.kplain { font-size: 13px; color: var(--muted); }
.kchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.kchips .kcl { font-weight: 700; color: var(--muted); margin-right: 2px; }
.ocp { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--k); border-radius: 999px; padding: 1px 10px 1px 4px; background: var(--surface); }
.ocp em { font-style: normal; color: var(--muted); }
code.mb { font-family: var(--font-mono); font-size: 10px; font-weight: 700; background: var(--ink2); color: var(--surface); border-radius: 3px; padding: 1px 5px; }

/* 펼친 계산 단계 — 단계마다 한 줄: 입력 텐서 × 입력 텐서 → 출력 텐서 */
.kx { grid-column: 1 / -1; margin: 18px 14px 4px; background: var(--surface); border: 2px solid var(--navy); border-radius: 14px; padding: 14px 22px 10px; position: relative; z-index: 2; overflow: hidden; }
.kx-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: -14px -22px 6px; padding: 13px 22px 12px; background: var(--band); border-bottom: 1px solid var(--line2); }
.kx-head b { font-size: 14.5px; font-weight: 800; }
.kx-dims { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
.kx-dims b { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--ink); margin-right: 3px; }
.kx-key { margin-left: auto; display: flex; gap: 6px; }
.st { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; align-items: start; padding: 20px 0; }
.st + .st { border-top: 1px dashed var(--line2); }
.st-h { display: flex; align-items: center; gap: 7px; font-size: 13px; padding-top: 3px; min-width: 0; }
.st-n { font-weight: 800; color: var(--ink2); }
.st-h code { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--ink2); background: var(--tint); border-radius: 4px; padding: 1px 5px; }
.st-h b { font-weight: 800; }
.st-b { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
.eq .op { font-style: normal; font-size: 22px; font-weight: 800; color: var(--ink2); }
.eq .cm { font-style: normal; color: var(--muted); margin-left: -6px; }
.eq-v { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.eq-v > .op { font-style: normal; font-size: 18px; font-weight: 800; color: var(--ink2); margin-left: 16px; }
.eq-n { font-size: 12px; color: var(--muted); }
.tt { display: flex; flex-direction: column; gap: 3px; padding: 9px 11px 10px; border: 1.5px dashed var(--axis); border-radius: 9px; background: var(--surface); min-width: 0; max-width: 300px; }
.tt.r { border: 2px solid var(--hbm-r); box-shadow: inset 0 4px 0 var(--hbm-r); }   /* HBM에서 읽음 */
.tt.w { border: 2px solid var(--hbm-w); box-shadow: inset 0 4px 0 var(--hbm-w); }   /* HBM에 씀 */
.tt-top { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; }
.tt-top b { font-weight: 800; white-space: nowrap; }
.tt-top em { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.tt code { font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
.tgw { margin-top: 4px; }
.tgw svg { display: block; max-width: 100%; height: auto; }
.t-ax { display: none; }   /* 그림 밑 축 설명은 숨김 — 모양은 위 [B, T, d_I]로 */
.key { font-size: 11.5px; font-weight: 700; border-radius: 7px; padding: 1px 8px; }
.key.r { color: var(--hbm-r); border: 2px solid var(--hbm-r); }
.key.w { color: var(--hbm-w); border: 2px solid var(--hbm-w); }
.key.c { color: var(--muted); border: 1.5px dashed var(--axis); font-weight: 400; }
.eq-v .tt { max-width: 168px; padding: 7px 9px 8px; }   /* 텐서가 많은 단계는 한 줄에 들어가게 좁게 */
.eq-v .tt code { font-size: 12px; }
.eq-v .eq { gap: 8px 8px; }
/* 데이터 성격 한눈에 — 막대 2개(보관 · 스텝당 이동) + 성격 표. 둥근 띠 하나 = 성격 하나, 띠 안 칸 = 데이터 (색 = 데이터 종류) */
.dp-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 16px; }
.dp-ctl { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.dp-ctl .cl { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.dp-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.dp-legend span { display: inline-flex; align-items: center; gap: 6px; }
.dp-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.dp-bars { display: flex; flex-direction: column; gap: 16px; }
.dp-row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 6px 18px; align-items: start; }
.dp-h { display: flex; flex-direction: column; gap: 1px; }
.dp-h b { font-size: 14px; font-weight: 800; }
.dp-h span { font-size: 12px; color: var(--muted); }
.dp-h .dp-tot { font-family: var(--font-mono); font-size: 19px; font-weight: 700; margin-top: 2px; }
.dp-bar { display: flex; gap: 4px; min-width: 0; padding-top: 4px; }
.dp-g { display: flex; flex-direction: column; gap: 6px; min-width: 4px; }
.dp-strip { display: flex; gap: 1px; height: 38px; border-radius: 9px; overflow: hidden; background: var(--line2); }
.dp-seg { min-width: 0; display: flex; align-items: center; overflow: hidden; }
.dp-seg span { font-size: 12px; font-weight: 700; padding: 0 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-seg span b { font-family: var(--font-mono); font-weight: 700; margin-left: 6px; }
.dp-cap { font-size: 12.5px; font-weight: 700; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 19px; }
.dp-cap b { font-family: var(--font-mono); font-weight: 700; color: var(--ink); }
.dp-key { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.dp-tab { width: 100%; min-width: 820px; border-collapse: collapse; font-size: 13px; margin-top: 20px; }

<script>
const DATA = /*__DATA__*/null;
(function () {
"use strict";
const A = DATA.algo, M = DATA.map, P = A.page, LITE = P.lite || {};
const TENS = Object.assign({}, A.tensors, M.extra_tensors || {});
const STEPS = (() => {
  const s = A.steps.slice();

const STEP = Object.fromEntries(STEPS.map(s => [s.id, s]));
const PH = A.phases, KERN = M.kernels;
const PHS = {}; PH.forEach((p, i) => p.steps.forEach(s => { PHS[s] = i; }));

const CIRC = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧"];
const KIND_ORDER = Object.keys(A.kinds);
const UIF = Object.keys(A.formats).find(k => A.formats[k].ui);
const T_OPTS = [4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576];
const B_OPTS = [1, 2, 4, 8, 16, 32, 64, 128, 256];
const UNIT = { gemm: "GEMM", gemv: "GEMV", vec: "VEC", sel: "TOP-K", gather: "GATHER", mem: "WRITE" };
const state = { ti: 5, bi: 0, fmt: UIF ? A.formats[UIF].default : null, open: new Set(), scope: "model", view: "kind" };

/* ── 식 계산 (eval 없이) ── */
const parsed = {};
function parse(src) {

/* FlashMLA split-KV 스케줄러 (buildlib.flashmla_sched와 같은 규칙) */
const schedCache = {};
function flashSched(B, topk) {

  if (!sc || topk <= sc.min_topk) return (schedCache[key] = { S: 0, U: B });
  const parts = Math.max(Math.floor(M.hw.n_sm / sc.parts_div), 1), nb = Math.floor((topk - 1) / sc.block) + 1, ov = sc.overhead;
  const payload = Math.ceil(B * (nb + ov) / parts) + ov;

    while (req < B) {

      else { if (remain - ov > 0) { blk += remain - ov; ns++; remain = 0; } break; }
    }
  }

}
function dims() {
  const d = {};
  for (const [k, v] of Object.entries(A.dims)) d[k] = v.value;
  for (const [k, f] of Object.entries(A.formats)) d[k] = f.options[k === UIF ? state.fmt : f.default].value;
  d.T = T_OPTS[state.ti]; d.B = B_OPTS[state.bi];
  if (M.sched) { const sc = flashSched(d.B, d.k); d.S_acc = sc.S; d.U_dir = sc.U; }
  return d;
}
const bytesOf = (tid, d) => ev(TENS[tid].bytes, d);
const via = e => e.via || e.t;
function kernelNums(d) {
  return KERN.map(k => {
    const rk = {}, wk = {};
    let rd = 0, wr = 0, tc = 0;
    for (const e of k.hbm_read) { const b = bytesOf(via(e), d), kd = TENS[e.t].kind; rd += b; rk[kd] = (rk[kd] || 0) + b; }
    for (const e of (k.hbm_write || [])) { const b = bytesOf(via(e), d), kd = TENS[e.t].kind; wr += b; wk[kd] = (wk[kd] || 0) + b; }
    for (const sid of k.steps) { const s = STEP[sid]; if (s.flops) tc += ev(s.flops, d) / (s.unit === "gemm" ? M.hw.peak[s.prec || "bf16"] : M.hw.peak.vec); }
    const tm = (rd + wr) / M.hw.hbm_bw;
    return { k, rd, wr, rk, wk, t: Math.max(tm, tc) };
  });
}

/* ── 포맷 ── */
function fmtB(b) {
  for (const [v, s] of [[1e12, "TB"], [1e9, "GB"], [1e6, "MB"], [1e3, "KB"]]) if (b >= v) return (b / v).toPrecision(3).replace(/\.0+$|(\.\d*?)0+$/, "$1") + " " + s;
  return Math.round(b) + " B";
}
function fmtT(t) { const us = t * 1e6; return us >= 1000 ? (us / 1000).toPrecision(3) + " ms" : (us >= 100 ? us.toFixed(0) : us >= 10 ? us.toFixed(1) : us.toFixed(2)) + " µs"; }
const fmtN = n => n.toLocaleString("en-US");
const fmtTok = n => n >= 1048576 ? (n / 1048576) + "M" : n >= 1024 ? (n / 1024) + "K" : String(n);
const kcol = kd => (A.kinds[kd] && A.kinds[kd].color) || "gray";
const kc = kd => `var(--c-${kcol(kd)})`;
const kl = kd => `var(--c-${kcol(kd)}-l)`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isKo = c => /[ㄱ-힝]/.test(c);
const textW = (s, px) => [...String(s)].reduce((w, c) => w + (isKo(c) ? px : px * 0.58), 0);
function clip(s, px, max) { let w = 0, out = ""; for (const c of String(s)) { w += isKo(c) ? px : px * 0.58; if (w > max) return out + "…"; out += c; } return out; }
const tagCls = p => ({ strong: "strong", outline: "outline" })[p.tag_style] || "";
const onChipOf = k => (k.on_chip || []).map(e => typeof e === "string" ? { t: e, mem: "reg" } : e);

/* ── shape 표기: [B, T, d_I] = [1, 131072, 128] ── */
const symOf = e => String(e).replace(/\*/g, "·");
const shapeSym = tid => "[" + TENS[tid].shape.map(symOf).join(", ") + "]";
const shapeNum = (tid, d) => "[" + TENS[tid].shape.map(e => String(Math.round(ev(e, d)))).join(", ") + "]";
function dimsUsed(tids) {
  const s = new Set();
  tids.forEach(t => TENS[t].shape.forEach(e => (String(e).match(/[A-Za-z_]\w*/g) || []).forEach(x => s.add(x))));
  const known = [...Object.keys(A.dims), ...Object.keys(M.derived || {})];
  return known.filter(x => s.has(x));
}
function dimLabel(x, d) {
  const info = A.dims[x] || (M.derived && M.derived[x]);
  return info ? `<span><b>${esc(x)}</b>${esc(info.short || "")} ${fmtN(d[x])}</span>` : "";
}

/* ── HBM 목록: 가중치는 한 줄로 묶고, 작은 토큰 벡터는 '앞 단계 결과'로 묶음 ── */
function hbmGroups(k, d) {
  const reads = [];
  const wts = k.hbm_read.filter(e => TENS[e.t].kind === "weight");
  if (wts.length) reads.push({ label: "가중치 " + wts.map(e => TENS[e.t].label).join(" · "), b: wts.reduce((s, e) => s + bytesOf(e.t, d), 0), kind: "weight" });
  const rs = k.hbm_read.filter(e => TENS[e.t].kind !== "weight").map(e => ({ label: e.pat === "gather" ? `${TENS[e.t].label} (골라 읽기)` : TENS[e.t].label, b: bytesOf(via(e), d), kind: TENS[e.t].kind }));
  const big = x => x.b >= 64e3 || x.kind !== "act";
  rs.filter(big).sort((a, b) => b.b - a.b).forEach(x => reads.push(x));
  const smallR = rs.filter(x => !big(x));
  if (smallR.length) reads.push({ label: `앞 단계 결과: ${smallR.map(x => x.label).join(" · ")}`, b: smallR.reduce((s, x) => s + x.b, 0), kind: "act", small: true });
  const writes = (k.hbm_write || []).map(e => ({ label: TENS[e.t].label + (e.pat === "row" ? "에 1줄" : e.pat === "overwrite" ? " 덮어쓰기" : ""), b: bytesOf(via(e), d), kind: TENS[e.t].kind })).sort((a, b) => b.b - a.b);

  return { reads, writes };
}
/* L2 표시: 상주 데이터(가중치 · cache · state)가 아니고 L2 절반 이하인 값 = 앞뒤 커널이 주고받는 작은 전달값 */
const L2_B = M.hw.onchip && M.hw.onchip.l2 ? M.hw.onchip.l2.total : 0;
const isHandoff = x => L2_B > 0 && x.b > 0 && !(A.kinds[x.kind] || {}).persistent && x.b <= L2_B / 2;
const L2_TIP = `앞뒤 커널이 주고받는 작은 값 — 실제로는 L2 캐시(${Math.round(L2_B / 1048576)} MB)에서 처리돼 HBM까지 안 갈 수 있다`;

/* ── 흐름 한눈에: 단계별 HBM 읽기 · 쓰기 막대 → 칩 레인 ── */
function phaseAgg(d, ks) {
  return PH.map((p, i) => {
    const kn = ks.filter(n => kPhase(n.k) === i);
    const rk = {}, wk = {}, rt = {}, wt = {};
    let rd = 0, wr = 0;
    const add = (map, key, lab, kind, b) => { map[key] = map[key] || { b: 0, lab, kind }; map[key].b += b; };
    kn.forEach(n => {
      rd += n.rd; wr += n.wr;
      for (const [kd, v] of Object.entries(n.rk)) rk[kd] = (rk[kd] || 0) + v;
      for (const [kd, v] of Object.entries(n.wk)) wk[kd] = (wk[kd] || 0) + v;
      n.k.hbm_read.forEach(e => { const kd = TENS[e.t].kind; add(rt, kd === "weight" ? "__w" : e.t, kd === "weight" ? "가중치" : TENS[e.t].label, kd, bytesOf(via(e), d)); });
      (n.k.hbm_write || []).forEach(e => add(wt, e.t, TENS[e.t].label, TENS[e.t].kind, bytesOf(via(e), d)));

  });
}
function stackRects(x, w, yb, h, parts, total, light) {
  let s = "", y = yb;
  parts.forEach(([kd, b], j) => {
    const hh = h * b / total; if (hh <= 0) return;
    const gap = j > 0 && hh > 3 ? 1.5 : 0;

  s += `<rect class="lane" x="6" y="${yH0}" width="${W - 12}" height="${yH1 - yH0}" rx="14"/>`;
  s += `<rect class="lane" x="6" y="${yC0}" width="${W - 12}" height="${yC1 - yC0}" rx="14"/>`;
  const lanePill = (y, t) => `<rect x="22" y="${y + 14}" width="${textW(t, 16) + 26}" height="30" rx="8" style="fill:var(--navy)"/><text x="35" y="${y + 35}" font-size="16" font-weight="800" class="t-white">${t}</text>`;
  s += lanePill(yH0, "HBM") + `<text x="24" y="${yH0 + 66}" font-size="13" class="t-muted">읽기 · 쓰기</text><text x="24" y="${yH0 + 85}" font-size="12" class="t-muted">${M.hw.hbm_bw / 1e12} TB/s</text>`;

    const ttl = `${CIRC[i]} ${a.p.label}`;

    const tw = textW(a.p.tag, 11.5) + 20, cls = tagCls(a.p);   // 태그: DSA 추가 = 보라 · DSA로 변경 = 연보라 · 기존 = 회청
    const tf = { strong: "var(--purple)", outline: "var(--purple-t)" }[cls] || "var(--slate-t)", tc = { strong: "t-white", outline: "t-purple" }[cls] || "t-navy";
    s += `<rect x="${cx - tw / 2}" y="37" width="${tw}" height="21" rx="10.5" style="fill:${tf}"/>`;
    s += `<text x="${cx}" y="51.5" font-size="11.5" font-weight="700" text-anchor="middle" class="${tc}">${esc(a.p.tag)}</text>`;
    const hr = hOf(a.rd), hw = hOf(a.wr);
    s += stackRects(xr - bw / 2, bw, yb, hr, parts(a.rk), a.rd, false);
    s += stackRects(xw - bw / 2, bw, yb, hw, parts(a.wk), a.wr, true);
    const lab = (x, h, b, cap) => `<text x="${x}" y="${yb - h - 22}" font-size="15" font-weight="800" text-anchor="middle">${fmtB(b)}</text><text x="${x}" y="${yb - h - 7}" font-size="11.5" text-anchor="middle" class="t-muted">${esc(clip(cap, 11.5, 88))}</text>`;
    if (a.topR) s += lab(xr, hr, a.rd, a.topR.lab);
    if (a.topW) s += lab(xw, hw, a.wr, a.topW.lab);
    s += `<line x1="${cx - colW / 2 + 14}" x2="${cx + colW / 2 - 14}" y1="${yb + 0.5}" y2="${yb + 0.5}" style="stroke:var(--axis)" stroke-width="1"/>`;

/* ── 커널별 이동: 굵은 화살표 ── */
const MAXTH = 60, ARW = 258;   // ARW = 화살표 칸 폭 232 + 양옆 카드 여백 (HBM 카드 → 커널 카드에 닿게)

/* ── 텐서 격자 (펼침의 텐서 그림) ── */
const NCELL = 36;

  const isLongAx = e => /\b(T|k)\b/.test(e);   // 토큰 축: T · k와 그 식(T/m · k/b 등)

}

function gridHTML(tid, d, mode) {
  const t = TENS[tid], gm = gridModel(tid, d), col = kc(t.kind);

  const gy = 1 + (sheets - 1) * off;

  for (let si = sheets - 1; si >= 0; si--) {

    s += `<rect x="${ox}" y="${oy}" width="${gw}" height="${gh}" style="fill:var(--surface);stroke:var(--line)"/>`;
    if (si) continue;

      if (mode === "gather" && dens(i, gm.hN) > 0.15) a = 0.92;
      if (mode === "append" && i === gm.hN - 1) a = 1;
      if (mode === "tile" && i < 5) a = 0.85;
      for (let j = 0; j < gm.vN; j++) s += `<rect x="${ox + i * cs + 0.5}" y="${oy + j * cs + 0.5}" width="${cs - 1}" height="${cs - 1}" style="fill:${col}" fill-opacity="${a}"/>`;
    }
    if (vp) { const c = Math.round(gm.vN * vp[0] / (vp[0] + vp[1])); s += `<line x1="${ox - 1}" x2="${ox + gw + 1}" y1="${oy + c * cs}" y2="${oy + c * cs}" style="stroke:var(--ink2)" stroke-width="1.4"/>`; }
    if (hp) { const c = Math.round(gm.hN * hp[0] / (hp[0] + hp[1])); s += `<line y1="${oy - 1}" y2="${oy + gh + 1}" x1="${ox + c * cs}" x2="${ox + c * cs}" style="stroke:var(--ink2)" stroke-width="1.4"/>`; }
    if (brk) { const bx = ox + Math.round(gm.hN * 0.62) * cs; s += `<path d="M${bx - 4} ${oy + gh + 8} l6 -6 M${bx + 1} ${oy + gh + 8} l6 -6" style="stroke:var(--ink2)" stroke-width="1.3" fill="none"/>`; }
  }

  if (gm.v) ax.push(`세로 ${symOf(gm.v.e)}`);

/* ── 펼침: 칩 안 계산 단계 — 텐서 그림으로 A × B → C ── */
const isW = t => TENS[t].kind === "weight";
function stepOps(s) {   // 단계 → 연산 목록. yaml의 ops가 있으면 그대로, 없으면 입력 · 출력 목록에서 짝을 짓는다

  ro:   { label: "가중치",         sub: "read-only · 모든 요청이 같이 씀", life: "서비스 내내",       write: "없음" },
  app:  { label: "요청별 cache",   sub: "토큰마다 1줄씩 자람",             life: "요청이 끝날 때까지", write: "끝에 1줄 추가" },
  rmw:  { label: "요청별 state",   sub: "크기 고정",                       life: "요청이 끝날 때까지", write: "매 스텝 전부 다시 씀" },
  tmp:  { label: "스텝 안 임시값", sub: "앞 커널이 쓰고 다음 커널이 읽음", life: "한 스텝 안",         write: "매번 새로 씀" },
  chip: { label: "커널 안 값",     sub: "칩 안에서 생겼다 사라짐",         life: "커널 하나 안",       write: "HBM에 안 씀" },
};
const GRP_ORDER = ["ro", "app", "rmw", "tmp"];
const MATCH = (() => {   // model.yaml block 항목 → 텐서 판정
  const m = {}, named = [];
  if (!MD) return m;
  for (const it of MD.data) {
    const b = it.block;
    if (!b || b.rest) continue;
    m[it.id] = b.kind ? (t => TENS[t].kind === b.kind) : (s => t => s.has(t))(new Set(b.t));
    named.push(m[it.id]);
  }
  for (const it of MD.data) if (it.block && it.block.rest) m[it.id] = t => !named.some(f => f(t));
  return m;
})();
function mdDimsAt(B, T) {   // B · T를 바꾼 차원 (null = 지금 조건). 성격의 '골라 읽음' 판정 기준 조건에 씀
  const d = dims();
  if (B != null) { d.B = B; d.T = T; if (M.sched) { const sc = flashSched(B, d.k); d.S_acc = sc.S; d.U_dir = sc.U; } }
  for (const [k, v] of Object.entries(MD.dims || {})) d[k] = v.value;
  for (const [k, v] of Object.entries(MD.derived || {})) d[k] = ev(v.expr, d);
  return d;
}
const mdDims = () => mdDimsAt(null);
/* 나눠 보기 — 수명(길수록 진한 남색) · 성격(색 계열 = 쓰기 방식, 진하기 = 전부 읽음 / 골라 읽음). tools/traits.py와 같은 규칙 */
const LIFE_C = { svc: ["서비스 내내", "--l-svc", false], req: ["요청 동안", "--l-req", false], step: ["스텝 안", "--l-step", true] };
const CHAR_C = {
  ro_all: ["read-only · 전부 읽음", "--c-gray", false], ro_sel: ["read-only · 골라 읽음", "--c-gray-l", true],
  app_all: ["끝에 추가 · 전부 읽음", "--c-blue", false], app_sel: ["끝에 추가 · 골라 읽음", "--c-blue-l", true],
  rmw: ["매 스텝 전부 다시 씀", "--c-green", false], tmp: ["임시 (커널 사이)", "--c-yellow", true],
};
const colOf = c => `var(--c-${c})`;
const isPale = c => /-l+$/.test(c);   // gray-l · gray-ll 처럼 이미 옅은 색
const colL = c => isPale(c) ? colOf(c) : `var(--c-${c}-l)`;
function mdItems(d, scope) {
  const out = [];
  for (const it of MD.data) {
    const b = it.block;
    if (scope === "layer" && !b) continue;
    const L = scope === "layer" ? 1 : ev(it.layers || 1, d);
    let store, rd = 0, wr = 0, color, tmp = false;
    if (b) {
      const f = MATCH[it.id];
      tmp = !!b.rest;
      for (const k of KERN) {
        for (const e of k.hbm_read) if (f(e.t)) rd += bytesOf(via(e), d);
        for (const e of (k.hbm_write || [])) if (f(e.t)) wr += bytesOf(via(e), d);
      }
      const own = Object.keys(A.tensors).filter(f);
      store = tmp ? 0 : own.reduce((s, t) => s + bytesOf(t, d), 0) * L;
      rd *= L; wr *= L;
      color = it.color || kcol(TENS[own[0]].kind);
    } else {
      store = ev(it.store, d); rd = ev(it.read || 0, d); wr = ev(it.write || 0, d); color = it.color || "gray";
    }
    const g = tmp ? "tmp" : wr === 0 ? "ro" : wr >= 0.99 * store ? "rmw" : "app";
    out.push({ id: it.id, name: it.short || it.label, group: it.group || it.short || it.label, note: it.note || "", store, rd, wr, color, g });
  }
  return out;
}
function chipOf(d, scope) {   // 칩 안에서만 생겼다 사라지는 값 = on_chip 중 HBM 이동 · 타일 단계가 아닌 것
  const per = {};
  for (const k of KERN) {
    const hb = new Set(k.hbm_read.concat(k.hbm_write || []).flatMap(e => [e.t, via(e)]));
    for (const e of onChipOf(k)) if (!e.stage && !hb.has(e.t)) per[e.t] = (per[e.t] || 0) + bytesOf(e.t, d);
  }
  const rest = MD.data.find(x => x.block && x.block.rest);
  const L = scope === "layer" || !rest ? 1 : ev(rest.layers || 1, d);
  const list = Object.entries(per).sort((a, b) => b[1] - a[1]);
  return { b: list.reduce((s, x) => s + x[1], 0) * L, top: list.slice(0, 3).map(([t]) => TENS[t].label) };
}
function renderTraits() {
  if (!MD) return;
  document.getElementById("dpanel").hidden = false;
  const d = mdDims(), sc = state.scope, items = mdItems(d, sc), chip = chipOf(d, sc);
  const segBtns = (id, opts, cur, key) => {
    const host = document.getElementById(id);
    host.innerHTML = opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join("");
    host.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { state[key] = b.dataset.v; renderTraits(); }));
  };
  const vw = state.view;
  const layerLabel = MD.layer_label || "attention 층 1개";
  segBtns("dpscope", [["model", "모델 전체"], ["layer", layerLabel]], sc, "scope");
  segBtns("dpview", [["kind", "데이터 종류"], ["life", "수명"], ["char", "데이터 성격"]], vw, "view");
  document.getElementById("dpwhat").textContent =
    `${sc === "model" ? MD.model + " 모델 전체" : layerLabel} · decode 1스텝 · 요청 ${d.B}개 · ${fmtTok(d.T)}` + (vw === "kind" ? " · 진한 칸 = 읽기 · 옅은 칸 = 쓰기" : "");
  const ref = Object.fromEntries(mdItems(mdDimsAt(1, 131072), sc).map(x => [x.id, x]));
  items.forEach(x => {   // 수명 · 성격 판정
    const r = ref[x.id], sel = r && r.rd < 0.9 * r.store;
    x.life = x.g === "tmp" ? "step" : x.g === "ro" ? "svc" : "req";
    x.char = x.g === "tmp" || x.g === "rmw" ? x.g : (x.g === "ro" ? "ro" : "app") + (sel ? "_sel" : "_all");
  });
  let cats;   // 막대의 둥근 띠 = 고른 기준의 묶음 하나
  if (vw === "kind") {
    const m = new Map();
    items.forEach(x => { if (!m.has(x.group)) m.set(x.group, { label: x.group, its: [] }); m.get(x.group).its.push(x); });
    cats = [...m.values()];
  } else {
    cats = Object.entries(vw === "life" ? LIFE_C : CHAR_C).map(([k, [label, col, pale]]) => ({ label, col, pale, its: items.filter(x => x[vw] === k) })).filter(c => c.its.length);
  }

  const groups = GRP_ORDER.map(g => ({ g, its: items.filter(x => x.g === g) })).filter(x => x.its.length);
  const sum = (its, f) => its.reduce((s, x) => s + f(x), 0);
  const totS = sum(items, x => x.store), totM = sum(items, x => x.rd + x.wr);
  const pct = (v, t) => { const p = 100 * v / t; return p >= 10 ? p.toFixed(0) + "%" : p >= 0.1 ? p.toPrecision(2) + "%" : p > 0 ? "0.1% 미만" : "0%"; };
  const bar = kind => {
    const tot = kind === "store" ? totS : totM;
    return cats.map(({ label: glab, its, col, pale: cp }) => {
      const gv = sum(its, x => kind === "store" ? x.store : x.rd + x.wr);
      if (gv <= 0) return "";
      const segs = its.flatMap(x => kind === "store" ? [[x.store, false, x, "보관"]]
          : vw === "kind" ? [[x.rd, false, x, "읽기"], [x.wr, true, x, "쓰기"]] : [[x.rd + x.wr, false, x, "읽기 + 쓰기"]])
        .filter(s => s[0] > 0)
        .map(([v, w, x, what]) => {
          const c = x.color, bg = col ? `var(${col})` : (w ? colL(c) : colOf(c));
          const pale = col ? cp : (w || isPale(c) || c === "yellow");   // 옅은 칸 · 노랑은 진한 글자
          const lab = v / tot >= 0.1 ? `<span style="color:var(${pale ? "--ink" : "--surface"})">${esc(x.name)}${w ? " 쓰기" : ""}<b>${fmtB(v)}</b></span>` : "";
          return `<div class="dp-seg" style="flex:${(1000 * v / gv).toFixed(4)} 1 0;background:${bg}" title="${esc(`${x.name} · ${what} ${fmtB(v)} · ${pct(v, tot)}`)}">${lab}</div>`;
        }).join("");
      const sh = gv / tot;
      return `<div class="dp-g" style="flex:${(1000 * sh).toFixed(4)} 1 0"><div class="dp-strip">${segs}</div>` +
        `<div class="dp-cap">${sh >= 0.12 ? `${esc(glab)} <b>${pct(gv, tot)}</b>` : sh >= 0.03 ? `<b>${pct(gv, tot)}</b>` : ""}</div></div>`;
    }).join("");
  };
  const row = (t, s, v, inner) => `<div class="dp-row"><div class="dp-h"><b>${t}</b><span>${s}</span><span class="dp-tot">${fmtB(v)}</span></div><div class="dp-bar">${inner}</div></div>`;
  document.getElementById("dpbars").innerHTML =
    row("보관", "HBM에 들고 있는 양", totS, bar("store")) + row("스텝당 이동", "HBM 읽기 + 쓰기", totM, bar("move"));
  document.getElementById("dplegend").innerHTML =
    cats.map(c => `<span><i style="background:${c.col ? `var(${c.col})` : colOf(c.its[0].color)}"></i>${esc(c.label)}</span>`).join("") +
    (vw === "char" ? `<span>골라 읽음 = 요청 1개 · 128K에서 스텝당 읽기가 보관의 90% 미만</span>` : vw === "life" ? `<span>커널 안 값은 HBM 밖 — 아래 표 맨 아래 줄</span>` : "");

  const nG = (MD.deploy || {}).n_gpu || 1;
  const allM = sc === "model" ? totM : sum(mdItems(d, "model"), x => x.rd + x.wr);
  const stepT = allM / (nG * M.hw.hbm_bw), layerT = kernelNums(d).reduce((s, x) => s + x.t, 0);
  const later = ["한 스텝 뒤", `그사이 모델 전체가 지나감 · ${M.hw.label} ${nG}장 하한 ${fmtT(stepT)}`];
  const reread = { ro: later, app: later, rmw: later, tmp: ["바로 다음 커널", `층 1개 전체가 하한 ${fmtT(layerT)}`], chip: ["같은 커널 안", "만든 자리(SMEM · 레지스터)에서 바로 씀"] };
  const sw = x => `<span title="${esc(x.note)}"><i style="background:${colOf(x.color)}"></i>${esc(x.name)}</span>`;
  const rows = groups.map(({ g, its }) => {
    const s = sum(its, x => x.store), r = sum(its, x => x.rd), w = sum(its, x => x.wr);
    return `<tr><td><span class="gchip g-${g}">${GRP[g].label}</span><span class="sm">${GRP[g].sub}</span></td>
      <td><div class="dp-items">${its.map(sw).join("")}</div></td>
      <td class="nw">${GRP[g].life}</td><td>${reread[g][0]}<span class="sm">${esc(reread[g][1])}</span></td><td class="nw">${GRP[g].write}</td>
      <td class="num">${g === "tmp" ? "—" : `<b>${fmtB(s)}</b><span class="sm">${pct(s, totS)}</span>`}</td>
      <td class="num"><b>${fmtB(r + w)}</b><span class="sm">${pct(r + w, totM)}${w > 0 ? ` · 그중 쓰기 ${fmtB(w)}` : ""}</span></td></tr>`;
  });
  rows.push(`<tr class="chip"><td><span class="gchip g-chip">${GRP.chip.label}</span><span class="sm">${GRP.chip.sub}</span></td>
    <td><div class="dp-items">${chip.top.map(l => `<span><i class="dash"></i>${esc(l)}</span>`).join("")}</div></td>
    <td class="nw">${GRP.chip.life}</td><td>${reread.chip[0]}<span class="sm">${reread.chip[1]}</span></td><td class="nw">${GRP.chip.write}</td>
    <td class="num">—</td><td class="num"><b>0</b><span class="sm">칩 안에서 생기는 양 ${fmtB(chip.b)}</span></td></tr>`);
  document.getElementById("dptab").innerHTML =
    `<thead><tr><th>성격</th><th>데이터</th><th>수명</th><th>다시 읽히기까지</th><th>쓰기</th><th class="num">보관</th><th class="num">스텝당 이동</th></tr></thead><tbody>${rows.join("")}</tbody>`;
  document.getElementById("dpnote").textContent =
    `다시 읽히기까지가 짧은 값(임시값 · 커널 안 값)은 칩 안(L2 ${Math.round(L2_B / 1048576)} MB · SMEM)에 남길 수 있음. 한 스텝 뒤에 다시 읽히는 값은 그사이 모델 전체가 지나가 칩 안에 남지 않음 → HBM에 둠` +
    (sc === "model" && MD.derived && MD.derived.E_hit ? " · MoE expert 읽기 = 요청들이 건드린 expert만 (균등 라우팅 가정)" : "");
}

function update() { renderControls(); renderTraits(); renderSummary(); renderFlow(); }

(function init() {
  const base = DATA.pages || "";
  document.getElementById("crumbs").innerHTML = (P.crumbs || []).map(c => `<span class="crumb">${esc(c)}</span>`).join("");
  document.getElementById("h1").textContent = LITE.doc_title || P.doc_title;
  document.getElementById("subtext").textContent = LITE.sub || "";
  const nav = DATA.nav || [];   // 모델 이동 줄 — 지금 모델은 남색 칩
  document.getElementById("links").innerHTML = nav.length > 1
    ? nav.map(n => n.file === P.file ? `<span class="navcur">${esc(n.label)}</span>`
        : `<a href="${esc(base + n.file + "-lite.html")}" target="_blank" rel="noopener">${esc(n.label)}</a>`).join("")
    : (LITE.sibling ? `<a class="main" href="${esc(base + LITE.sibling.file + "-lite.html")}" target="_blank" rel="noopener">${esc(LITE.sibling.label)} →</a>` : "");
  const chk = DATA.checks ? `(${DATA.checks.n}개 중 실패 ${DATA.checks.fail}개)` : "";
  document.getElementById("assume").innerHTML = [...(P.scope || []), ...(P.verify || [])].map(s => `<li>${esc(s.replace("{checks}", chk))}</li>`).join("");
  document.getElementById("foot").textContent = `${M.name} · 이론 하한 = max(바이트 ÷ ${M.hw.hbm_bw / 1e12} TB/s, FLOP ÷ 피크) · 해석과 결론은 보고서(report/)에 있음`;
  renderLegend();
  update();
})();
})();
</script>
