<title>__TITLE__</title>

<style>
/* Layout: 약식 — 보고서 그림 문법(연한 레인 패널 · 흰 카드 · 굵은 수치). 위 "흐름 한눈에" = 단계별 HBM 막대 + 칩 레인,
   아래 "커널별 이동" = HBM 레인 | 굵은 화살표(굵기 = 바이트) | 칩 레인 3열. 커널 칸을 누르면 텐서 모양이 아래로 펼쳐진다.
   색 = 데이터 종류 (yaml kinds.color). 설명 문장 · 결론은 자세한 버전에 둔다. */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --surface2: #f6f7fb; --lane: #f2f4f9; --tint: #eef0f6;
  --ink: #2b2f3a; --ink2: #4a5573; --muted: #6b7080; --line: #dfe2ec; --line2: #e6e8f1; --axis: #9aa0b0;
  --c-gray: #9c9a92; --c-gray-l: #dddcd6; --c-blue: #2a78d6; --c-blue-l: #b7d3f6; --c-orange: #eb6834; --c-orange-l: #f8c6b1;
  --c-green: #1baf7a; --c-green-l: #a9e0cb; --c-yellow: #eda100; --c-yellow-l: #f7d98f; --c-pink: #e87ba4; --c-pink-l: #f6c9da; --c-violet: #6250d6; --c-violet-l: #d6d1f5;
  --font-text: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --bridge: #f8f9fc;
  --cols: 290px 232px minmax(0, 1fr);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --surface: #1a1d24; --surface2: #20242c; --lane: #1f232b; --tint: #262a33; --bridge: #1d2027;
    --ink: #eceef3; --ink2: #b6bfd3; --muted: #8b92a3; --line: #2f3440; --line2: #262b35; --axis: #5d6474;
    --c-gray: #8f8d86; --c-gray-l: #45443f; --c-blue: #3987e5; --c-blue-l: #1f3a5f; --c-orange: #d95926; --c-orange-l: #5a2f1c;
    --c-green: #199e70; --c-green-l: #1b4537; --c-yellow: #c98500; --c-yellow-l: #4f3c12; --c-pink: #d55181; --c-pink-l: #552538; --c-violet: #9085e9; --c-violet-l: #2f2a5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --surface: #1a1d24; --surface2: #20242c; --lane: #1f232b; --tint: #262a33; --bridge: #1d2027;
  --ink: #eceef3; --ink2: #b6bfd3; --muted: #8b92a3; --line: #2f3440; --line2: #262b35; --axis: #5d6474;
  --c-gray: #8f8d86; --c-gray-l: #45443f; --c-blue: #3987e5; --c-blue-l: #1f3a5f; --c-orange: #d95926; --c-orange-l: #5a2f1c;
  --c-green: #199e70; --c-green-l: #1b4537; --c-yellow: #c98500; --c-yellow-l: #4f3c12; --c-pink: #d55181; --c-pink-l: #552538; --c-violet: #9085e9; --c-violet-l: #2f2a5c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px; font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.mono { font-family: var(--font-mono); }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--c-blue); outline-offset: 2px; }

header.top { display: flex; flex-direction: column; gap: 6px; padding: 2px; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.crumb { font-size: 12px; font-weight: 700; color: var(--ink2); background: var(--tint); border-radius: 999px; padding: 2px 10px; }
.h1row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.litechip { font-size: 12.5px; font-weight: 800; color: var(--surface); background: var(--ink2); border-radius: 6px; padding: 2px 9px; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.links a { font-size: 13px; color: var(--ink2); font-weight: 700; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--surface); }
.links a.main { background: var(--ink2); color: var(--surface); border-color: var(--ink2); }

svg .t-inv { fill: var(--surface); }
svg .t-mono { font-family: var(--font-mono); }
svg .lane { fill: var(--lane); }
svg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }

svg .boxhit:hover .box { stroke: var(--ink2); }

/* 커널별 이동 */
.kgrid { display: grid; grid-template-columns: var(--cols); min-width: 900px; position: relative; }
.lane-bg { background: var(--lane); border-radius: 14px; }

.phrow { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 16px 18px 4px; scroll-margin-top: 12px; }

.phrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.tag.strong { background: var(--ink2); border-color: var(--ink2); color: var(--surface); }
.tag.outline { border-color: var(--ink2); color: var(--ink2); }
/* 커널 1개 = 한 줄 묶음: HBM 카드(읽기 칸 + 쓰기 칸) · 화살표 띠 · 커널 카드가 같은 높이, 커널 사이에 간격 줄 */
.hcell { grid-column: 1; margin: 0 12px 0 14px; background: var(--surface); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.hcell.r { border-bottom: 0; border-radius: 10px 10px 0 0; padding: 12px 14px 10px; }
.hcell.w { border-top: 0; border-radius: 0 0 10px 10px; padding: 10px 14px 12px; position: relative; }
.hcell.w::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; border-top: 1px dashed var(--line); }
.hk-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.hk { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--ink2); border: 1.5px solid var(--ink2); border-radius: 5px; padding: 0 6px; line-height: 1.5; }
.hk-row .hl-t { margin-bottom: 0; }
.bridge { grid-column: 2; background: var(--bridge); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2); }
.kgap { grid-column: 1 / -1; height: 18px; }
.hl-t { font-size: 12.5px; font-weight: 800; margin-bottom: 3px; color: var(--ink); }
.hl-i { display: grid; grid-template-columns: 11px minmax(0, 1fr) auto; gap: 7px; align-items: center; font-size: 12.5px; line-height: 1.55; }
.hl-i i { width: 10px; height: 10px; border-radius: 2px; }
.hl-i .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-i .b { color: var(--muted); font-size: 12px; }
.l2 { font-style: normal; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--muted); border: 1px dashed var(--axis); border-radius: 4px; padding: 0 4px; margin-right: 6px; line-height: 1.4; display: inline-block; }
.hl-i.sm { color: var(--muted); }
.hl-i.sm i { opacity: 0.7; }
.hl-i.zero { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--axis); }
.acell { grid-column: 2; display: flex; align-items: center; justify-content: center; margin: 0 -14px 0 -12px; padding: 12px 0; min-width: 0; position: relative; z-index: 1; }
.acell svg { display: block; overflow: visible; }
.acell .al { font-size: 12px; fill: var(--muted); font-weight: 700; }
.acell .ab { font-size: 16px; font-weight: 800; }
.kcard { grid-column: 3; margin: 0 14px; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 6px; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; cursor: pointer; min-width: 0; }
.kcard:hover { border-color: var(--axis); }
.kcard[aria-expanded=true] { border-color: var(--ink2); box-shadow: 0 0 0 1px var(--ink2); }
.khead { display: flex; align-items: center; gap: 10px; }
.kid { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; background: var(--ink2); color: var(--surface); border-radius: 5px; padding: 2px 7px; flex: none; }
.kname { font-size: 17px; font-weight: 800; }
.kchev { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; white-space: nowrap; flex: none; }
.kcard[aria-expanded=true] .kchev { background: var(--ink2); color: var(--surface); border-color: var(--ink2); }
.kplain { font-size: 13px; color: var(--muted); }
.kchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.kchips .kcl { font-weight: 700; color: var(--muted); margin-right: 2px; }
.ocp { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--k); border-radius: 999px; padding: 1px 10px 1px 4px; background: var(--surface); }
.ocp em { font-style: normal; color: var(--muted); }
code.mb { font-family: var(--font-mono); font-size: 10px; font-weight: 700; background: var(--ink2); color: var(--surface); border-radius: 3px; padding: 1px 5px; }

/* 펼친 텐서 모양 */
.kx { grid-column: 1 / -1; margin: 12px 14px 0; background: var(--surface); border: 1px solid var(--ink2); border-radius: 12px; padding: 14px 16px 16px; position: relative; z-index: 2; }
.kx-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
.kx-head b { font-size: 15px; font-weight: 800; }
.kx-dims { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
.kx-dims b { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--ink); margin-right: 3px; }
.kx-cols { display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr); gap: 0 8px; align-items: start; }
.kx-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.kx-col.mid { background: var(--surface2); border: 1.5px dashed var(--ink2); border-radius: 10px; padding: 10px; }
.kx-t { font-size: 13px; font-weight: 800; color: var(--ink2); }
.kx-ar { align-self: start; margin-top: 52px; height: 18px; background: var(--ink2); clip-path: polygon(0 35%, 60% 35%, 60% 0, 100% 50%, 60% 100%, 60% 65%, 0 65%); }
.ksteps { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.kst { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px 3px 5px; }
.kst code { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--ink2); background: var(--tint); border-radius: 4px; padding: 1px 5px; }
.kst-ar { font-size: 12px; color: var(--ink2); padding-left: 14px; line-height: 1.1; }
.tile { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px 10px; background: var(--surface); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tile.chip { border: 1.5px dashed var(--k); }
.tile.off { opacity: 0.6; }
.t-top { display: flex; align-items: center; gap: 7px; font-size: 13px; min-width: 0; }
.t-top i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.t-top b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-top .t-b { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink2); white-space: nowrap; }
.t-shape { font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.t-num { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tgw { margin-top: 5px; }
.tgw svg { display: block; max-width: 100%; height: auto; }
.t-ax { font-size: 11px; color: var(--muted); }
.t-note { font-size: 12px; color: var(--ink2); font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
.t-note .mono { font-weight: 700; }
.t-zero { font-size: 12px; color: var(--muted); }
button.kst { font-family: inherit; color: inherit; cursor: pointer; }
button.kst:hover, .kst.on { border-color: var(--ink2); }
.kst.on { background: var(--tint); }
.kx-ops { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line2); display: flex; flex-direction: column; gap: 8px; }
.kx-ops > .kx-t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.op-hint { font-size: 12px; font-weight: 400; color: var(--muted); }
.op-all { margin-left: auto; font: inherit; font-size: 12px; font-weight: 700; color: var(--ink2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; cursor: pointer; }
.op { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.op.open { border-color: var(--ink2); }
.op-h { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 12px; background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; min-width: 0; }
.op-h code { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--ink2); background: var(--tint); border-radius: 4px; padding: 1px 5px; flex: none; }
.op-h b { font-size: 13px; font-weight: 800; white-space: nowrap; flex: none; }
.op-f { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op-chev { font-size: 12px; color: var(--ink2); flex: none; }
.op-b { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.op-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.op-row .tile { flex: 1 1 210px; max-width: 340px; }
.op-x { font-size: 24px; font-weight: 800; color: var(--ink2); flex: none; }
.op-fn { flex: none; font-size: 13px; font-weight: 800; color: var(--ink2); background: var(--tint); border-radius: 7px; padding: 5px 10px; }
.op-v { display: flex; flex-direction: column; gap: 6px; }
.op-lab { font-size: 12px; font-weight: 700; color: var(--muted); }
.op-down { align-self: flex-start; margin: 2px 0; }
.op-cap { font-size: 12.5px; color: var(--ink2); }
.op-cap b { font-weight: 800; }
.op-desc { font-size: 12.5px; color: var(--muted); }
code.pl { margin-left: auto; flex: none; }
.foot { font-size: 12.5px; color: var(--muted); margin: 0; padding: 0 2px; }
.foot a { color: var(--ink2); font-weight: 700; }

@media (max-width: 640px) { h1 { font-size: 22px; } }
@media (prefers-reduced-motion: no-preference) { .kcard, .seg button { transition: border-color 120ms, box-shadow 120ms, background 120ms; } }
</style>

<div class="wrap">

    <div class="scroll"><div class="kgrid" id="kgrid"></div></div>
  </section>

</div>

/* ── 포맷 ── */

/* ── shape 표기: [B, T, d_I] = [1, 131072, 128] ── */

/* ── HBM 목록 (자세한 버전과 같은 묶음) ── */

  const rs = k.hbm_read.filter(e => TENS[e.t].kind !== "weight").map(e => ({ label: e.pat === "gather" ? `${TENS[e.t].label} (골라 읽기)` : TENS[e.t].label, b: bytesOf(via(e), d), kind: TENS[e.t].kind }));

/* ── 커널별 이동: 굵은 화살표 ── */

  if (i === 0) v = 0.75;
  const back = N - 1 - i;
  if (back === 0) v = 1; else if (back === 1) v = 0.85; else if (back === 2) v = 0.6;
  return v;
}
function gridModel(tid, d) {
  let sh = TENS[tid].shape.map(e => ({ e: String(e), v: ev(e, d) }));
  if (sh.length > 1 && (sh[0].e === "B" || (M.derived && M.derived[sh[0].e]))) sh = sh.slice(1);
  let hi = sh.findIndex(a => a.e === "T" || a.e === "k");
  if (hi < 0) hi = sh.length - 1;
  const h = sh[hi], rest = sh.filter((_, i) => i !== hi);
  const v = rest.length ? rest[rest.length - 1] : null, s = rest.length > 1 ? rest[0] : null;
  const long = h.e === "T" || h.e === "k";
  return { h, v, s, long, hN: long ? NCELL : Math.max(1, Math.min(h.v, 16)), vN: v ? Math.max(1, Math.min(v.v, 10)) : 1 };
}
function splitParts(expr, d) {
  const m = /^(\w+)\+(\w+)$/.exec(expr);
  return m && (m[1] in d) && (m[2] in d) ? [d[m[1]], d[m[2]]] : null;
}
function gridHTML(tid, d, mode) {
  const t = TENS[tid], gm = gridModel(tid, d), col = kc(t.kind);
  const cs = gm.long ? 7 : (gm.hN > 12 ? 10 : 12);
  const gw = gm.hN * cs, gh = gm.vN * cs, sheets = gm.s ? 3 : 1, off = 4;
  const brk = gm.long && gm.h.v > NCELL;
  const Wd = gw + (sheets - 1) * off + 2, Hd = gh + (sheets - 1) * off + 2 + (brk ? 9 : 0);
  let s = `<svg viewBox="0 0 ${Wd} ${Hd}" width="${Wd}" aria-hidden="true">`;
  const gy = 1 + (sheets - 1) * off;
  const hp = gm.long ? null : splitParts(gm.h.e, d), vp = gm.v ? splitParts(gm.v.e, d) : null;
  for (let si = sheets - 1; si >= 0; si--) {
    const ox = 1 + si * off, oy = gy - si * off;
    s += `<rect x="${ox}" y="${oy}" width="${gw}" height="${gh}" style="fill:var(--surface);stroke:var(--line)"/>`;
    if (si) continue;
    for (let i = 0; i < gm.hN; i++) {
      let a = { w: 0.55, full: 0.72, onchip: 0.72, none: 0.1, tile: 0.14, append: 0.14, gather: 0.1 }[mode];
      if (mode === "gather" && dens(i, gm.hN) > 0.15) a = 0.92;
      if (mode === "append" && i === gm.hN - 1) a = 1;
      if (mode === "tile" && i < 5) a = 0.85;
      for (let j = 0; j < gm.vN; j++) s += `<rect x="${ox + i * cs + 0.5}" y="${oy + j * cs + 0.5}" width="${cs - 1}" height="${cs - 1}" style="fill:${col}" fill-opacity="${a}"/>`;
    }
    if (vp) { const c = Math.round(gm.vN * vp[0] / (vp[0] + vp[1])); s += `<line x1="${ox - 1}" x2="${ox + gw + 1}" y1="${oy + c * cs}" y2="${oy + c * cs}" style="stroke:var(--ink2)" stroke-width="1.4"/>`; }
    if (hp) { const c = Math.round(gm.hN * hp[0] / (hp[0] + hp[1])); s += `<line y1="${oy - 1}" y2="${oy + gh + 1}" x1="${ox + c * cs}" x2="${ox + c * cs}" style="stroke:var(--ink2)" stroke-width="1.4"/>`; }
    if (brk) { const bx = ox + Math.round(gm.hN * 0.62) * cs; s += `<path d="M${bx - 4} ${oy + gh + 8} l6 -6 M${bx + 1} ${oy + gh + 8} l6 -6" style="stroke:var(--ink2)" stroke-width="1.3" fill="none"/>`; }
  }
  s += "</svg>";
  const ax = [`가로 ${symOf(gm.h.e)}` + (gm.h.v > gm.hN ? ` (1칸 ≈ ${fmtN(Math.round(gm.h.v / gm.hN))})` : "")];
  if (gm.v) ax.push(`세로 ${symOf(gm.v.e)}`);
  if (gm.s) ax.push(`× ${symOf(gm.s.e)}장`);
  return `<div class="tgw">${s}</div><div class="t-ax">${esc(ax.join(" · "))}</div>`;
}
function moveTile(e, dir, d) {
  const t = TENS[e.t], v = via(e), mv = bytesOf(v, d);
  let mode = t.kind === "weight" ? "w" : "full", lab = t.label;
  if (e.pat === "gather") { mode = "gather"; lab = `${t.label} 골라 읽기`; }
  if (e.pat === "row") { mode = "append"; lab = `${t.label}에 1줄`; }
  if (e.pat === "overwrite") lab = `${t.label} 전체 다시 씀`;
  if (mv === 0) mode = "none";
  const note = v !== e.t && shapeSym(v) !== shapeSym(e.t)
    ? `${dir === "r" ? "읽는" : "쓰는"} 부분 <span class="mono">${esc(shapeSym(v))} = ${esc(shapeNum(v, d))}</span>` : "";
  return `<div class="tile${mv === 0 ? " off" : ""}">
    <div class="t-top"><i style="background:${kc(t.kind)}"></i><b>${esc(lab)}</b><span class="t-b">${fmtB(mv)}</span></div>
    <div class="t-shape mono">${esc(shapeSym(e.t))}</div><div class="t-num mono">= ${esc(shapeNum(e.t, d))}</div>
    ${gridHTML(e.t, d, mode)}${note ? `<div class="t-note">${note}</div>` : ""}${mv === 0 ? `<div class="t-zero">이번 조건에서는 안 씀</div>` : ""}</div>`;
}
function chipTile(e, d) {
  const t = TENS[e.t], m = M.hw.onchip[e.mem];
  return `<div class="tile chip" style="--k:${kc(t.kind)}">
    <div class="t-top"><code class="mb">${esc(m.short)}</code><b>${esc(e.label || t.label)}</b><span class="t-b">${e.stage ? "타일 단위" : fmtB(bytesOf(e.t, d))}</span></div>
    <div class="t-shape mono">${esc(shapeSym(e.t))}</div><div class="t-num mono">= ${esc(shapeNum(e.t, d))}</div>
    ${gridHTML(e.t, d, e.stage ? "tile" : "onchip")}</div>`;
}
function expHTML(k, d) {
  const oc = onChipOf(k);
  const used = dimsUsed([...k.hbm_read.flatMap(e => [e.t, via(e)]), ...(k.hbm_write || []).flatMap(e => [e.t, via(e)]), ...oc.map(e => e.t),
    ...k.steps.flatMap(sid => [...STEP[sid].in, ...STEP[sid].out])]);
  const steps = k.steps.map(sid => { const s = STEP[sid], key = k.id + ":" + sid;
    return `<button type="button" class="kst${state.stepOpen.has(key) ? " on" : ""}" data-op="${esc(key)}" title="눌러서 이 단계의 텐서 계산 펼치기"><code>${UNIT[s.unit]}</code>${esc(s.label)}</button>`; }).join(`<span class="kst-ar" aria-hidden="true">↓</span>`);
  return `<div class="kx-head"><b>${esc(k.id)} ${esc(k.label)} · 텐서 모양</b><span class="kx-dims">${used.map(x => dimLabel(x, d)).join("")}</span></div>
    <div class="kx-cols">
      <div class="kx-col"><div class="kx-t">HBM에서 읽음</div>${k.hbm_read.map(e => moveTile(e, "r", d)).join("")}</div>
      <div class="kx-ar" aria-hidden="true"></div>
      <div class="kx-col mid"><div class="kx-t">칩 안 계산</div><div class="ksteps">${steps}</div>${oc.map(e => chipTile(e, d)).join("")}</div>
      <div class="kx-ar" aria-hidden="true"></div>
      <div class="kx-col"><div class="kx-t">HBM에 씀</div>${(k.hbm_write || []).map(e => moveTile(e, "w", d)).join("")}</div>
    </div>
    <div class="kx-ops"><div class="kx-t">칩 안 계산 — 단계별 텐서<span class="op-hint">단계를 누르면 어떤 텐서끼리 계산해 무엇이 나오는지 펼쳐진다</span><button type="button" class="op-all" data-k="${esc(k.id)}">모두 펼치기</button></div>
      ${k.steps.map(sid => stepRowHTML(k, sid, d)).join("")}</div>`;
}

/* ── 칩 안 계산 단계 펼침: A × B → C ── */
const isW = t => TENS[t].kind === "weight";
function stepOps(s) {   // 단계 → 연산 목록. yaml의 ops가 있으면 그대로, 없으면 입력 · 출력 목록에서 짝을 짓는다
  if (s.ops) return s.ops.map(o => o.a ? { mm: true, a: o.a, b: o.b, out: o.out, note: o.note }
                                       : { mm: false, ins: [].concat(o.in), outs: [].concat(o.out), op: o.op || s.label, note: o.note });
  if (s.unit === "gemm" || s.unit === "gemv") {
    const acts = s.in.filter(t => !isW(t)), wts = s.in.filter(isW);
    if (acts.length === 1 && wts.length && wts.length === s.out.length) return wts.map((w, i) => ({ mm: true, a: acts[0], b: w, out: s.out[i] }));
    if (s.in.length === 2 && s.out.length === 1) return [{ mm: true, a: s.in[0], b: s.in[1], out: s.out[0] }];
  }
  return [{ mm: false, ins: s.in, outs: s.out, op: s.label }];
}
function placeOf(k, tid) {   // 이 커널에서 텐서가 있는 곳
  const oc = onChipOf(k).find(e => e.t === tid);
  const rd = k.hbm_read.some(e => e.t === tid), wr = (k.hbm_write || []).some(e => e.t === tid);
  if (rd && oc) return `HBM → ${M.hw.onchip[oc.mem].short}`;
  if (rd) return "HBM에서";
  if (wr) return "HBM으로";
  return oc ? M.hw.onchip[oc.mem].short : "칩 안";
}
function opTile(k, tid, d) {
  const t = TENS[tid], e = k.hbm_read.find(x => x.t === tid);
  const part = e && via(e) !== tid;   // 일부만 읽는 텐서 (예: KV cache에서 2,048줄만)
  const size = part ? `읽는 양 ${fmtB(bytesOf(via(e), d))} (전체 ${fmtB(bytesOf(tid, d))})` : fmtB(bytesOf(tid, d));
  const mode = t.kind === "weight" ? "w" : (e && e.pat === "gather" ? "gather" : "full");
  return `<div class="tile op-t"><div class="t-top"><i style="background:${kc(t.kind)}"></i><b>${esc(t.label)}</b><code class="mb pl">${esc(placeOf(k, tid))}</code></div>
    <div class="t-shape mono">${esc(shapeSym(tid))}</div><div class="t-num mono">= ${esc(shapeNum(tid, d))} · ${size}</div>${gridHTML(tid, d, mode)}</div>`;
}
const fmtF = f => f >= 1e9 ? (f / 1e9).toPrecision(3) + " GFLOP" : f >= 1e6 ? (f / 1e6).toPrecision(3) + " MFLOP" : fmtN(Math.round(f)) + " FLOP";
function opHTML(k, o, d) {
  if (o.mm) {
    const sa = TENS[o.a].shape.map(String), so = new Set(TENS[o.out].shape.map(String));
    const red = sa.filter(e => !so.has(e)), bat = sa.filter(e => so.has(e));
    const rv = red.reduce((p, e) => p * ev(e, d), 1);
    const cap = [`곱해서 더하는 축: <b class="mono">${esc(red.map(symOf).join(" · ") || "—")}</b> (${fmtN(rv)}개씩)`];
    if (bat.length) cap.push(`그대로 두는 축: <span class="mono">${esc(bat.map(symOf).join(", "))}</span>`);
    if (o.note) cap.push(esc(o.note));
    return `<div class="op-row">${opTile(k, o.a, d)}<span class="op-x">×</span>${opTile(k, o.b, d)}<span class="op-x">→</span>${opTile(k, o.out, d)}</div><div class="op-cap">${cap.join(" · ")}</div>`;
  }
  const ins = o.ins.map(t => opTile(k, t, d)).join(""), outs = o.outs.map(t => opTile(k, t, d)).join("");
  const note = o.note ? `<div class="op-cap">${esc(o.note)}</div>` : "";
  if (o.ins.length + o.outs.length <= 3)   // 적으면 가로: 입력 → 연산 → 출력
    return `<div class="op-row">${ins}<span class="op-fn">→ ${esc(o.op)} →</span>${outs}</div>${note}`;
  return `<div class="op-v"><div class="op-lab">입력</div><div class="op-row">${ins}</div>
    <div class="op-fn op-down">↓ ${esc(o.op)}</div><div class="op-lab">출력</div><div class="op-row">${outs}</div></div>${note}`;   // 많으면 세로
}
const opFormula = o => o.mm ? `${shapeSym(o.a)} × ${shapeSym(o.b)} → ${shapeSym(o.out)}` : `${o.ins.map(shapeSym).join(", ")} → ${o.outs.map(shapeSym).join(", ")}`;
function opBody(k, s, d) {
  const meta = [s.desc ? esc(s.desc) : "", s.flops ? `연산량 ${fmtF(ev(s.flops, d))}` : ""].filter(Boolean).join(" · ");
  return stepOps(s).map(o => opHTML(k, o, d)).join("") + (meta ? `<div class="op-desc">${meta}</div>` : "");
}
function stepRowHTML(k, sid, d) {
  const s = STEP[sid], key = k.id + ":" + sid, open = state.stepOpen.has(key);
  return `<div class="op${open ? " open" : ""}" data-op="${esc(key)}"><button type="button" class="op-h" aria-expanded="${open}"><code>${UNIT[s.unit]}</code><b>${esc(s.label)}</b><span class="op-f mono">${esc(stepOps(s).map(opFormula).join("  ·  "))}</span><span class="op-chev">${open ? "▴" : "▾"}</span></button>
    <div class="op-b"${open ? "" : " hidden"}>${open ? opBody(k, s, d) : ""}</div></div>`;
}
function setOp(key, open, scroll) {
  if (open) state.stepOpen.add(key); else state.stepOpen.delete(key);
  const row = document.querySelector(`.op[data-op="${key}"]`);
  if (!row) return;
  const [kid, sid] = key.split(":");
  row.classList.toggle("open", open);
  row.querySelector(".op-h").setAttribute("aria-expanded", open);
  row.querySelector(".op-chev").textContent = open ? "▴" : "▾";
  const b = row.querySelector(".op-b");
  b.innerHTML = open ? opBody(KERN.find(x => x.id === kid), STEP[sid], dims()) : "";
  b.hidden = !open;
  document.querySelectorAll(`.kst[data-op="${key}"]`).forEach(c => c.classList.toggle("on", open));
  if (scroll && open) row.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderFlow() {
  const d = dims(), ks = kernelNums(d);
  const maxB = Math.max(...ks.map(n => Math.max(n.rd, n.wr)));
  const items = [];
  let r = 2, prevP = -1;
  KERN.forEach((k, i) => {
    const p = kPhase(k);
    if (p !== prevP) {
      const ph = PH[p];
      items.push(`<div class="phrow" id="ph-${esc(ph.id)}" style="grid-row:${r}"><span class="phn">${CIRC[p]} ${esc(ph.label)}</span><span class="tag ${tagCls(ph)}">${esc(ph.tag)}</span></div>`);
      r++; prevP = p;
    }
    const n = ks[i], g = hbmGroups(k, d), open = state.open.has(k.id);
    if (p === prevP && i > 0 && kPhase(KERN[i - 1]) === p) items.push(`<div class="kgap" style="grid-row:${r - 1}"></div>`);
    items.push(`<div class="bridge" style="grid-row:${r} / span 2"></div>`);
    items.push(`<div class="hcell r" style="grid-row:${r}">${listHTML("읽기", g.reads, k.id)}</div>`);
    items.push(`<div class="hcell w" style="grid-row:${r + 1}">${g.writes.length ? listHTML("쓰기", g.writes) : `<div class="hl-t">쓰기 없음</div>`}</div>`);
    items.push(`<div class="acell" style="grid-row:${r}">${arrowSVG("r", n.rd, n.rk, maxB)}</div>`);
    items.push(`<div class="acell" style="grid-row:${r + 1}">${arrowSVG("l", n.wr, n.wk, maxB)}</div>`);
    items.push(cardHTML(k, d, r));
    items.push(`<div class="kx" id="kx-${esc(k.id)}" style="grid-row:${r + 2}"${open ? "" : " hidden"}>${open ? expHTML(k, d) : ""}</div>`);
    r += 4;   // 읽기 · 쓰기 · 펼침 · 간격
  });
  items.push(`<div class="kgap" style="grid-row:${r - 1}"></div>`);   // 레인 아래 여백
  const host = document.getElementById("kgrid");
  host.style.gridTemplateRows = `repeat(${r}, auto)`;
  host.innerHTML =
    `<div class="lane-bg" style="grid-column:1;grid-row:1 / -1"></div><div class="lane-bg" style="grid-column:3;grid-row:1 / -1"></div>
     <div class="lh" style="grid-column:1;grid-row:1"><b>HBM</b><span>커널이 읽고 쓰는 데이터</span></div>
     <div class="lh mid" style="grid-column:2;grid-row:1"><span>→ 읽기 · ← 쓰기</span></div>
     <div class="lh" style="grid-column:3;grid-row:1"><b>칩</b><span>커널 실행 · 점선 = 칩 안 메모리 (SMEM · 레지스터)</span></div>` + items.join("");
  host.querySelectorAll(".kcard").forEach(c => c.addEventListener("click", () => toggle(c.dataset.k)));
}
function toggle(id) {
  const open = !state.open.has(id);
  if (open) state.open.add(id); else state.open.delete(id);
  const c = document.querySelector(`.kcard[data-k="${id}"]`), x = document.getElementById("kx-" + id);
  c.setAttribute("aria-expanded", open);
  c.querySelector(".kchev").textContent = `텐서 모양 ${open ? "▴" : "▾"}`;
  x.innerHTML = open ? expHTML(KERN.find(k => k.id === id), dims()) : "";
  x.hidden = !open;
}

/* ── 조건 · 범례 · 머리말 ── */
function seg(id, opts, cur, label, ext, onPick) {
  const host = document.getElementById(id);
  host.innerHTML = opts.map((v, i) => `<button type="button" data-i="${i}" aria-pressed="${i === cur}"${ext(v) ? ' class="ext" title="지원 길이 밖 · 외삽"' : ""}>${label(v)}</button>`).join("");
  host.querySelectorAll("button").forEach(b => b.addEventListener("click", () => onPick(+b.dataset.i)));
}
function renderControls() {
  const tmax = A.dims.T_max ? A.dims.T_max.value : Infinity;
  seg("tseg", T_OPTS, state.ti, fmtTok, v => v > tmax, i => { state.ti = i; update(); });
  seg("bseg", B_OPTS, state.bi, String, () => false, i => { state.bi = i; update(); });
}
function renderLegend() {
  const used = new Set();
  KERN.forEach(k => { k.hbm_read.concat(k.hbm_write || []).forEach(e => used.add(TENS[e.t].kind)); onChipOf(k).forEach(e => used.add(TENS[e.t].kind)); });
  document.getElementById("legend").innerHTML =
    KIND_ORDER.filter(kd => used.has(kd)).map(kd => `<span><i style="background:${kc(kd)}"></i>${esc(A.kinds[kd].label)}</span>`).join("") +
    `<span><b class="ar">→</b> 읽기 (HBM → 칩)</span><span><b class="ar">←</b> 쓰기 (칩 → HBM)</span><span><i class="dash"></i>칩 안 메모리</span>` +
    (L2_B ? `<span title="${esc(L2_TIP)}"><em class="l2">L2</em>L2 캐시에서 끝날 수 있는 작은 전달값</span>` : "");
}
function update() { renderControls(); renderSummary(); renderFlow(); }

(function init() {
  const base = DATA.pages || "";
  document.getElementById("crumbs").innerHTML = (P.crumbs || []).map(c => `<span class="crumb">${esc(c)}</span>`).join("");
  document.getElementById("h1").textContent = LITE.doc_title || P.doc_title;
  document.getElementById("subtext").textContent = LITE.sub || "";
  const links = [`<a class="main" href="${esc(base + P.file + ".html")}" target="_blank" rel="noopener">자세한 버전 →</a>`];
  if (LITE.sibling) links.push(`<a href="${esc(base + LITE.sibling.file + "-lite.html")}" target="_blank" rel="noopener">${esc(LITE.sibling.label)} →</a>`);
  document.getElementById("links").innerHTML = links.join("");
  document.getElementById("foot").innerHTML = `${esc(M.name)} · 이론 하한 = max(바이트 ÷ ${M.hw.hbm_bw / 1e12} TB/s, FLOP ÷ 피크). 가정 · 검증 · 단계별 설명은 <a href="${esc(base + P.file + ".html")}" target="_blank" rel="noopener">자세한 버전</a>에 있다.`;
  renderLegend();
  // 칩 안 계산 단계 펼침 — kgrid 안에서 위임 처리 (펼침 영역은 다시 그려지므로)
  document.getElementById("kgrid").addEventListener("click", e => {
    const all = e.target.closest(".op-all");
    if (all) {
      const keys = KERN.find(x => x.id === all.dataset.k).steps.map(sid => all.dataset.k + ":" + sid);
      const open = keys.some(key => !state.stepOpen.has(key));
      keys.forEach(key => setOp(key, open, false));
      all.textContent = open ? "모두 접기" : "모두 펼치기";
      return;
    }
    const h = e.target.closest(".op-h, button.kst");
    if (!h) return;
    const key = h.closest("[data-op]").dataset.op;
    setOp(key, !state.stepOpen.has(key), h.classList.contains("kst"));
  });
  update();
})();
})();
</script>
