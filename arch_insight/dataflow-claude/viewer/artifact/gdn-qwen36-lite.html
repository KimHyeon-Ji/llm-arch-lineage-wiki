<title>Gated DeltaNet 데이터 이동</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 약식 — 보고서 그림 문법(연한 레인 패널 · 흰 카드 · 굵은 수치). 위 "흐름 한눈에" = 단계별 HBM 막대 + 칩 레인,
   아래 "커널별 이동" = HBM 레인 | 굵은 화살표(굵기 = 바이트) | 칩 레인 3열. 커널 칸을 누르면 텐서 모양이 아래로 펼쳐진다.
   색 = 데이터 종류 (yaml kinds.color). 설명 문장 · 결론은 자세한 버전에 둔다. */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --surface2: #f6f7fb; --lane: #f2f4f9; --tint: #eef0f6;
  --ink: #2b2f3a; --ink2: #4a5573; --muted: #6b7080; --line: #dfe2ec; --line2: #e6e8f1; --axis: #9aa0b0;
  --c-gray: #9c9a92; --c-gray-l: #dddcd6; --c-blue: #2a78d6; --c-blue-l: #b7d3f6; --c-orange: #eb6834; --c-orange-l: #f8c6b1;
  --c-green: #1baf7a; --c-green-l: #a9e0cb; --c-yellow: #eda100; --c-yellow-l: #f7d98f; --c-pink: #e87ba4; --c-pink-l: #f6c9da; --c-violet: #6250d6; --c-violet-l: #d6d1f5;
  --font-text: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --bridge: #f8f9fc;
  --cols: 290px 232px minmax(0, 1fr);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --surface: #1a1d24; --surface2: #20242c; --lane: #1f232b; --tint: #262a33; --bridge: #1d2027;
    --ink: #eceef3; --ink2: #b6bfd3; --muted: #8b92a3; --line: #2f3440; --line2: #262b35; --axis: #5d6474;
    --c-gray: #8f8d86; --c-gray-l: #45443f; --c-blue: #3987e5; --c-blue-l: #1f3a5f; --c-orange: #d95926; --c-orange-l: #5a2f1c;
    --c-green: #199e70; --c-green-l: #1b4537; --c-yellow: #c98500; --c-yellow-l: #4f3c12; --c-pink: #d55181; --c-pink-l: #552538; --c-violet: #9085e9; --c-violet-l: #2f2a5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --surface: #1a1d24; --surface2: #20242c; --lane: #1f232b; --tint: #262a33; --bridge: #1d2027;
  --ink: #eceef3; --ink2: #b6bfd3; --muted: #8b92a3; --line: #2f3440; --line2: #262b35; --axis: #5d6474;
  --c-gray: #8f8d86; --c-gray-l: #45443f; --c-blue: #3987e5; --c-blue-l: #1f3a5f; --c-orange: #d95926; --c-orange-l: #5a2f1c;
  --c-green: #199e70; --c-green-l: #1b4537; --c-yellow: #c98500; --c-yellow-l: #4f3c12; --c-pink: #d55181; --c-pink-l: #552538; --c-violet: #9085e9; --c-violet-l: #2f2a5c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px; font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.mono { font-family: var(--font-mono); }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--c-blue); outline-offset: 2px; }

header.top { display: flex; flex-direction: column; gap: 6px; padding: 2px; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.crumb { font-size: 12px; font-weight: 700; color: var(--ink2); background: var(--tint); border-radius: 999px; padding: 2px 10px; }
.h1row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.litechip { font-size: 12.5px; font-weight: 800; color: var(--surface); background: var(--ink2); border-radius: 6px; padding: 2px 9px; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.links a { font-size: 13px; color: var(--ink2); font-weight: 700; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--surface); }
.links a.main { background: var(--ink2); color: var(--surface); border-color: var(--ink2); }
.links a:hover { border-color: var(--ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.blk { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 12px; }
.blk .name { display: inline-flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 800; }
.blk .name::before { content: ""; width: 5px; height: 18px; border-radius: 2px; background: var(--ink2); flex: none; align-self: center; }
.blk .what { font-size: 13px; color: var(--muted); }

/* 조건 + 범례 */
.ctlbar { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; padding: 12px 16px; }
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl .cl { font-size: 13px; font-weight: 800; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 12.5px; font-weight: 500; padding: 4px 9px; border: 0; background: var(--surface); color: var(--ink2); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.ext { color: var(--muted); font-style: italic; }
.seg button[aria-pressed=true] { background: var(--ink2); color: var(--surface); font-weight: 800; font-style: normal; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); width: 100%; padding-top: 10px; border-top: 1px solid var(--line2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; }
.legend .ar { font-weight: 800; color: var(--ink); }
.legend .dash { width: 18px; height: 11px; border: 1.5px dashed var(--ink2); border-radius: 6px; background: transparent; }

.scroll { overflow-x: auto; }
#sum svg { display: block; width: 100%; min-width: 900px; height: auto; }
svg text { fill: var(--ink); font-family: var(--font-text); }
svg .t-muted { fill: var(--muted); }
svg .t-inv { fill: var(--surface); }
svg .t-mono { font-family: var(--font-mono); }
svg .lane { fill: var(--lane); }
svg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
svg .boxhit { cursor: pointer; }
svg .boxhit:hover .box { stroke: var(--ink2); }

/* 커널별 이동 */
.kgrid { display: grid; grid-template-columns: var(--cols); min-width: 900px; position: relative; }
.lane-bg { background: var(--lane); border-radius: 14px; }
.lh { padding: 14px 18px 8px; display: flex; flex-direction: column; gap: 1px; }
.lh b { font-size: 18px; font-weight: 800; }
.lh span { font-size: 12.5px; color: var(--muted); }
.lh.mid { justify-content: flex-end; align-items: center; text-align: center; padding: 14px 6px 8px; }
.lh.mid span { font-size: 12px; }
.phrow { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 16px 18px 4px; scroll-margin-top: 12px; }
.phrow .phn { font-size: 15px; font-weight: 800; }
.phrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.tag.strong { background: var(--ink2); border-color: var(--ink2); color: var(--surface); }
.tag.outline { border-color: var(--ink2); color: var(--ink2); }
/* 커널 1개 = 한 줄 묶음: HBM 카드(읽기 칸 + 쓰기 칸) · 화살표 띠 · 커널 카드가 같은 높이, 커널 사이에 간격 줄 */
.hcell { grid-column: 1; margin: 0 12px 0 14px; background: var(--surface); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.hcell.r { border-bottom: 0; border-radius: 10px 10px 0 0; padding: 12px 14px 10px; }
.hcell.w { border-top: 0; border-radius: 0 0 10px 10px; padding: 10px 14px 12px; position: relative; }
.hcell.w::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; border-top: 1px dashed var(--line); }
.hk-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.hk { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--ink2); border: 1.5px solid var(--ink2); border-radius: 5px; padding: 0 6px; line-height: 1.5; }
.hk-row .hl-t { margin-bottom: 0; }
.bridge { grid-column: 2; background: var(--bridge); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2); }
.kgap { grid-column: 1 / -1; height: 18px; }
.hl-t { font-size: 12.5px; font-weight: 800; margin-bottom: 3px; color: var(--ink); }
.hl-i { display: grid; grid-template-columns: 11px minmax(0, 1fr) auto; gap: 7px; align-items: center; font-size: 12.5px; line-height: 1.55; }
.hl-i i { width: 10px; height: 10px; border-radius: 2px; }
.hl-i .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-i .b { color: var(--muted); font-size: 12px; }
.l2 { font-style: normal; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--muted); border: 1px dashed var(--axis); border-radius: 4px; padding: 0 4px; margin-right: 6px; line-height: 1.4; display: inline-block; }
.hl-i.sm { color: var(--muted); }
.hl-i.sm i { opacity: 0.7; }
.hl-i.zero { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--axis); }
.acell { grid-column: 2; display: flex; align-items: center; justify-content: center; margin: 0 -14px 0 -12px; padding: 12px 0; min-width: 0; position: relative; z-index: 1; }
.acell svg { display: block; overflow: visible; }
.acell .al { font-size: 12px; fill: var(--muted); font-weight: 700; }
.acell .ab { font-size: 16px; font-weight: 800; }
.kcard { grid-column: 3; margin: 0 14px; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 6px; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; cursor: pointer; min-width: 0; }
.kcard:hover { border-color: var(--axis); }
.kcard[aria-expanded=true] { border-color: var(--ink2); box-shadow: 0 0 0 1px var(--ink2); }
.khead { display: flex; align-items: center; gap: 10px; }
.kid { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; background: var(--ink2); color: var(--surface); border-radius: 5px; padding: 2px 7px; flex: none; }
.kname { font-size: 17px; font-weight: 800; }
.kchev { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; white-space: nowrap; flex: none; }
.kcard[aria-expanded=true] .kchev { background: var(--ink2); color: var(--surface); border-color: var(--ink2); }
.kplain { font-size: 13px; color: var(--muted); }
.kchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.kchips .kcl { font-weight: 700; color: var(--muted); margin-right: 2px; }
.ocp { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--k); border-radius: 999px; padding: 1px 10px 1px 4px; background: var(--surface); }
.ocp em { font-style: normal; color: var(--muted); }
code.mb { font-family: var(--font-mono); font-size: 10px; font-weight: 700; background: var(--ink2); color: var(--surface); border-radius: 3px; padding: 1px 5px; }

/* 펼친 계산 단계 — 단계마다 한 줄: 입력 텐서 × 입력 텐서 → 출력 텐서 */
.kx { grid-column: 1 / -1; margin: 12px 14px 0; background: var(--surface); border: 1px solid var(--ink2); border-radius: 12px; padding: 12px 16px 4px; position: relative; z-index: 2; }
.kx-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding-bottom: 9px; border-bottom: 1px solid var(--line2); }
.kx-head b { font-size: 14.5px; font-weight: 800; }
.kx-dims { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
.kx-dims b { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--ink); margin-right: 3px; }
.kx-key { margin-left: auto; display: flex; gap: 6px; }
.st { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; align-items: start; padding: 11px 0; }
.st + .st { border-top: 1px dashed var(--line2); }
.st-h { display: flex; align-items: center; gap: 7px; font-size: 13px; padding-top: 3px; min-width: 0; }
.st-n { font-weight: 800; color: var(--ink2); }
.st-h code { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--ink2); background: var(--tint); border-radius: 4px; padding: 1px 5px; }
.st-h b { font-weight: 800; }
.st-b { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.eq .op { font-style: normal; font-size: 16px; font-weight: 800; color: var(--ink2); }
.eq .cm { font-style: normal; color: var(--muted); margin-left: -4px; }
.eq-n { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 9px; border: 1.5px solid var(--k); border-radius: 8px; background: var(--surface); font-size: 12.5px; white-space: nowrap; }
.pill.chip { border-style: dashed; }
.pill b { font-weight: 800; }
.pill code { font-family: var(--font-mono); font-size: 12px; }
.pill em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.pill.key { --k: var(--axis); font-size: 11.5px; color: var(--muted); padding: 1px 8px; }
.foot { font-size: 12.5px; color: var(--muted); margin: 0; padding: 0 2px; }
.foot a { color: var(--ink2); font-weight: 700; }

@media (max-width: 640px) { h1 { font-size: 22px; } }
@media (prefers-reduced-motion: no-preference) { .kcard, .seg button { transition: border-color 120ms, box-shadow 120ms, background 120ms; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="crumbs" id="crumbs"></div>
    <div class="h1row"><h1 id="h1"></h1><span class="litechip">약식</span></div>
    <p class="sub" id="subtext"></p>
    <nav class="links" id="links" aria-label="다른 버전"></nav>
  </header>

  <section class="panel ctlbar" aria-label="조건">
    <div class="ctl"><span class="cl">컨텍스트 길이 T</span><div class="seg" role="group" id="tseg" aria-label="컨텍스트 길이 T"></div></div>
    <div class="ctl"><span class="cl">동시 요청 수 B</span><div class="seg" role="group" id="bseg" aria-label="동시 요청 수 B"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel" aria-label="흐름 한눈에">
    <div class="blk"><span class="name">흐름 한눈에</span><span class="what" id="sumwhat"></span></div>
    <div class="scroll"><div id="sum"></div></div>
  </section>

  <section class="panel" aria-label="커널별 이동">
    <div class="blk"><span class="name">커널별 이동</span><span class="what">화살표 굵기 = 옮기는 바이트 (√ 눈금 · 100배 차이 = 10배 굵기) · 커널 칸을 누르면 계산 단계(텐서 × 텐서 → 텐서)가 펼쳐진다</span></div>
    <div class="scroll"><div class="kgrid" id="kgrid"></div></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

/* L2 표시: 상주 데이터(가중치 · cache · state)가 아니고 L2 절반 이하인 값 = 앞뒤 커널이 주고받는 작은 전달값 */

/* ── 커널별 이동: 굵은 화살표 ── */

/* ── 펼침: 칩 안 계산 단계 — 텐서 칩으로 A × B → C ── */

  if (open) state.open.add(id); else state.open.delete(id);
  const c = document.querySelector(`.kcard[data-k="${id}"]`), x = document.getElementById("kx-" + id);
  c.setAttribute("aria-expanded", open);
  c.querySelector(".kchev").textContent = `계산 단계 ${open ? "▴" : "▾"}`;
  x.innerHTML = open ? expHTML(KERN.find(k => k.id === id), dims()) : "";
  x.hidden = !open;
}

/* ── 조건 · 범례 · 머리말 ── */
function seg(id, opts, cur, label, ext, onPick) {
  const host = document.getElementById(id);
  host.innerHTML = opts.map((v, i) => `<button type="button" data-i="${i}" aria-pressed="${i === cur}"${ext(v) ? ' class="ext" title="지원 길이 밖 · 외삽"' : ""}>${label(v)}</button>`).join("");
  host.querySelectorAll("button").forEach(b => b.addEventListener("click", () => onPick(+b.dataset.i)));
}
function renderControls() {
  const tmax = A.dims.T_max ? A.dims.T_max.value : Infinity;
  seg("tseg", T_OPTS, state.ti, fmtTok, v => v > tmax, i => { state.ti = i; update(); });
  seg("bseg", B_OPTS, state.bi, String, () => false, i => { state.bi = i; update(); });
}
function renderLegend() {
  const used = new Set();
  KERN.forEach(k => { k.hbm_read.concat(k.hbm_write || []).forEach(e => used.add(TENS[e.t].kind)); onChipOf(k).forEach(e => used.add(TENS[e.t].kind)); });
  document.getElementById("legend").innerHTML =
    KIND_ORDER.filter(kd => used.has(kd)).map(kd => `<span><i style="background:${kc(kd)}"></i>${esc(A.kinds[kd].label)}</span>`).join("") +
    `<span><b class="ar">→</b> 읽기 (HBM → 칩)</span><span><b class="ar">←</b> 쓰기 (칩 → HBM)</span><span><i class="dash"></i>칩 안 메모리</span>` +
    (L2_B ? `<span title="${esc(L2_TIP)}"><em class="l2">L2</em>L2 캐시에서 끝날 수 있는 작은 전달값</span>` : "");
}
function update() { renderControls(); renderSummary(); renderFlow(); }

(function init() {
  const base = DATA.pages || "";
  document.getElementById("crumbs").innerHTML = (P.crumbs || []).map(c => `<span class="crumb">${esc(c)}</span>`).join("");
  document.getElementById("h1").textContent = LITE.doc_title || P.doc_title;
  document.getElementById("subtext").textContent = LITE.sub || "";
  const links = [`<a class="main" href="${esc(base + P.file + ".html")}" target="_blank" rel="noopener">자세한 버전 →</a>`];
  if (LITE.sibling) links.push(`<a href="${esc(base + LITE.sibling.file + "-lite.html")}" target="_blank" rel="noopener">${esc(LITE.sibling.label)} →</a>`);
  document.getElementById("links").innerHTML = links.join("");
  document.getElementById("foot").innerHTML = `${esc(M.name)} · 이론 하한 = max(바이트 ÷ ${M.hw.hbm_bw / 1e12} TB/s, FLOP ÷ 피크). 가정 · 검증 · 단계별 설명은 <a href="${esc(base + P.file + ".html")}" target="_blank" rel="noopener">자세한 버전</a>에 있다.`;
  renderLegend();
  update();
})();
})();
</script>
