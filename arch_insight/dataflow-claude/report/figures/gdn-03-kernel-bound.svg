="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">K3</text><text x="92.0" y="363.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#2b2f3a">state 갱신 커널</text><circle cx="699.0" cy="357.0" r="5" fill="#1baf7a"/><circle cx="699.0" cy="357.0" r="8" fill="#ffffff" stroke="#1baf7a" stroke-width="3"/><circle cx="699.0" cy="357.0" r="8" fill="#1baf7a"/><text x="1130.0" y="363.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">6.32 MB → 1.62 GB</text><text x="1430.0" y="363.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">0.9 → 0.9 FLOP/B</text><line x1="40.0" y1="432.0" x2="1640.0" y2="432.0" stroke="#e6e8f1" stroke-width="1" stroke-linecap="round"/><text x="40.0" y="413.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">K4</text><text x="92.0" y="413.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#2b2f3a">gate 정규화</text><circle cx="731.5" cy="407.0" r="5" fill="#6250d6"/><circle cx="731.5" cy="407.0" r="8" fill="#ffffff" stroke="#6250d6" stroke-width="3"/><circle cx="730.9" cy="407.0" r="8" fill="#6250d6"/><text x="1130.0" y="413.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">37.1 KB → 9.44 MB</text><text x="1430.0" y="413.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">1.3 → 1.3 FLOP/B</text><line x1="40.0" y1="482.0" x2="1640.0" y2="482.0" stroke="#e6e8f1" stroke-width="1" stroke-linecap="round"/><text x="40.0" y="463.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16"