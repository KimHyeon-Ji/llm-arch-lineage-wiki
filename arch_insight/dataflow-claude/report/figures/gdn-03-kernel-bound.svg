<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 682" width="1680" height="682"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">Gated DeltaNet linear 층 1개 — 커널별 병목 위치: 요청이 늘면 어디로 움직이나</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">문맥 무관 · H200 이론값 (HBM 4.8 TB/s · BF16 989 · FP32 vector 67 TFLOPS) · 1보다 작으면 메모리 대역폭이 병목</text><circle cx="48" cy="124" r="8" fill="#2b2f3a"/><text x="64.0" y="130.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">요청 1개</text><circle cx="163.8" cy="124" r="5" fill="#2b2f3a"/><text x="179.8" y="130.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">요청 32개</text><circle cx="288.0" cy="124" r="7" fill="#ffffff" stroke="#2b2f3a" stroke-width="2.5"/><text x="304.0" y="130.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">요청 256개</text><rect x="432.6" y="115.0" width="16.0" height="16.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1.5"/><text x="456.6" y="130.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">주 데이터: 가중치</text><rect x="612.8" y="115.0" width="16.0" height="16.0" rx="3" fill="#e87ba4" stroke="none" stroke-width="1.5"/><text x="636.8" y="130.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">conv state</text><rect x="746.8" y="115.0" width="16.0" height="16.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1.5"/><text x="770.8" y="130.0" font-family="'Noto Sans KR','Malgun Gothic',sans-se