"700" fill="#2b2f3a">→ 가중치 GEMM은 요청 약 200개에서 연산 쪽으로 넘어가지만, state 갱신은 제자리 — 1바이트당 0.9 FLOP라 늘 대역폭 문제</text><text x="40.0" y="638.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">state는 요청마다 따로라 요청이 늘어도 1바이트당 연산이 그대로 · GEMM 경계는 실효 성능에 따라 달라짐</text></svg>