<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 940" width="1760" height="940"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">종합 — sparse · hybrid가 바꾼 데이터 특성 → 인사이트 → HW</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">줄마다 데이터 하나 · 숫자는 본문과 같은 계산 · 알약 = 이어지는 HW 대응</text><text x="40.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">데이터 특성 (어느 모델 · 어떻게 읽고 쓰나)</text><text x="640.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">인사이트 (비교에서 보이는 것)</text><text x="1190.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">HW로 연결</text><rect x="40.0" y="170.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="170.0" width="7.0" height="124.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="193.0" width="15.0" height="15.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="87.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">Full MLA의 KV</text><text x="64.0" y="236.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">토큰마다 추가 · 전부 읽음 — 토큰당 40 KB, 요청 수 × 문맥에 비례</text><rect x="640.0" y="170.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">저장한 만큼 매 스텝 읽음</text><text x="664.0" y="232.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">128K에서 요청 약 130개부터 저장량 · 읽고 쓰는 양 모두</text><text x="664.0" y="254.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">가중치를 넘음</text><rect x="1190.0" y="170.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="188.0" width="128.7" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1278.3" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">KV 압축 · 저정밀</text><text x="1214.0" y="242.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">HBM 용량 · 대역폭을 함께, KV 압축 · 저정밀</text><text x="1214.0" y="268.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">아래 계층 메모리는 읽기 속도가 모자라 효과가 제한됨</text><line x1="580.0" y1="232.0" x2="622.0" y2="232.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,225.0 L630.0,232.0 L620.0,239.0 Z" fill="#4a5573"/><line x1="1130.0" y1="232.0" x2="1172.0" y2="232.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,225.0 L1180.0,232.0 L1170.0,239.0 Z" fill="#4a5573"/><rect x="40.0" y="312.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="312.0" width="7.0" height="124.0" rx="3" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="335.0" width="15.0" height="15.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="87.0" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">골라 읽는 KV (sparse · hybrid 4개)</text><text x="64.0" y="378.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">토큰마다 추가 · 골라 읽음 — 요청마다 정해진 개수(2,048 · 512)만</text><text x="64.0" y="400.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">읽음</text><rect x="640.0" y="312.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">읽는 양은 줄지만 저장량은 그대로</text><text x="664.0" y="374.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">저장량이 가중치를 넘는 요청 수가 읽고 쓰는 양 기준의 1/3 ~</text><text x="664.0" y="396.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">1/9 · DSA 저장량은 색인 키만큼 20% 늘어남</text><rect x="1190.0" y="312.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="330.0" width="80.8" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1254.4" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">계층형 KV</text><text x="1214.0" y="384.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">전체 KV는 큰 메모리, 고를 KV만 HBM</text><text x="1214.0" y="410.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">고르는 KV가 연속 스텝에서 겹칠수록 · 블록 단위로 옮길수록 유리</text><line x1="580.0" y1="374.0" x2="622.0" y2="374.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,367.0 L630.0,374.0 L620.0,381.0 Z" fill="#4a5573"/><line x1="1130.0" y1="374.0" x2="1172.0" y2="374.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,367.0 L1180.0,374.0 L1170.0,381.0 Z" fill="#4a5573"/><rect x="40.0" y="454.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="454.0" width="7.0" height="124.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="477.0" width="15.0" height="15.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1"/><text x="87.0" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">전부 읽는 색인 · 블록 키 (sparse · hybrid 4개)</text><text x="64.0" y="520.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">토큰마다 추가 · 전부 읽음 — 토큰당 0.7 ~ 8 KB</text><rect x="640.0" y="454.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">골라 읽는 모델에서 요청마다 읽는 양의 큰 몫</text><text x="664.0" y="516.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 256개 · 128K 모델 전체 읽고 쓰는 양 중: DSA 27% ·</text><text x="664.0" y="538.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">CSA + HCA 12.5% · GDN + QSA 7.4% · KDA + DSA 5.6%</text><rect x="1190.0" y="454.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="472.0" width="125.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1276.8" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">메모리 근처 선택</text><text x="1214.0" y="526.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">메모리 근처 선택 · 색인 연산 · top-k</text><text x="1214.0" y="552.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">키 형식 · head 수에 따라 1바이트당 계산이 4 ~ 124번으로 갈림</text><line x1="580.0" y1="516.0" x2="622.0" y2="516.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,509.0 L630.0,516.0 L620.0,523.0 Z" fill="#4a5573"/><line x1="1130.0" y1="516.0" x2="1172.0" y2="516.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,509.0 L1180.0,516.0 L1170.0,523.0 Z" fill="#4a5573"/><rect x="40.0" y="596.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="596.0" width="7.0" height="124.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1.5"/><rect x="64.0" y="619.0" width="15.0" height="15.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="87.0" y="632.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">다시 쓰는 state (hybrid 2개)</text><text x="64.0" y="662.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">매 스텝 전부 다시 씀 — 요청당 115 ~ 449 MB, 문맥과 무관</text><rect x="640.0" y="596.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="632.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">요청이 많으면 문맥이 짧아도 읽고 쓰는 양이 남음</text><text x="664.0" y="658.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 256개 · 8K 모델 전체 읽고 쓰는 양 중: GDN + QSA 18%</text><text x="664.0" y="680.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">· KDA + DSA 13%</text><rect x="1190.0" y="596.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="614.0" width="85.5" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1256.8" y="632.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">state PIM</text><text x="1214.0" y="668.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">메모리 안에서 갱신해 왕복 제거</text><text x="1214.0" y="694.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">이득은 갱신 연산을 메모리 쪽이 감당하는지에 달림</text><line x1="580.0" y1="658.0" x2="622.0" y2="658.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,651.0 L630.0,658.0 L620.0,665.0 Z" fill="#4a5573"/><line x1="1130.0" y1="658.0" x2="1172.0" y2="658.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,651.0 L1180.0,658.0 L1170.0,665.0 Z" fill="#4a5573"/><rect x="40.0" y="738.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="738.0" width="7.0" height="124.0" rx="3" fill="#dddcd6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="761.0" width="15.0" height="15.0" rx="3" fill="#dddcd6" stroke="#c9ccd6" stroke-width="1"/><text x="87.0" y="774.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">MoE 가중치 (전 모델)</text><text x="64.0" y="804.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">읽기만 · 골라 읽음 — 요청이 늘면 대부분을 읽음</text><rect x="640.0" y="738.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="774.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">sparse · hybrid에서는 다시 읽는 양의 대부분</text><text x="664.0" y="800.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 32개 · 128K: 요청 데이터를 읽고 쓰는 양은 전체의 4 ~</text><text x="664.0" y="822.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">9%뿐 (Full MLA는 28%)</text><rect x="1190.0" y="738.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="756.0" width="112.6" height="26.0" rx="13" fill="#c9ccd6" stroke="none" stroke-width="1.5"/><text x="1270.3" y="774.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">가중치 쪽 대응</text><text x="1214.0" y="810.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">가중치 읽기 속도 · 요청 수에 맞춘 배치</text><text x="1214.0" y="836.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">attention 쪽 HW 이득의 상한 = 요청 데이터가 차지하는 비중</text><line x1="580.0" y1="800.0" x2="622.0" y2="800.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,793.0 L630.0,800.0 L620.0,807.0 Z" fill="#4a5573"/><line x1="1130.0" y1="800.0" x2="1172.0" y2="800.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,793.0 L1180.0,800.0 L1170.0,807.0 Z" fill="#4a5573"/></svg>