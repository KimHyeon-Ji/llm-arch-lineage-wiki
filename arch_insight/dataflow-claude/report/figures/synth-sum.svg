<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 940" width="1760" height="940"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">종합 — sparse · hybrid가 바꾼 데이터 특성 → 인사이트 → HW</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">줄마다 데이터 성격 하나 · 숫자는 본문과 같은 계산 · 괄호 절 번호 = 기준 보고서 Ⅱ장</text><text x="40.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">데이터 특성 (어느 모델 · 어떤 성격)</text><text x="640.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">인사이트 (비교에서 보이는 것)</text><text x="1190.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">HW로 연결</text><rect x="40.0" y="170.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="170.0" width="7.0" height="124.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="193.0" width="15.0" height="15.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="87.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">full KV (V3.1)</text><text x="64.0" y="236.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">끝에 추가 · 전부 읽음 — 토큰당 40 KB, 요청 × 문맥에 비례</text><rect x="640.0" y="170.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">보관한 만큼 매 스텝 읽음</text><text x="664.0" y="232.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">128K에서 요청 126 ~ 129개부터 보관 · 이동 모두 요청별</text><text x="664.0" y="254.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">데이터가 가중치를 넘음</text><rect x="1190.0" y="170.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="188.0" width="191.1" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1309.5" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.5 이종 가속기 · PD 분리</text><text x="1214.0" y="242.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">HBM 용량 · 대역폭을 함께, KV 압축 · 저정밀</text><text x="1214.0" y="268.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">아래 계층 메모리는 읽기 대역폭이 모자라 효과 제한</text><line x1="580.0" y1="232.0" x2="622.0" y2="232.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,225.0 L630.0,232.0 L620.0,239.0 Z" fill="#4a5573"/><line x1="1130.0" y1="232.0" x2="1172.0" y2="232.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,225.0 L1180.0,232.0 L1170.0,239.0 Z" fill="#4a5573"/><rect x="40.0" y="312.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="312.0" width="7.0" height="124.0" rx="3" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="335.0" width="15.0" height="15.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="87.0" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">골라 읽는 KV (V3.2 · V4 · K3.1 · Q3.8)</text><text x="64.0" y="378.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">끝에 추가 · 골라 읽음 — 요청당 고정 예산(2,048 · 512)만 읽음</text><rect x="640.0" y="312.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">이동은 줄지만 보관은 그대로 — 용량이 먼저 막힘</text><text x="664.0" y="374.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">보관 역전이 이동 역전보다 3.3 ~ 8.9배 먼저 · V3.2 보관은</text><text x="664.0" y="396.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">색인 키만큼 오히려 20% 늘어남</text><rect x="1190.0" y="312.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="330.0" width="110.0" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1269.0" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.1 계층형 KV</text><text x="1214.0" y="384.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">전체 KV는 큰 메모리, 고를 KV만 HBM</text><text x="1214.0" y="410.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">선택 겹침 · 블록 단위 전송이 클수록 유리</text><line x1="580.0" y1="374.0" x2="622.0" y2="374.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,367.0 L630.0,374.0 L620.0,381.0 Z" fill="#4a5573"/><line x1="1130.0" y1="374.0" x2="1172.0" y2="374.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,367.0 L1180.0,374.0 L1170.0,381.0 Z" fill="#4a5573"/><rect x="40.0" y="454.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="454.0" width="7.0" height="124.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="477.0" width="15.0" height="15.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1"/><text x="87.0" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">전부 읽는 색인 · 블록 키 (V3.2 · V4 · K3.1 · Q3.8)</text><text x="64.0" y="520.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">끝에 추가 · 전부 읽음 — 토큰당 0.7 ~ 8 KB</text><rect x="640.0" y="454.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">골라 읽는 모델의 요청별 이동 중 큰 몫</text><text x="664.0" y="516.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 256개 · 128K 모델 이동: V3.2 27% · V4 12.5% · Q3.8</text><text x="664.0" y="538.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">7.4% · K3.1 5.6%</text><rect x="1190.0" y="454.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="472.0" width="154.7" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1291.3" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.2 메모리 근처 선택</text><text x="1214.0" y="526.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">메모리 근처 선택 · 색인 연산 · top-k</text><text x="1214.0" y="552.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">키 형식 · head 수에 따라 연산 요구가 4 ~ 124 FLOP/B로 갈림</text><line x1="580.0" y1="516.0" x2="622.0" y2="516.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,509.0 L630.0,516.0 L620.0,523.0 Z" fill="#4a5573"/><line x1="1130.0" y1="516.0" x2="1172.0" y2="516.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,509.0 L1180.0,516.0 L1170.0,523.0 Z" fill="#4a5573"/><rect x="40.0" y="596.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="596.0" width="7.0" height="124.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1.5"/><rect x="64.0" y="619.0" width="15.0" height="15.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="87.0" y="632.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">다시 쓰는 state (K3.1 · Q3.8)</text><text x="64.0" y="662.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">매 스텝 전부 다시 씀 — 요청당 115 ~ 449 MB, 문맥과 무관</text><rect x="640.0" y="596.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="632.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">많은 요청 · 짧은 문맥에서도 이동이 남음</text><text x="664.0" y="658.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 256개 · 8K: Q3.8 이동 18% · K3.1 13% — 이동 비중이</text><text x="664.0" y="680.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">보관 비중의 약 2배</text><rect x="1190.0" y="596.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="614.0" width="114.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1271.3" y="632.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.4 state PIM</text><text x="1214.0" y="668.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">메모리 안 갱신으로 왕복 제거</text><text x="1214.0" y="694.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">이득은 갱신 연산을 메모리 쪽이 감당하는지에 달림</text><line x1="580.0" y1="658.0" x2="622.0" y2="658.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,651.0 L630.0,658.0 L620.0,665.0 Z" fill="#4a5573"/><line x1="1130.0" y1="658.0" x2="1172.0" y2="658.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,651.0 L1180.0,658.0 L1170.0,665.0 Z" fill="#4a5573"/><rect x="40.0" y="738.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="738.0" width="7.0" height="124.0" rx="3" fill="#dddcd6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="761.0" width="15.0" height="15.0" rx="3" fill="#dddcd6" stroke="#c9ccd6" stroke-width="1"/><text x="87.0" y="774.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">MoE 가중치 (전 모델)</text><text x="64.0" y="804.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">read-only · 골라 읽음 — 요청이 늘면 대부분을 읽음</text><rect x="640.0" y="738.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="774.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">sparse · hybrid에서는 다시 이동의 대부분</text><text x="664.0" y="800.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 32개 · 128K: 요청별 데이터 이동은 전체의 4 ~ 9%뿐</text><text x="664.0" y="822.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">(V3.1은 28%)</text><rect x="1190.0" y="738.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="756.0" width="145.8" height="26.0" rx="13" fill="#c9ccd6" stroke="none" stroke-width="1.5"/><text x="1286.9" y="774.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">기준 보고서 범위 밖</text><text x="1214.0" y="810.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">가중치 대역폭 · 요청 수에 맞춘 배치</text><text x="1214.0" y="836.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">attention 쪽 HW 이득의 상한 = 요청별 이동 비중</text><line x1="580.0" y1="800.0" x2="622.0" y2="800.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,793.0 L630.0,800.0 L620.0,807.0 Z" fill="#4a5573"/><line x1="1130.0" y1="800.0" x2="1172.0" y2="800.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,793.0 L1180.0,800.0 L1170.0,807.0 Z" fill="#4a5573"/></svg>