',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">읽는 비율 = 스텝마다 읽는 양 ÷ 저장량</text><text x="1150.0" y="517.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">(state를 다시 쓰는 양은 세로축에만 들어감)</text><text x="1150.0" y="558.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="800" fill="#2b2f3a">읽는 방법</text><text x="1150.0" y="586.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">대각선 위 = 저장한 만큼 매 스텝 전부 읽음. 대각선보다 위 = 다시 쓰기까지</text><text x="1150.0" y="608.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">더해짐. 아래로 멀수록 저장한 것 중 일부만 읽음. 선이 거의 수평이면 문맥이</text><text x="1150.0" y="630.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">길어져도 읽는 양이 거의 안 늘어남</text><text x="40.0" y="1030.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#2b2f3a">→ Full MLA만 대각선(저장한 만큼 매 스텝 읽음) — sparse · hybrid는 저장한 것의 8 ~ 22%만 읽고, hybrid는 state를 다시 쓰는 만큼 위로 뜸</text><text x="40.0" y="1062.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">128K 읽는 비율: Full MLA 100% · CSA + HCA 22% · KDA + DSA 21% · DSA 18% · GDN + QSA 8% / 8K: KDA + DSA는 읽고 쓰는 양이 저장량보다 40% 많음</text></svg>