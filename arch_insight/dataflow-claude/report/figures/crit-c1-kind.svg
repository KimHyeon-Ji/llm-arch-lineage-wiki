<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 516" width="1760" height="516"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="56.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" text-anchor="start" font-weight="800" fill="#2b2f3a">기준 1. 데이터 종류 — 무엇에 비례해 커지나</text><text x="40.0" y="100.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#5b47b0">커지는 조건이 많을수록 HBM을 먼저 채움</text><text x="44.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">분류 · 어떤 데이터인가</text><text x="894.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">→ HW에서 문제가 되는 것</text><text x="1720.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="end" font-weight="600" fill="#6b7080">알약 = 기준 보고서 Ⅱ장 절</text><rect x="40.0" y="180.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="180.0" width="10.0" height="92.0" rx="4" fill="#9c9a92" stroke="none" stroke-width="1"/><text x="72.0" y="234.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">공유 가중치</text><text x="320.0" y="221.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">요청 · 문맥과 무관 — 모든 요청이 같이 씀</text><text x="320.0" y="247.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: 가중치</text><line x1="832.0" y1="226.0" x2="872.0" y2="226.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,219.0 L880.0,226.0 L870.0,233.0 Z" fill="#7b61c9"/><rect x="890.0" y="180.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="221.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">고정 크기 → 용량보다 읽기 대역폭</text><text x="918.0" y="249.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">요청이 적으면 매 스텝 이동의 대부분 · 요청이 많으면 한 번 읽어 여러 요청이 나눠 씀</text><rect x="40.0" y="284.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="284.0" width="10.0" height="92.0" rx="4" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="72.0" y="338.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">요청별 · 크기 고정</text><text x="320.0" y="325.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">요청 수에만 비례 — 문맥이 길어도 그대로</text><text x="320.0" y="351.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: linear attention state</text><line x1="832.0" y1="330.0" x2="872.0" y2="330.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,323.0 L880.0,330.0 L870.0,337.0 Z" fill="#7b61c9"/><rect x="890.0" y="284.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="325.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">동시 요청 수만큼 용량</text><text x="918.0" y="353.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">짧은 문맥 · 많은 요청에서 비중이 큼</text><rect x="40.0" y="388.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="388.0" width="10.0" height="92.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="72.0" y="442.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">요청별 · 문맥 비례</text><text x="320.0" y="429.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">요청 수 × 문맥 길이에 비례 — 토큰마다 쌓임</text><text x="320.0" y="455.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: KV cache</text><line x1="832.0" y1="434.0" x2="872.0" y2="434.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,427.0 L880.0,434.0 L870.0,441.0 Z" fill="#7b61c9"/><rect x="890.0" y="388.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="429.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">용량 — 가장 먼저 HBM을 채움</text><text x="918.0" y="457.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">요청 · 문맥이 함께 크면 가중치보다 커짐 → 큰 메모리 계층 · 압축</text><rect x="1588.0" y="421.0" width="110.0" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1643.0" y="439.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.1 계층형 KV</text></svg>