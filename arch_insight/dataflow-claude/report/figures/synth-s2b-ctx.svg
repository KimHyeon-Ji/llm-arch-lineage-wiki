="697.8" r="5" fill="#2b2f3a"/><circle cx="223.8" cy="633.6" r="5" fill="#2b2f3a"/><line x1="223.8" y1="625.6" x2="223.8" y2="570.9" stroke="#2b2f3a" stroke-width="1.2" stroke-dasharray="3 4"/><text x="211.8" y="560.9" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="800" fill="#2b2f3a">문맥 8K: KDA + DSA가 Full MLA의 3배</text><circle cx="383.4" cy="628.1" r="8" fill="#ffffff" stroke="#2b2f3a" stroke-width="3"/><line x1="389.4" y1="636.1" x2="413.4" y2="649.2" stroke="#2b2f3a" stroke-width="1.2" stroke-linecap="round"/><text x="403.4" y="665.2" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="800" fill="#2b2f3a">문맥 약 25K에서 같아짐</text><text x="780.2" y="479.6" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">점선 = KDA + DSA의 state</text><text x="780.2" y="501.6" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">문맥과 상관없이 매 스텝 전부 읽고 다시 씀</text><text x="780.2" y="523.6" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">8K에서는 읽고 쓰는 양의 92%, 128K에서도 66%</text><line x1="924.2" y1="535.6" x2="924.2" y2="635.8" stroke="#1baf7a" stroke-width="1.4" stroke-linecap="round"/><text x="40.0" y="848.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#2b2f3a">→ Full MLA는 문맥에 비례해 늘고, hybrid는 state가 바닥에 깔려 거의 수평 — 짧은 문맥에서는 hybrid가 더 많이 읽고 씀</text><text x="40.0" y="880.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">문맥 8K: KDA + DSA가 Full MLA의 3배 · 약 25K에서 같아짐 · 128K: Full MLA의 26% / DSA · CSA + HCA는 색인 키 읽기만큼만 천천히 늘어남</text></svg>