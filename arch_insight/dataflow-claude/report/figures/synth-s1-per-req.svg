ext-anchor="start" font-weight="400" fill="#2b2f3a">아래로 멀수록 '보관은 크고 이동은 작은' 용량형. 선이 오른쪽으로만 길면</text><text x="1200.0" y="614.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">문맥이 이동을 거의 안 늘림</text><text x="40.0" y="1090.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#2b2f3a">→ full은 보관 = 이동 (대각선) · sparse는 이동을 10 ~ 20%대로 · linear state는 문맥이 짧아도 이동이 남음</text><text x="40.0" y="1122.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">128K: V3.1 5.2 GB를 매 스텝 전부 읽음 · V3.2 보관 6.3 GB 중 1.1 GB · Q3.8 3.4 GB 중 0.27 GB · K3는 보관 4.1 GB보다 이동 4.5 GB가 큼</text></svg>