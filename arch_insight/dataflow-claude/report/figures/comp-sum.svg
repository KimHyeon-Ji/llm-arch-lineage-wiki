mily="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">행렬 × 벡터와 원소별 연산만 있으면 됨 · 이득은 왕복 제거</text><line x1="580.0" y1="763.0" x2="622.0" y2="763.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,756.0 L630.0,763.0 L620.0,770.0 Z" fill="#4a5573"/><line x1="1130.0" y1="763.0" x2="1172.0" y2="763.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,756.0 L1180.0,763.0 L1170.0,770.0 Z" fill="#4a5573"/><rect x="40.0" y="856.0" width="530.0" height="150.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="856.0" width="7.0" height="150.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1.5"/><rect x="64.0" y="879.0" width="15.0" height="15.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1"/><text x="87.0" y="892.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">가중치 행렬곱 (전 모델)</text><text x="64.0" y="922.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">모든 요청이 같이 쓰는 가중치 — 1바이트당 계산이 요청 수에 비례,</text><text x="64.0" y="944.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">MoE는 expert로 나뉘어 요청 256개에서도 6 ~ 26번</text><rect x="640.0" y="856.0" width="480.0" height="150.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="892.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">sparse · hybrid 이론 시간의 대부분</text><text x="664.0" y="918.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 32개 · 128K: MoE 시간 몫 85 ~ 88% (Full MLA 54%) —</text><text x="664.0" y="940.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청마다 하는 연산이 줄어 다시 가중치 읽기가 정함</text><rect x="1190.0" y="856.0" width="530.0" height="150.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="874.0" width="145.8" height="26.0" rx="13" fill="#c9ccd6" stroke="none" stroke-width="1.5"/><text x="1286.9" y="892.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">기준 보고서 범위 밖</text><text x="1214.0" y="928.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">가중치 읽기 속도 · 요청 수에 맞춘 배치</text><text x="1214.0" y="954.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">attention 쪽 HW 이득의 상한 = 요청마다 하는 연산의 시간 몫</text><line x1="580.0" y1="931.0" x2="622.0" y2="931.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,924.0 L630.0,931.0 L620.0,938.0 Z" fill="#4a5573"/><line x1="1130.0" y1="931.0" x2="1172.0" y2="931.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,924.0 L1180.0,931.0 L1170.0,938.0 Z" fill="#4a5573"/></svg>