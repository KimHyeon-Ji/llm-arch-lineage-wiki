<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1084" width="1760" height="1084"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">종합 — 연산 특성 → 인사이트 → HW</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">줄마다 연산 묶음 하나 · 숫자는 본문과 같은 계산 · 알약 = 기준 보고서 Ⅱ장 절</text><text x="40.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">연산 특성 (어느 모델 · 어떤 연산)</text><text x="640.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">인사이트 (비교에서 보이는 것)</text><text x="1190.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">HW로 연결</text><rect x="40.0" y="170.0" width="530.0" height="164.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="170.0" width="7.0" height="164.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="193.0" width="15.0" height="15.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="87.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">attention 본체 (Full MLA에서 큼)</text><text x="64.0" y="236.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">KV 1줄을 head 64 ~ 128개가 같이 씀 — 1바이트당 180 ~ 420번</text><text x="64.0" y="258.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">계산, 요청 수와 무관</text><rect x="640.0" y="170.0" width="480.0" height="164.0" rx="12" fill="#ffffff" stroke=