h="2.4" stroke-linecap="round"/><path d="M1170.0,245.0 L1180.0,252.0 L1170.0,259.0 Z" fill="#4a5573"/><rect x="40.0" y="352.0" width="530.0" height="150.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="352.0" width="7.0" height="150.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="64.0" y="375.0" width="15.0" height="15.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1"/><text x="87.0" y="388.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">색인 · 블록 점수 (sparse · hybrid 4개)</text><text x="64.0" y="418.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">문맥에 비례 — 토큰마다 지난 모든 키와 비교, 1바이트당 4 ~ 121번</text><text x="64.0" y="440.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">계산</text><rect x="640.0" y="352.0" width="480.0" height="150.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="388.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">sparse는 attention 계산을 색인으로 옮김</text><text x="664.0" y="414.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">DSA 128K 토큰당 계산량의 55%가 색인 · 색인 + attention이</text><text x="664.0" y="436.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">문맥 약 4만부터 가중치 행렬곱을 넘음</text><rect x="1190.0" y="352.0" width="530.0" height="150.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="370.0" width="154.7" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1291.3" y="388.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.2 메모리 근처 선택</text><text x="1214.0" y="424.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">메모리 근처 색인 계산 — 저정밀 행렬 연산기</text><text x="1214.0" y="450.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">필요한 계산 밀도가 모델마다 약 30배 차이 (GDN + QSA 4번 · DSA</text><text x="1214.0" y="472.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">121번)</text><line x1="580.0" y1="427.0" x2="622.0" y2="427.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,420.0 L630.0,427.0 L620.0,434.0 Z" fill="#4a5573"/><line x1="1130.0" y1="427.0" x2="1172.0" y2="427.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,420.0 L1180.0,427.0 L1170.0,434.0 Z" fill="#4a5573"/><rect x="40.0" y="520.0" width="530.0" height="150.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="520.0" width="7.0" height="150.0" rx="3" fill="#e87ba4" stroke="none" stroke-width="1.5"/><rect x="64.0" y="543.0" width="15.0" height="15.0" rx="3" fill="#e87ba4" stroke="none" stroke-width="1"/><text x="87.0" y="556.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">top-k · gather (sparse · hybrid 4개)</text><text x="64.0" y="586.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">계산량 0 — 후보 3.3 ~ 13만 개에서 512 ~ 2,048개 · 덩어리 584 B</text><text x="64.0" y="608.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">~ 8 KB</text><rect x="640.0" y="520.0" width="480.0" height="150.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="556.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">계산량 그림에는 없고 층마다 기다리는 단계를 더함</text><text x="664.0" y="582.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 256개 · 128K 스텝당 덩어리: DSA 약 3,200만 개(656 B)</text><text x="664.0" y="604.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">vs GDN + QSA 157만 개(8 KB 블록)</text><rect x="1190.0" y="520.0" width="530.0" height="150.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="538.0" width="166.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1297.3" y="556.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.3 색인 연산 · top-k</text><text x="1214.0" y="592.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">선택 전용 유닛 · 블록 단위 gather</text><text x="1214.0" y="618.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">덩어리가 클수록 HBM · 아래 계층 전송이 효율적 (GDN + QSA의 블록</text><text x="1214.0" y="640.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">방식)</text><line x1="580.0" y1="595.0" x2="622.0" y2="595.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,588.0 L630.0,595.0 L620.0,602.0 Z" fill="#4a5573"/><line x1="1130.0" y1="595.0" x2="1172.0" y2="595.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,588.0 L1180.0,595.0 L1170.0,602.0 Z" fill="#4a5573"/><rect x="40.0" y="688.0" width="530.0" height="150.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="688.0" width="7.0" height="150.0