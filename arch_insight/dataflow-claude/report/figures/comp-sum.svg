ont-size="14" text-anchor="start" font-weight="400" fill="#6b7080">필요한 연산 밀도가 모델마다 약 30배 차이 (Q3.8 4 · V3.2 121</text><text x="1214.0" y="458.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">FLOP/B)</text><line x1="580.0" y1="413.0" x2="622.0" y2="413.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,406.0 L630.0,413.0 L620.0,420.0 Z" fill="#4a5573"/><line x1="1130.0" y1="413.0" x2="1172.0" y2="413.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,406.0 L1180.0,413.0 L1170.0,420.0 Z" fill="#4a5573"/><rect x="40.0" y="506.0" width="530.0" height="150.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="506.0" width="7.0" height="150.0" rx="3" fill="#e87ba4" stroke="none" stroke-width="1.5"/><rect x="64.0" y="529.0" width="15.0" height="15.0" rx="3" fill="#e87ba4" stroke="none" stroke-width="1"/><text x="87.0" y="542.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">top-k · gather (V3.2 · V4 · K3.1 · Q3.8)</text><text x="64.0" y="572.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">FLOP 0 — 후보 3.3 ~ 13만 개에서 512 ~ 2,048개 · 덩어리 584 B ~</text><text x="64.0" y="594.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">8 KB</text><rect x="640.0" y="506.0" width="480.0" height="150.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="542.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">FLOP 그림에는 없고 층마다 직렬 단계를 더함</text><text x="664.0" y="568.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 256개 · 128K 스텝당 