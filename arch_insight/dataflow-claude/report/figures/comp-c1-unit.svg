<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 620" width="1760" height="620"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="56.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" text-anchor="start" font-weight="800" fill="#2b2f3a">기준 1. 연산기 — 무엇으로 계산하나</text><text x="40.0" y="100.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#5b47b0">계산량(FLOP)은 거의 전부 행렬곱 — 계산량이 작거나 없는 연산도 따로 유닛과 시간을 요구함</text><text x="44.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">분류 · 어떤 연산인가</text><text x="894.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">→ HW에서 필요한 것</text><text x="1720.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="end" font-weight="600" fill="#6b7080">알약 = 기준 보고서 Ⅱ장 절</text><rect x="40.0" y="180.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="180.0" width="10.0" height="92.0" rx="4" fill="#9c9a92" stroke="none" stroke-width="1"/><text x="72.0" y="234.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">행렬곱 (GEMM)</text><text x="320.0" y="221.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">행렬 × 행렬 — Tensor core</text><text x="320.0" y="247.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: 가중치 투영 · MoE · attention QK · PV · 색인 점수</text><line x1="832.0" y1="226.0" x2="872.0" y2="226.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,219.0 L880.0,226.0 L870.0,233.0 Z" fill="#7b61c9"/><rect x="890.0" y="180.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="221.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">Tensor core 피크 · 정밀도</text><text x="918.0" y="249.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">계산량의 98% 이상 · 어느 정밀도(FP8 · BF16) 유닛이 받느냐가 계산 시간을 정함</text><rect x="40.0" y="284.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="284.0" width="10.0" height="92.0" rx="4" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="72.0" y="338.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">행렬 × 벡터 · 원소별</text><text x="320.0" y="325.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">행렬 × 벡터(GEMV) · 감쇠 · 정규화 — CUDA core</text><text x="320.0" y="351.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: linear state 갱신 · softmax · 정규화</text><line x1="832.0" y1="330.0" x2="872.0" y2="330.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,323.0 L880.0,330.0 L870.0,337.0 Z" fill="#7b61c9"/><rect x="890.0" y="284.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="325.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">넓은 벡터 유닛 · 메모리 안 처리</text><text x="918.0" y="353.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">계산량은 1% 남짓 · FP32 state를 매 스텝 전부 읽고 다시 씀</text><rect x="1583.4" y="317.0" width="114.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1640.7" y="335.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.4 state PIM</text><rect x="40.0" y="388.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="388.0" width="10.0" height="92.0" rx="4" fill="#e87ba4" stroke="none" stroke-width="1"/><text x="72.0" y="442.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">비교 · 선택 (top-k)</text><text x="320.0" y="429.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">점수 비교 · 상위 k개 고르기</text><text x="320.0" y="455.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: 색인 점수 13만 개 → 2,048개</text><line x1="832.0" y1="434.0" x2="872.0" y2="434.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,427.0 L880.0,434.0 L870.0,441.0 Z" fill="#7b61c9"/><rect x="890.0" y="388.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="429.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">선택 전용 유닛</text><text x="918.0" y="457.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">계산량 0 — 계산량 그림에 안 보이지만 층마다 기다리는 단계 하나</text><rect x="1531.4" y="421.0" width="166.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1614.7" y="439.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.3 색인 연산 · top-k</text><rect x="40.0" y="492.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="492.0" width="10.0" height="92.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="72.0" y="546.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">흩어진 읽기 (gather)</text><text x="320.0" y="533.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">고른 줄만 골라 모아 읽기</text><text x="320.0" y="559.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: sparse attention의 KV 2,048줄</text><line x1="832.0" y1="538.0" x2="872.0" y2="538.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,531.0 L880.0,538.0 L870.0,545.0 Z" fill="#7b61c9"/><rect x="890.0" y="492.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="533.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">작은 덩어리 읽기 효율 · 주소 계산</text><text x="918.0" y="561.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">덩어리가 작고 많을수록 메모리 읽기 속도를 다 못 씀 — 블록 단위가 유리</text><rect x="1543.3" y="525.0" width="154.7" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1620.7" y="543.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.2 메모리 근처 선택</text></svg>