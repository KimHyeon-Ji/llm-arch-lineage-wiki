<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 798" width="1760" height="798"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">Qwen3.8-Flash-Next — 정리: 데이터 특성 → 인사이트 → HW</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">줄마다 데이터 하나의 성격이 무엇을 정하고, 어떤 HW 대응으로 이어지는지 · 숫자는 본문과 같은 계산 · 괄호 절 번호 = 기준 보고서 Ⅱ장</text><text x="40.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">데이터 특성 (종류 · 성격 · 커지는 조건)</text><text x="640.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">인사이트 (그래프에서 보이는 것)</text><text x="1190.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">HW로 연결</text><rect x="40.0" y="170.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="170.0" width="7.0" height="124.0" rx="3" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="193.0" width="15.0" height="15.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="87.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">QSA KV</text><text x="64.0" y="236.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">끝에 추가 · 골라 읽음 — 토큰당 24.6 KB, 요청당 2,048토큰만 읽음</text><rect x="640.0" y="170.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">보관의 대부분 · 이동은 작음 (용량형)</text><text x="664.0" y="232.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 256개 · 128K: 보관 73% · 이동 4%</text><rect x="1190.0" y="170.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="188.0" width="110.0" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1269.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.1 계층형 KV</text><text x="1214.0" y="242.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">전체 KV는 큰 메모리, 고를 블록만 HBM</text><text x="1214.0" y="268.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">블록(4줄 연속) 단위라 전송이 덜 흩어짐</text><line x1="580.0" y1="232.0" x2="622.0" y2="232.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,225.0 L630.0,232.0 L620.0,239.0 Z" fill="#4a5573"/><line x1="1130.0" y1="232.0" x2="1172.0" y2="232.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,225.0 L1180.0,232.0 L1170.0,239.0 Z" fill="#4a5573"/><rect x="40.0" y="312.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="312.0" width="7.0" height="124.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="64.0" y="335.0" width="15.0" height="15.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1"/><text x="87.0" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">블록 키</text><text x="64.0" y="378.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">끝에 추가 · 전부 읽음 — 토큰당 768 B</text><rect x="640.0" y="312.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">긴 문맥에서 QSA 층 이동의 대부분 (대역폭형)</text><text x="664.0" y="374.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 32개 · 128K: 층 이동 52% · 키 1 B당 약 4 FLOP</text><rect x="1190.0" y="312.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="330.0" width="154.7" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1291.3" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.2 메모리 근처 선택</text><text x="1214.0" y="384.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">블록 선택을 메모리 근처에서</text><text x="1214.0" y="410.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">메모리 쪽 연산 요구가 작은 편</text><line x1="580.0" y1="374.0" x2="622.0" y2="374.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,367.0 L630.0,374.0 L620.0,381.0 Z" fill="#4a5573"/><line x1="1130.0" y1="374.0" x2="1172.0" y2="374.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,367.0 L1180.0,374.0 L1170.0,381.0 Z" fill="#4a5573"/><rect x="40.0" y="454.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="454.0" width="7.0" height="124.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1.5"/><rect x="64.0" y="477.0" width="15.0" height="15.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="87.0" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">GDN state</text><text x="64.0" y="520.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">매 스텝 전부 다시 씀 — 요청당 113 MB(36층)</text><rect x="640.0" y="454.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">요청이 늘면 MoE 다음으로 큰 이동</text><text x="664.0" y="516.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청 256개: 모델 이동 17 ~ 18%</text><rect x="1190.0" y="454.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="472.0" width="114.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1271.3" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.4 state PIM</text><text x="1214.0" y="526.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">메모리 안 갱신</text><text x="1214.0" y="552.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">이득은 갱신 연산을 메모리 쪽이 감당하는지에 달림</text><line x1="580.0" y1="516.0" x2="622.0" y2="516.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,509.0 L630.0,516.0 L620.0,523.0 Z" fill="#4a5573"/><line x1="1130.0" y1="516.0" x2="1172.0" y2="516.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M1170.0,509.0 L1180.0,516.0 L1170.0,523.0 Z" fill="#4a5573"/><rect x="40.0" y="596.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="596.0" width="7.0" height="124.0" rx="3" fill="#4a5573" stroke="none" stroke-width="1.5"/><rect x="64.0" y="619.0" width="15" height="15" rx="3" fill="none" stroke="#6b7080" stroke-width="1.5" stroke-dasharray="3 2"/><text x="87.0" y="632.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">세 성격이 한 모델에</text><text x="64.0" y="662.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">골라 읽음(KV) · 전부 읽음(블록 키) · 다시 씀(state)</text><rect x="640.0" y="596.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="632.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">대응 후보가 셋</text><text x="664.0" y="658.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">한 장치로 묶을지 층 종류별로 나눌지는 비용 비교가 필요</text><rect x="1190.0" y="596.0" width="530.0" height="124.0" rx="12" fill="#f3f1fc" stroke="#d9d2f5" stroke-width="1.2"/><rect x="1214.0" y="614.0" width="191.1" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1309.5" y="632.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.5 이종 가속기 · PD 분리</text><text x="1214.0" y="668.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">층 종류별 이종 구성 검토</text><text x="1214.0" y="694.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">MoE는 BF16 — 저정밀 여지도 큼</text><line x1="580.0" y1="658.0" x2="622.0" y2="658.0" stroke="#4a5573" stroke-width="2.4" stroke-linecap="round"/><path d="M620.0,651.0 L630.0,658.0 L620.0,6