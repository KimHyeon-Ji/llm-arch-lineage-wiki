<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1058" width="1760" height="1058"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="56.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" text-anchor="start" font-weight="800" fill="#2b2f3a">기준 3. 읽고 쓰는 방식 — 어떻게 읽고 쓰나</text><text x="40.0" y="100.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#5b47b0">읽는 방식이 '저장 공간'과 '읽기 속도' 중 무엇이 중요한지를, 쓰는 방식이 쓰기 부담을 정함</text><text x="44.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">분류 · 어떤 데이터인가</text><text x="894.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">→ 필요한 메모리 특성</text><text x="1720.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="end" font-weight="600" fill="#6b7080">알약 = 기준 보고서 Ⅱ장 절</text><text x="44.0" y="207.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#4a5573">읽는 방식 — 저장 공간이 중요한가, 읽기 속도가 중요한가</text><line x1="532.7" y1="201.0" x2="1720.0" y2="201.0" stroke="#dfe2ec" stroke-width="1.2" stroke-linecap="round"/><rect x="40.0" y="232.0" width="780.0" height="114.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="232.0" width="10.0" height="114.0" rx="4" fill="#4a5573" stroke="none" stroke-width="1"/><text x="72.0" y="297.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">전부 읽음</text><text x="320.0" y="284.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">매 스텝 들고 있는 만큼 다 읽음</text><text x="320.0" y="310.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: dense 가중치 · full attention KV · 색인 K</text><line x1="832.0" y1="289.0" x2="872.0" y2="289.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,282.0 L880.0,289.0 L870.0,296.0 Z" fill="#7b61c9"/><rect x="890.0" y="232.0" width="830.0" height="114.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="273.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">읽기 속도(대역폭)가 중요</text><text x="918.0" y="301.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">크기 = 매 스텝 읽는 양 · 메모리 근처에서 처리해 결과만 보내면 읽는 양이</text><text x="918.0" y="323.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">줄어듦</text><rect x="1543.3" y="276.0" width="154.7" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1620.7" y="294.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.2 메모리 근처 선택</text><rect x="40.0" y="358.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="358.0" width="10.0" height="92.0" rx="4" fill="#c9ccd6" stroke="#dfe2ec" stroke-width="1"/><text x="72.0" y="412.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">골라 읽음</text><text x="320.0" y="399.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">들고 있는 것 중 일부만 읽음</text><text x="320.0" y="425.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: sparse attention KV · MoE expert</text><line x1="832.0" y1="404.0" x2="872.0" y2="404.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,397.0 L880.0,404.0 L870.0,411.0 Z" fill="#7b61c9"/><rect x="890.0" y="358.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="399.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">저장 공간(용량)이 중요 — 큰 메모리 + 고른 것만 HBM</text><text x="918.0" y="427.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">대부분 쉬고 있음 → 크고 느린 메모리에 두고 고른 것만 빠르게 가져옴</text><rect x="1588.0" y="391.0" width="110.0" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1643.0" y="409.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.1 계층형 KV</text><text x="44.0" y="489.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#4a5573">쓰는 방식 — 쓰기 부담과 압축 자유도</text><line x1="368.1" y1="483.0" x2="1720.0" y2="483.0" stroke="#dfe2ec" stroke-width="1.2" stroke-linecap="round"/><rect x="40.0" y="514.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="514.0" width="10.0" height="92.0" rx="4" fill="#9c9a92" stroke="none" stroke-width="1"/><text x="72.0" y="568.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">읽기만</text><text x="320.0" y="555.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">한 번 올리면 안 바뀜</text><text x="320.0" y="581.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: 가중치</text><line x1="832.0" y1="560.0" x2="872.0" y2="560.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,553.0 L880.0,560.0 L870.0,567.0 Z" fill="#7b61c9"/><rect x="890.0" y="514.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="555.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">압축 · 저정밀 · 복제가 자유로움</text><text x="918.0" y="583.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">쓰기가 없어 미리 변환해 두고 여러 장치에 나눠 둬도 됨</text><rect x="40.0" y="618.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="618.0" width="10.0" height="92.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="72.0" y="672.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">토큰마다 추가</text><text x="320.0" y="659.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">토큰마다 한 줄 추가 · 지난 줄은 그대로</text><text x="320.0" y="685.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: KV cache</text><line x1="832.0" y1="664.0" x2="872.0" y2="664.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,657.0 L880.0,664.0 L870.0,671.0 Z" fill="#7b61c9"/><rect x="890.0" y="618.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="659.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">쓰기는 작고 저장량이 쌓임 → 저장 공간</text><text x="918.0" y="687.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">스텝당 쓰기는 한 줄 · 문맥만큼 저장량이 늘어남</text><rect x="40.0" y="722.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="722.0" width="10.0" height="92.0" rx="4" fill="#6250d6" stroke="none" stroke-width="1"/><text x="72.0" y="776.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">고정 크기 · 덮어씀</text><text x="320.0" y="763.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">최근 N개만 남기고 덮어씀</text><text x="320.0" y="789.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: sliding window KV</text><line x1="832.0" y1="768.0" x2="872.0" y2="768.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,761.0 L880.0,768.0 L870.0,775.0 Z" fill="#7b61c9"/><rect x="890.0" y="722.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="763.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">작은 고정 버퍼</text><text x="918.0" y="791.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">문맥이 길어도 안 커짐 → 별도 대응 불필요</text><rect x="40.0" y="826.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="826.0" width="10.0" height="92.0" rx="4" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="72.0" y="880.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">매 스텝 전부 다시 씀</text><text x="320.0" y="867.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">읽은 만큼 다시 씀</text><text x="320.0" y="893.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: linear attention state</text><line x1="832.0" y1="872.0" x2="872.0" y2="872.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,865.0 L880.0,872.0 L870.0,879.0 Z" fill="#7b61c9"/><rect x="890.0" y="826.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="867.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">쓰기 속도 — 메모리 안에서 갱신</text><text x="918.0" y="895.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">읽기 = 쓰기 → 메모리 안에서 갱신하면 칩까지 왕복이 사라짐</text><rect x="1583.4" y="859.0" width="114.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1640.7" y="877.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2.4 state PIM</text><rect x="40.0" y="930.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="930.0" width="10.0" height="92.0" rx="4" fill="#eda100" stroke="none" stroke-width="1"/><text x="72.0" y="984.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">임시</text><text x="320.0" y="971.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">다음 커널이 읽고 버림</text><text x="320.0" y="997.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: q · 점수</text><line x1="832.0" y1="976.0" x2="872.0" y2="976.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,969.0 L880.0,976.0 L870.0,983.0 Z" fill="#7b61c9"/><rect x="890.0" y="930.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="971.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">칩 안에서 끝내기</text><text x="918.0" y="999.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">수명 '스텝 안'과 같은 데이터 · 커널 합치기 · L2 상주</text></svg>