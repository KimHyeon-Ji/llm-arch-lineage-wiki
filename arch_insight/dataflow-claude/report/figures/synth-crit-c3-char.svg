<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1036" width="1760" height="1036"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="56.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" text-anchor="start" font-weight="800" fill="#2b2f3a">기준 3. 읽고 쓰는 방식 — 어떻게 읽고 쓰나</text><text x="40.0" y="100.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#5b47b0">읽는 방식이 '저장 공간'과 '읽기 속도' 중 무엇이 중요한지를, 쓰는 방식이 쓰기 부담을 정함</text><text x="44.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">분류 · 어떤 데이터인가</text><text x="894.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">→ 필요한 메모리 특성</text><text x="1720.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="end" font-weight="600" fill="#6b7080">알약 = 이어지는 HW 대응</text><text x="44.0" y="207.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#4a5573">읽는 방식 — 저장 공간이 중요한가, 읽기 속도가 중요한가</text><line x1="532.7" y1="201.0" x2="1720.0" y2="201.0" stroke="#dfe2ec" stroke-width="1.2" stroke-linecap="round"/><rect x="40.0" y="232.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="232.0" width="10.0" height="92.0" rx="4" fill="#4a5573" stroke="none" stroke-width="1"/><text x="72.0" y="286.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">전부 읽음</text><text x="320.0" y="273.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">매 스텝 들고 있는 만큼 다 읽음</text><text x="320.0" y="299.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: dense 가중치 · full attention KV · 색인 K</text><line x1="832.0" y1="278.0" x2="872.0" y2="278.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,271.0 L880.0,278.0 L870.0,285.0 Z" fill="#7b61c9"/><rect x="890.0" y="232.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="273.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">읽기 속도(대역폭)가 중요</text><text x="918.0" y="301.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">크기 = 매 스텝 읽는 양 · 메모리 근처에서 처리해 결과만 보내면 읽는 양이 줄어듦</text><rect x="1572.4" y="265.0" width="125.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1635.2" y="283.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">메모리 근처 선택</text><rect x="40.0" y="336.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="336.0" width="10.0" height="92.0" rx="4" fill="#c9ccd6" stroke="#dfe2ec" stroke-width="1"/><text x="72.0" y="390.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">골라 읽음</text><text x="320.0" y="377.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">들고 있는 것 중 일부만 읽음</text><text x="320.0" y="403.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: sparse attention KV · MoE expert</text><line x1="832.0" y1="382.0" x2="872.0" y2="382.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,375.0 L880.0,382.0 L870.0,389.0 Z" fill="#7b61c9"/><rect x="890.0" y="336.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="377.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">저장 공간(용량)이 중요 — 큰 메모리 + 고른 것만 HBM</text><text x="918.0" y="405.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">대부분 쉬고 있음 → 크고 느린 메모리에 두고 고른 것만 빠르게 가져옴</text><rect x="1617.2" y="369.0" width="80.8" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1657.6" y="387.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">계층형 KV</text><text x="44.0" y="467.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#4a5573">쓰는 방식 — 쓰기 부담과 압축 자유도</text><line x1="368.1" y1="461.0" x2="1720.0" y2="461.0" stroke="#dfe2ec" stroke-width="1.2" stroke-linecap="round"/><rect x="40.0" y="492.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="492.0" width="10.0" height="92.0" rx="4" fill="#9c9a92" stroke="none" stroke-width="1"/><text x="72.0" y="546.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">읽기만</text><text x="320.0" y="533.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">한 번 올리면 안 바뀜</text><text x="320.0" y="559.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: 가중치</text><line x1="832.0" y1="538.0" x2="872.0" y2="538.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,531.0 L880.0,538.0 L870.0,545.0 Z" fill="#7b61c9"/><rect x="890.0" y="492.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="533.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">압축 · 저정밀 · 복제가 자유로움</text><text x="918.0" y="561.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">쓰기가 없어 미리 변환해 두고 여러 장치에 나눠 둬도 됨</text><rect x="40.0" y="596.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="596.0" width="10.0" height="92.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="72.0" y="650.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">토큰마다 추가</text><text x="320.0" y="637.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">토큰마다 한 줄 추가 · 지난 줄은 그대로</text><text x="320.0" y="663.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: KV cache</text><line x1="832.0" y1="642.0" x2="872.0" y2="642.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,635.0 L880.0,642.0 L870.0,649.0 Z" fill="#7b61c9"/><rect x="890.0" y="596.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="637.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">쓰기는 작고 저장량이 쌓임 → 저장 공간</text><text x="918.0" y="665.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">스텝당 쓰기는 한 줄 · 문맥만큼 저장량이 늘어남</text><rect x="40.0" y="700.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="700.0" width="10.0" height="92.0" rx="4" fill="#6250d6" stroke="none" stroke-width="1"/><text x="72.0" y="754.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">고정 크기 · 덮어씀</text><text x="320.0" y="741.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">최근 N개만 남기고 덮어씀</text><text x="320.0" y="767.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: sliding window KV</text><line x1="832.0" y1="746.0" x2="872.0" y2="746.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,739.0 L880.0,746.0 L870.0,753.0 Z" fill="#7b61c9"/><rect x="890.0" y="700.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="741.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">작은 고정 버퍼</text><text x="918.0" y="769.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">문맥이 길어도 안 커짐 → 별도 대응 불필요</text><rect x="40.0" y="804.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="804.0" width="10.0" height="92.0" rx="4" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="72.0" y="858.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">매 스텝 전부 다시 씀</text><text x="320.0" y="845.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">읽은 만큼 다시 씀</text><text x="320.0" y="871.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: linear attention state</text><line x1="832.0" y1="850.0" x2="872.0" y2="850.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,843.0 L880.0,850.0 L870.0,857.0 Z" fill="#7b61c9"/><rect x="890.0" y="804.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="845.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">쓰기 속도 — 메모리 안에서 갱신</text><text x="918.0" y="873.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">읽기 = 쓰기 → 메모리 안에서 갱신하면 칩까지 왕복이 사라짐</text><rect x="1612.5" y="837.0" width="85.5" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1655.2" y="855.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">state PIM</text><rect x="40.0" y="908.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="908.0" width="10.0" height="92.0" rx="4" fill="#eda100" stroke="none" stroke-width="1"/><text x="72.0" y="962.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">임시</text><text x="320.0" y="949.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">다음 커널이 읽고 버림</text><text x="320.0" y="975.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: q · 점수</text><line x1="832.0" y1="954.0" x2="872.0" y2="954.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,947.0 L880.0,954.0 L870.0,961.0 Z" fill="#7b61c9"/><rect x="890.0" y="908.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="949.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">칩 안에서 끝내기</text><text x="918.0" y="977.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">수명 '스텝 안'과 같은 데이터 · 커널 합치기 · L2 상주</text></svg>