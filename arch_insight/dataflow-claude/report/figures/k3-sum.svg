<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 798" width="1760" height="798"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">Kimi K3.1 Pro — 정리: 데이터 특성 → 인사이트 → HW</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">줄마다 데이터 하나의 성격이 무엇을 정하고, 어떤 HW 대응으로 이어지는지 · 숫자는 본문과 같은 계산 · 괄호 절 번호 = 기준 보고서 Ⅱ장</text><text x="40.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">데이터 특성 (종류 · 성격 · 커지는 조건)</text><text x="640.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">인사이트 (그래프에서 보이는 것)</text><text x="1190.0" y="148.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">HW로 연결</text><rect x="40.0" y="170.0" width="530.0" height="124.0" rx="12" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="170.0" width="7.0" height="124.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1.5"/><rect x="64.0" y="193.0" width="15.0" height="15.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="87.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="600" fill="#2b2f3a">KDA state</text><text x="64.0" y="236.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">매 스텝 전부 다시 씀 — 요청당 434 MB(69층), 문맥과 무관</text><rect x="640.0" y="170.0" width="480.0" height="124.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><text x="664.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="sta