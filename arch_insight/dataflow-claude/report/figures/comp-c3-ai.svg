<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 620" width="1760" height="620"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="56.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" text-anchor="start" font-weight="800" fill="#2b2f3a">기준 3. 1바이트당 계산 횟수 — HBM에서 1바이트 읽을 때 몇 번 계산하나</text><text x="40.0" y="100.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#5b47b0">H200 균형점(1바이트당 BF16 약 206번 · FP8 약 412번)보다 많이 계산하면 계산이, 적으면 메모리 읽기가 병목</text><text x="44.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">분류 · 어떤 연산인가</text><text x="894.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">→ 필요한 HW 특성</text><text x="1720.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="end" font-weight="600" fill="#6b7080">알약 = 이어지는 HW 대응</text><rect x="40.0" y="180.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="180.0" width="10.0" height="92.0" rx="4" fill="#9c9a92" stroke="none" stroke-width="1"/><text x="72.0" y="234.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">요청 수에 따라 커짐</text><text x="320.0" y="221.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">모든 요청이 같은 가중치를 나눠 씀</text><text x="320.0" y="247.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: 투영 · LM head (MoE는 expert로 나뉘어 천천히 커짐)</text><line x1="832.0" y1="226.0" x2="872.0" y2="226.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,219.0 L880.0,226.0 L870.0,233.0 Z" fill="#7b61c9"/><rect x="890.0" y="180.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="221.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">요청이 적으면 메모리 읽기가 병목 → 가중치 읽기 속도 · 배치</text><text x="918.0" y="249.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">1바이트당 계산 ≈ 요청 수(BF16) · 요청 수 × 2(FP8)</text><rect x="40.0" y="284.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="284.0" width="10.0" height="92.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="72.0" y="338.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">구조로 고정 · 수백 번</text><text x="320.0" y="325.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">KV 1줄을 head 수십 ~ 128개가 함께 씀</text><text x="320.0" y="351.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: MLA · DSA · CSA attention 본체</text><line x1="832.0" y1="330.0" x2="872.0" y2="330.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,323.0 L880.0,330.0 L870.0,337.0 Z" fill="#7b61c9"/><rect x="890.0" y="284.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="325.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">계산이 병목 — Tensor core가 시간을 정함</text><text x="918.0" y="353.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">요청을 모아도 횟수가 그대로 (요청마다 자기 KV)</text><rect x="1536.0" y="317.0" width="162.0" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1617.0" y="335.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">이종 가속기 · PD 분리</text><rect x="40.0" y="388.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="388.0" width="10.0" height="92.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1"/><text x="72.0" y="442.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">구조로 고정 · 수 ~ 수십 번</text><text x="320.0" y="429.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">키 1줄을 색인 head 몇 개가 씀</text><text x="320.0" y="455.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: 색인 · 블록 점수 · GQA attention</text><line x1="832.0" y1="434.0" x2="872.0" y2="434.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,427.0 L880.0,434.0 L870.0,441.0 Z" fill="#7b61c9"/><rect x="890.0" y="388.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="429.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">메모리 읽기가 병목 — 메모리 근처에 둘 연산기 크기</text><text x="918.0" y="457.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">head 수 · 키 형식이 횟수를 정함</text><rect x="1572.4" y="421.0" width="125.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1635.2" y="439.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">메모리 근처 선택</text><rect x="40.0" y="492.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="492.0" width="10.0" height="92.0" rx="4" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="72.0" y="546.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">1번 이하</text><text x="320.0" y="533.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">값 하나를 한두 번 계산하고 다시 씀</text><text x="320.0" y="559.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: linear state 갱신</text><line x1="832.0" y1="538.0" x2="872.0" y2="538.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,531.0 L880.0,538.0 L870.0,545.0 Z" fill="#7b61c9"/><rect x="890.0" y="492.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="533.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">거의 읽기 · 쓰기뿐 — 메모리 안에서 갱신</text><text x="918.0" y="561.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">연산기는 작아도 됨 · 읽은 만큼 다시 씀</text><rect x="1612.5" y="525.0" width="85.5" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1655.2" y="543.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">state PIM</text></svg>