<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 516" width="1760" height="516"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="56.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" text-anchor="start" font-weight="800" fill="#2b2f3a">기준 2. 커지는 축 — 토큰 1개의 FLOP이 무엇에 비례하나</text><text x="40.0" y="100.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#5b47b0">문맥에 비례하는 연산이 긴 문맥의 FLOP을 정함 — 요청 수는 모든 연산을 똑같이 늘림</text><text x="44.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">분류 · 어떤 연산인가</text><text x="894.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="800" fill="#6b7080">→ HW에서 문제가 되는 것</text><text x="1720.0" y="156.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="end" font-weight="600" fill="#6b7080">알약 = 기준 보고서 Ⅱ장 절</text><rect x="40.0" y="180.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="180.0" width="10.0" height="92.0" rx="4" fill="#9c9a92" stroke="none" stroke-width="1"/><text x="72.0" y="234.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">고정 — 가중치 연산</text><text x="320.0" y="221.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">문맥과 무관 · 토큰마다 같은 FLOP</text><text x="320.0" y="247.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: 투영 · MoE · LM head</text><line x1="832.0" y1="226.0" x2="872.0" y2="226.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,219.0 L880.0,226.0 L870.0,233.0 Z" fill="#7b61c9"/><rect x="890.0" y="180.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="221.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">활성 파라미터 수가 정함</text><text x="918.0" y="249.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">모델 크기 · 고르는 expert 수가 그대로 FLOP</text><rect x="40.0" y="284.0" width="780.0" height="92.0" rx="12" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="284.0" width="10.0" height="92.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="72.0" y="338.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" text-anchor="start" font-weight="800" fill="#2b2f3a">문맥 비례</text><text x="320.0" y="325.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="600" fill="#2b2f3a">토큰마다 지난 문맥 전체와 계산</text><text x="320.0" y="351.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">예: full attention 본체 · 색인 · 블록 점수</text><line x1="832.0" y1="330.0" x2="872.0" y2="330.0" stroke="#7b61c9" stroke-width="2.4" stroke-linecap="round"/><path d="M870.0,323.0 L880.0,330.0 L870.0,337.0 Z" fill="#7b61c9"/><rect x="890.0" y="284.0" width="830.0" height="92.0" rx="12" fill="#f3f1fc" stroke="#ddd5f5" stroke-width="1.2"/><text x="918.0" y="325.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="800" fill="#2b2f3a">긴 문맥 FLOP의 대부분 → 색인 연산기 규모</text><text x="918.0" y="353.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">압축 · 블록 키 · 색인 head 수는 기울기만 줄임</text><rect x="1531.4" y="317.0" width="166.6" height="26.0" rx="13" fill="#7b61c9" stroke="none" stroke-width="1.5"/><text x="1614.7" y="335.0" font-family="'Noto Sa