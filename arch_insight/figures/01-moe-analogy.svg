   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #64748b" x="244.59264" y="411.051225" transform="rotate(-0 244.59264 411.051225)">전문가 가중치: 모델이 함께 보유</text>
