  <g id="text_9">
   <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #23314a" x="46.08" y="50.747438" transform="rotate(-0 46.08 50.747438)">MoE가 전문가를 고르듯, Sparse는 읽을 과거를 고른다</text>
  </g>
  <g id="text_10">
   <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #64748b" x="46.08" y="79.805719" transform="rotate(-0 46.08 79.805719)">동작 개념도  |  칸 수·선택 비율은 설명용이며 실제 모델의 수치가 아님</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10.1px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #64748b" x="46.08" y="492.013227" transform="rotate(-0 46.08 492.013227)">공통점: 선택해도 보관할 데이터는 남는다.  차이: 가중치는 요청 간 공유, KV는 기본적으로 요청마다 별도.</text>
