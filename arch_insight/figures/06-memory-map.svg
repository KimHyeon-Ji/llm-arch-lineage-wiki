  <g id="text_21">
   <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #23314a" x="46.08" y="51.160719" transform="rotate(-0 46.08 51.160719)">크게 보관할 KV와 자주 고칠 state를 구분해 설계한다</text>
