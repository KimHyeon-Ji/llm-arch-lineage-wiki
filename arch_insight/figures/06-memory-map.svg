  <g id="text_22">
   <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #64748b" x="46.08" y="79.895562" transform="rotate(-0 46.08 79.895562)">128K · B=1 · 대표 층의 데이터 묶음별 · KV·색인 BF16 / GDN state FP32 · 양 축 로그 눈금</text>
