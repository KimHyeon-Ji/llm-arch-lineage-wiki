  <g id="text_23">
   <text style="font-size: 10.1px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #64748b" x="46.08" y="492.013227" transform="rotate(-0 46.08 492.013227)">X축은 고유 논리 읽기량÷보유량이며 BW 사용률이 아님.  가중치는 요청 간 공유하는 읽기 전용 데이터로 별도 취급.</text>
  </g>
  <g id="text_24">
