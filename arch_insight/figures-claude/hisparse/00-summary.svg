othic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">15개 요청의 전체 KV 177 GB (2 TB의 9%)</text><text x="1035.3" y="488.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">KV만 host가 원본 보관 — 색인 키는 HBM에 유지</text><line x1="964.0" y1="420.0" x2="964.0" y2="316.0" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/><polygon points="964.0,316.0 969.2,326.8 958.8,326.8" fill="#eb6834"/><line x1="980.0" y1="316.0" x2="980.0" y2="420.0" stroke="#4a5573" stroke-width="2" stroke-linecap="round"/><polygon points="980.0,420.0 974.8,409.2 985.2,409.2" fill="#4a5573"/><text x="998.0" y="358.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#eb6834">↑ miss만 host → HBM (선택의 약 13%)</text><text x="998.0" y="384.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">↓ 새 KV는 host로 write-through</text><rect x="40.0" y="572.0" width="390.0" height="196.0" rx="10" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><rect x="40.0" y="572.0" width="8.0" height="196.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="68.0" y="612.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">요청당 HBM (128K)</text><text x="68.0" y="668.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="36" text-anchor="start" font-weight="700" fill="#2b2f3a">13.09 → 1.68 GB</text><text x="68.0" y="710.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">KV만 보면 0.4 GB (약 1/30, 논문 수치)</text><text x="68.0" y="738.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">남는 사용량의 대부분은 색인 키</text><rect x="450.0" y="572.0" width="390