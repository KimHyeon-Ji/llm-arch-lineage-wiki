e="none" stroke-width="1.5"/><text x="1298.0" y="612.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">대가 — 토큰당 지연</text><text x="1298.0" y="668.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="36" text-anchor="start" font-weight="700" fill="#2b2f3a">+3.0 ms</text><text x="1298.0" y="710.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">miss 전송이 TPOT에 노출 (동시 8)</text><text x="1298.0" y="738.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">층간 prefetch 없으면 +7.7 ms</text></svg>