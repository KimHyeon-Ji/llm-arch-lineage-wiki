<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" width="1700" height="800"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">HiSparse — 전체 KV는 host DRAM에, HBM에는 요청 · 층별 GPU 캐시와 색인 키만</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">GLM-5.1 · 128K 요청 15개를 담을 때 · KV BF16 · 막대 폭 = 사용량 비율 (계산값) · 아래 수치는 논문 측정값 (1.68 GB만 계산값)</text><rect x="190.0" y="103.0" width="18.0" height="18.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1.5"/><text x="216.0" y="118.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">KV cache</text><rect x="314.0" y="103.0" width="18.0" height="18.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="340.0" y="118.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">GPU 캐시 (HiSparse)</text><rect x="525.8" y="103.0" width="18.0" height="18.0" rx="3" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="551.8" y="118.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">색인 키</text><rect x="637.0" y="103.0" width="18.0" height="18.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="663.0" y="118.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">miss 전송</text><text x="40.0" y="246.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#2b2f3a">GPU HBM</text><text x="40.0" y="272.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">KV 영역</text><text x="40.0" y="464.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#2b2f3a">Host DRAM</text><text x="40.0" y="490.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">약 2 TB</text><rect x="190.0" y="134.0" width="200.0" height="40.0" rx="6" fill="#dddcd6" stroke="none" stroke-width="1.5"/><rect x="190.0" y="134.0" width="8.0" height="40.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1.5"/><text x="210.0" y="160.8" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#2b2f3a">기준 (SGLang)</text><text x="404.0" y="160.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#6b7080">전체 KV를 HBM에 상주</text><rect x="190.0" y="190.0" width="710.0" height="120.0" rx="6" fill="#ffffff" stroke="#9aa0b0" stroke-width="1.2"/><rect x="190.0" y="424.0" width="710.0" height="84.0" rx="6" fill="#ffffff" stroke="#9aa0b0" stroke-width="1.2"/><rect x="950.0" y="134.0" width="200.0" height="40.0" rx="6" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><rect x="950.0" y="134.0" width="8.0" height="40.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="970.0" y="160.8" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#2b2f3a">HiSparse</text><text x="1164.0" y="160.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#6b7080">전체 KV는 host, HBM에는 GPU 캐시 + 색인 키</text><rect x="950.0" y="190.0" width="710.0" height="120.0" rx="6" fill="#ffffff" stroke="#9aa0b0" stroke-width="1.2"/><rect x="950.0" y="424.0" width="710.0" height="84.0" rx="6" fill="#ffffff" stroke="#9aa0b0" stroke-width="1.2"/><rect x="198.0" y="198.0" width="43.5" height="9.4" rx="2" fill="#b7d3