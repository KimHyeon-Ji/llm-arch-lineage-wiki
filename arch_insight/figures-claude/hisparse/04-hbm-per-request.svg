<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">요청당 HBM 사용량 — 기준 = 100%, 컨텍스트 길이별</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">GLM-5.1 (78층) · 층 · 토큰당 KV BF16 1,152 B + 색인 키 FP8 128 B · GPU 캐시 B = 4,096줄 · 계산값 (128K 기준 13.09 GB = 논문 수치)</text><rect x="40.0" y="109.0" width="18.0" height="18.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1.5"/><text x="66.0" y="124.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">KV cache (기준 · HBM 상주)</text><rect x="306.5" y="109.0" width="18.0" height="18.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="332.5" y="124.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">GPU 캐시 (HiSparse)</text><rect x="518.2" y="109.0" width="18.0" height="18.0" rx="3" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="544.2" y="124.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">색인 키 (양쪽 모두 HBM 유지)</text><text x="1300.0" y="168.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#6b7080">KV만</text><text x="1450.0" y="168.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#6b7080">색인 키 포함</text><text x="1375.0" y="146.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#6b7080">HiSparse 감소 배율</text><text x="40.0" y="234.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#2b2f3a">32K + 8K</text><text x="40.0" y="258.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">40K</text><text x="284.0" y="214.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="end" font-weight="400" fill="#6b7080">기준</text><rect x="300.0" y="192.0" width="630.0" height="32.0" rx="2" fill="#9c9a92" stroke="none" stroke-width="1.5"/><rect x="931.0" y="192.0" width="70.0" height="32.0" rx="2" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="1012.0" y="214.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#2b2f3a">4.09 GB</text><text x="284.0" y="256.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="end" font-weight="700" fill="#2b2f3a">HiSparse</text><rect x="300.0" y="234.0" width="63.0" height="32.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="364.0" y="234.0" width="70.0" height="32.0" rx="2" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="445.0" y="256.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">0.78 GB  (19%)</text><text x="1300.0" y="256.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#2b2f3a">1/10</text><text x="1450.0" y="256.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#2a78d6">1/5</text><text x="40.0" y="354.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#2b2f3a">128K</text><text x="284.0" y="334.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="end" font-weight="400" fill="#6b7080">기준</text><rect x="300.0" y="312.0" width="630.0" height="32.0" rx="2" fill="#9c9a92" stroke="none" stroke-width="1.5"/><rect x="931.0" y="312.0" width="70.0" height="32.0" rx="2" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="1012.0" y="334.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#2b2f3a">13.09 GB</text><text x="284.0" y="376.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="end" font-weight="700" fill="#2b2f3a">HiSparse</text><rect x="300.0" y="354.0" width="19.7" height="32.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="320.7" y="354.0" width="70.0" height="32.0" rx="2" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="401.7" y="376.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">1.68 GB  (13%)</text><text x="1300.0" y="376.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#2b2f3a">1/32</text><text x="1450.0" y="376.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#2a78d6">1/8</text><text x="40.0" y="474.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#2b2f3a">1M</text><text x="40.0" y="498.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">GLM-5.2 기준</text><text x="284.0" y="454.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="end" font-weight="400" fill="#6b7080">기준</text><rect x="300.0" y="432.0" width="630.0" height="32.0" rx="2" fill="#9c9a92" stroke="none" stroke-width="1.5"/><rect x="931.0" y="432.0" width="70.0" height="32.0" rx="2" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="1012.0" y="454.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#2b2f3a">104.7 GB</text><text x="284.0" y="496.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="end" font-weight="700" fill="#2b2f3a">HiSparse</text><rect x="300.0" y="474.0" width="2.5" height="32.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="303.5" y="474.0" width="70.0" height="32.0" rx="2" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="384.5" y="496.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">10.84 GB  (10%)</text><text x="1300.0" y="496.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#2b2f3a">1/256</text><text x="1450.0" y="496.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#2a78d6">1/10</text><line x1="1230.0" y1="180.0" x2="1230.0" y2="540.0" stroke="#e6e8f1" stroke-width="1" stroke-linecap="round"/><text x="40.0" y="570.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">→ HiSparse 이후 요청당 HBM의 대부분은 색인 키 (128K 78% · 1M 97%) — 다음 용량 한계는 토큰당 색인 바이트</text><text x="40.0" y="600.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">논문의 '약 1/30'(128K)은 KV만 비교한 값 · 1M은 같은 차원의 GLM-5.2 기준(GLM-5.1 지원 길이 약 200K) · 색인 키 scale(4 B) · 메타데이터 제외</text></svg>