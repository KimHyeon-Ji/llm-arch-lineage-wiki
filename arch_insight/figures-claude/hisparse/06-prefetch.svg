t-weight="400" fill="#6b7080">정확한 prefetch</text><rect x="1200.0" y="698.0" width="170.2" height="30.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="1380.2" y="720.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">11.2 ms  (−49%)</text><text x="40.0" y="816.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">→ Resolve 자체 비용은 측정 불가 수준 (동시 8: IO 없는 상한 TPOT 24.1 ms ≈ 기준 24.8 ms) — 남은 overhead는 전부 host IO</text><text x="40.0" y="846.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">prefetch는 전송 시점만 앞당길 뿐 양은 그대로 — 고부하에서는 demand miss와 같은 host 링크를 경쟁 (동시 256에서 11.2 ms 잔존)</text><text x="40.0" y="872.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">색인 공유가 없는 모델의 추측 prefetch(ℓ층 선택을 ℓ+1층 힌트로 사용)는 hit률만 소폭 상승, 처리량 변화 없음</text></svg>