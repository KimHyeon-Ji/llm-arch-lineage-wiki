<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 690" width="1600" height="690"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">GPU 캐시 miss율 — 스텝마다 선택된 2,048줄 중 HBM에 없는 비율</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">GLM-5.1 · k = 2,048 · LongBenchV2 요청 1개(프롬프트 약 10만 토큰) 선택 기록 재생 · 처음 1,000스텝 · 78층 평균 (논문 Fig. 6)</text><text x="40.0" y="128.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">캐시 크기 · 교체 정책</text><text x="440.0" y="128.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">스텝당 miss율</text><text x="1120.0" y="128.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#6b7080">해석</text><line x1="40.0" y1="142.0" x2="1560.0" y2="142.0" stroke="#9aa0b0" stroke-width="1" stroke-linecap="round"/><line x1="440.0" y1="150.0" x2="440.0" y2="582.0" stroke="#e6e8f1" stroke-width="1" stroke-linecap="round"/><text x="440.0" y="606.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#6b7080">0%</text><line x1="640.0" y1="150.0" x2="640.0" y2="582.0" stroke="#e6e8f1" stroke-width="1" stroke-linecap="round"/><text x="640.0" y="606.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#6b7080">10%</text><line x1="840.0" y1="150.0" x2="840.0" y2="582.0" stroke="#e6e8f1" stroke-width="1" stroke-linecap="round"/><text x="840.0" y="606.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#6b7080">20%</text><line x1="1040.0" y1="150.0" x2="1040.0" y2="582.0" stroke="#e6e8f1" stroke-width="1" stroke-linecap="round"/><text x="1040.0" y="606.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#6b7080">30%</text><text x="40.0" y="182.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">B = 2,048 (= k)</text><text x="40.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">이번 top-k만 보관</text><rect x="440.0" y="168.0" width="600.0" height="34.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1.5"/><text x="1052.0" y="192.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">30%</text><text x="1120.0" y="192.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">연속 스텝 선택의 약 70%가 직전과 겹침</text><line x1="40.0" y1="222.0" x2="1560.0" y2="222.0" stroke="#e6e8f1" stroke-width="1" stroke-linecap="round"/><text x="40.0" y="254.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">B = 4,096 · FIFO</text><text x="40.0" y="278.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">먼저 들어온 줄부터 교체</text><rect x="440.0" y="240.0" width="344.0" height="34.0" rx="3" fill="#c3c7d2" stroke="none" stroke-width="1.5"/><text x="796.0" y="264.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">17.2%</text><text x="1120.0" y="264.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">여유 슬롯(B &gt; k)만으로 miss 약 절반</text><text x="40.0" y="326.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">B = 4,096 · random</text><text x="40.0" y="350.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">무작위 교체</text><rect x="440.0" y="312.0" width="322.0" height="34.0" rx="3" fill="#c3c7d2" stroke="none" stroke-width="1.5"/><text x="774.0" y="336.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">16.1%</text><text x="1120.0" y="336.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">정책 차이보다 캐시 크기 효과가 큼</text><rect x="30.0" y="368.0" width="1540.0" height="68.0" rx="8" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><text x="40.0" y="398.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">B = 4,096 · LRU</text><text x="40.0" y="422.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">HiSparse 기본</text><rect x="440.0" y="384.0" width="268.0" height="34.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="720.0" y="408.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">13.4%</text><text x="1120.0" y="408.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">hit 87% — 스텝 · 층당 약 270줄만 host 전송</text><text x="40.0" y="470.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">B = 4,096 · Bélády</text><text x="40.0" y="494.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">미래를 아는 사후 최적 (구현 불가)</text><rect x="440.0" y="456.0" width="164.0" height="34.0" rx="3" fill="#ffffff" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 4"/><text x="616.0" y="480.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">8.2%</text><text x="1120.0" y="480.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">LRU가 최적의 추세를 따라감 — 최근성이 좋은 예측 지표</text><line x1="40.0" y1="510.0" x2="1560.0" y2="510.0" stroke="#e6e8f1" stroke-width="1" stroke-linecap="round"/><text x="40.0" y="542.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">B = 8,192 · LRU</text><text x="40.0" y="566.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">캐시 2배</text><rect x="440.0" y="528.0" width="134.0" height="34.0" rx="3" fill="#184f95" stroke="none" stroke-width="1.5"/><text x="586.0" y="552.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">6.7%</text><text x="1120.0" y="552.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">캐시 2배 → miss 절반 · 대신 요청당 HBM 2배</text><text x="40.0" y="650.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#2b2f3a">→ 최근 선택된 KV가 다시 선택됨 — 캐시는 '이번 top-k 대기소'가 아니라 k보다 큰 hot KV 캐시로 운영</text></svg>