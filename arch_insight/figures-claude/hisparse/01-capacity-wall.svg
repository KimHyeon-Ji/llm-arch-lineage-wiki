<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 640" width="1700" height="640"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">기준 SGLang의 한계 — 연산보다 HBM 용량이 먼저, 단순 offload는 host 링크가 먼저 바닥</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">GLM-5.1-FP8 · 8 × H200 · KV BF16 · 논문 §1 · §2.2 · §2.3 (오른쪽 HiSparse 줄은 miss율 13.4%를 적용한 계산값)</text><text x="40.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#2b2f3a">① HBM 용량 — 요청당 KV cache와 동시 요청 수</text><text x="40.0" y="162.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">가중치 · activation · CUDA graph 뒤 남는 KV 여유 약 240 GB</text><text x="40.0" y="230.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#2b2f3a">32K + 8K</text><rect x="170.0" y="208.0" width="11.6" height="34.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1.5"/><text x="191.6" y="231.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">4 GB</text><text x="636.0" y="224.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#2b2f3a">동시 약 60개</text><text x="636.0" y="250.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">여기서 처리량 정체</text><text x="40.0" y="322.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#2b2f3a">128K</text><rect x="170.0" y="300.0" width="38.1" height="34.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1.5"/><text x="218.1" y="323.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">13.09 GB</text><text x="636.0" y="316.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#2b2f3a">약 15개</text><text x="636.0" y="342.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">32K 대비 1/4</text><text x="40.0" y="414.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#2b2f3a">1M</text><rect x="170.0" y="392.0" width="320.0" height="34.0" rx="3" fill="#9c9a92" stroke="none" stroke-width="1.5"/><polygon points="490.0,392 504.0,409 490.0,426" fill="#9c9a92"/><text x="514.0" y="415.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">100 GB 이상</text><text x="636.0" y="408.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" text-anchor="start" font-weight="700" fill="#eb6834">수용 불가</text><text x="636.0" y="434.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">KV만으로 H200 1장 HBM의 70% 이상</text><text x="40.0" y="500.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">구조적 원인 — top-k 위치는 매 스텝 · 층마다 바뀌어, 지금 안 읽는 KV도 HBM에 상주</text><text x="40.0" y="526.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">매 스텝 읽기는 2,048줄에 비례 · HBM 점유는 전체 길이에 비례</text><line x1="880.0" y1="120.0" x2="880.0" y2="560.0" stroke="#e6e8f1" stroke-width="2" stroke-linecap="round"/><text x="920.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#2b2f3a">② 단순 offload — host 링크 수요 (GPU 1장)</text><text x="920.0" y="162.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#6b7080">매 스텝 선택된 KV를 전부 host에서 가져올 때 · TPOT 30 ms 가정</text><text x="920.0" y="206.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">요청당 토큰마다 약 200 MB (2,048줄 × 토큰당 KV 약 100 KB) → 요청당 약 7 GB/s · 막대 1칸 = 요청 1개</text><text x="920.0" y="258.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">캐시 없음</text><text x="920.0" y="282.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">선택 KV 전부 전송</text><rect x="1100.0" y="240.0" width="36.2" height="40.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1138.2" y="240.0" width="36.2" height="40.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1176.4" y="240.0" width="36.2" height="40.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1214.5" y="240.0" width="36.2" height="40.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1252.7" y="240.0" width="36.2" height="40.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1290.9" y="240.0" width="36.2" height="40.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1329.1" y="240.0" width="36.2" height="40.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1367.3" y="240.0" width="36.2" height="40.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1405.4" y="240.0" width="36.2" height="40.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1443.6" y="240.0" width="36.2" height="40.0" rx="2" fill="#f8c6b1" stroke="none" stroke-width="1.5"/><rect x="1481.8" y="240.0" width="36.2" height="40.0" rx="2" fill="#f