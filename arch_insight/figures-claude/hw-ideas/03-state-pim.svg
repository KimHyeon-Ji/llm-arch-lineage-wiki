<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 560" width="1700" height="560"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">③ state 갱신 PIM — 매 스텝 전부 읽고 덮어쓰는 state를 메모리 안에서 갱신</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">Qwen3.8-Flash-Next (DeltaNet 36층 + QSA 12층) · 요청 1개 · 디코드 1스텝 · state FP32 · KV BF16 (덱 4.1 계산값)</text><rect x="40.0" y="115.0" width="6.0" height="28.0" rx="2" fill="#4a5573" stroke="none" stroke-width="1.5"/><text x="56.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#4a5573">구조 특징</text><text x="142.8" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">state는 고정 크기지만 매 스텝 전부 읽고 같은 양을 씀</text><rect x="40.0" y="170.0" width="16.0" height="16.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1.5"/><text x="64.0" y="184.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">state 읽기</text><rect x="164.2" y="170.0" width="16.0" height="16.0" rx="3" fill="#a9e0cb" stroke="none" stroke-width="1.5"/><text x="188.2" y="184.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">state 쓰기</text><rect x="288.4" y="170.0" width="16.0" height="16.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="312.4" y="184.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">KV 읽기</text><rect x="389.5" y="170.0" width="16.0" height="16.0" rx="3" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="413.5" y="184.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#2b2f3a">색인 키 읽기</text><text x="40.0" y="240.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">32K</text><rect x="130.0" y="218.0" width="148.1" height="34.0" rx="2" fill="#1baf7a" stroke="none" stroke-width="1.5"/><rect x="280.1" y="218.0" width="148.1" height="34.0" rx="2" fill="#a9e0cb" stroke="none" stroke-width="1.5"/><rect x="430.2" y="218.0" width="63.4" height="34.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="495.6" y="218.0" width="30.7" height="34.0" rx="2" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="538.3" y="241.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">306 MB · state 75%</text><text x="40.0" y="302.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">128K</text><rect x="130.0" y="280.0" width="148.1" height="34.0" rx="2" fill="#1baf7a" stroke="none" stroke-width="1.5"/><rect x="280.1" y="280.0" width="148.1" height="34.0" rx="2" fill="#a9e0cb" stroke="none" stroke-width="1.5"/><rect x="430.2" y="280.0" width="63.4" height="34.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="495.6" y="280.0" width="128.9" height="34.0" rx="2" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="636.5" y="303.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">382 MB · state 60%</text><text x="40.0" y="372.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">state 115 MB(36층 × 3.2 MB)를 매 스텝 전부 읽고 덮어씀 — KV · 색인 추가 쓰기는 25 KB</text><text x="40.0" y="398.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">갱신은 원소 단위 곱 · 합 (바이트당 연산 적음) · 요청마다 따로라 동시 요청 수만큼 증가</text><text x="40.0" y="470.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">→ 연산보다 데이터 이동이 대부분인 연산 — state를 연산기로 옮기는 비용이 핵심</text><polygon points="800,291 854,291 854,280 872,300 854,320 854,309 800,309" fill="#4a5573"/><text x="830.0" y="270.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#4a5573">그래서</text><rect x="900.0" y="115.0" width="6.0" height="28.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="916.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2a78d6">아이디어</text><text x="994.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">state를 메모리 밖으로 꺼내지 않고 PIM 안에서 갱신</text><text x="900.0" y="192.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#6b7080">기존 — GPU에서 갱신</text><rect x="900.0" y="206.0" width="210.0" height="74.0" rx="8" fill="#ffffff" stroke="#9aa0b0" stroke-width="1.2"/><text x="1005.0" y="250.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#2b2f3a">HBM — state</text><rect x="1450.0" y="206.0" width="210.0" height="74.0" rx="8" fill="#ffffff" stroke="#9aa0b0" stroke-width="1.2"/><text x="1555.0" y="250.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#2b2f3a">GPU — 갱신 연산</text><line x1="1116.0" y1="228.0" x2="1430.0" y2="228.0" stroke="#1baf7a" stroke-width="7" stroke-linecap="round"/><polygon points="1444,228 1426,217 1426,239" fill="#1baf7a"/><line x1="1444.0" y1="262.0" x2="1130.0" y2="262.0" stroke="#a9