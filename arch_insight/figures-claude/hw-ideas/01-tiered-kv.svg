<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 530" width="1700" height="530"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">① 계층형 KV 배치 — 안 읽는 KV는 큰 용량 계층으로, 다시 고를 KV만 HBM에</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">DeepSeek-V3.2 · 128K · 요청 1개 · KV FP8 656 B/줄 (덱 5.1) · 스텝 간 재사용 = GLM-5.1 측정 (HiSparse)</text><rect x="40.0" y="115.0" width="6.0" height="28.0" rx="2" fill="#4a5573" stroke="none" stroke-width="1.5"/><text x="56.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#4a5573">구조 특징</text><text x="142.8" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">KV cache는 크지만 매 스텝 일부만 읽고, 고른 위치는 반복</text><text x="40.0" y="196.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">매 스텝 읽는 KV</text><text x="40.0" y="218.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">요청당 5.24 GB 중 1.6%</text><rect x="240.0" y="178.0" width="520.0" height="36.0" rx="3" fill="#dddcd6" stroke="none" stroke-width="1.5"/><rect x="606.2" y="178.0" width="2.2" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="402.5" y="178.0" width="2.2" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="671.2" y="178.0" width="2.2" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="458.8" y="178.0" width="2.2" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="240.0" y="234.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">진한 선 = 이번 스텝에 읽는 KV (폭 비율 그대로)</text><text x="40.0" y="291.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">스텝 t</text><rect x="240.0" y="270.0" width="520.0" height="30.0" rx="3" fill="#dddcd6" stroke="none" stroke-width="1.5"/><rect x="273.4" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="289.0" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="330.6" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="361.8" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="419.0" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="502.2" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="564.6" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="606.2" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="689.4" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="715.4" y="270.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="40.0" y="337.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">스텝 t+1</text><rect x="240.0" y="316.0" width="520.0" height="30.0" rx="3" fill="#dddcd6" stroke="none" stroke-width="1.5"/><rect x="273.4" y="316.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="289.0" y="316.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="361.8" y="316.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="419.0" y="316.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="564.6" y="316.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="606.2" y="316.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="715.4" y="316.0" width="6.0" height="30.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="257.8" y="316.0" width="6.0" height="30.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="445.0" y="316.0" width="6.0" height="30.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="538.6" y="316.0" width="6.0" height="30.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="240.0" y="380.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">선택 위치만 확대 · 파랑 = 직전 스텝과 같은 위치, 주황 = 새로 고른 위치</text><text x="40.0" y="418.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">연속 스텝 top-k 약 70% 겹침 → 최근 고른 KV를 두는 LRU 캐시면 hit 87%</text><text x="40.0" y="470.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">→ 안 읽는 98%가 HBM을 차지해 동시 요청 수를 결정 — HBM에 있을 필요가 없음</text><polygon points="800,291 854,291 854,280 872,300 854,320 854,309 800,309" fill="#4a5573"/><text x="830.0" y="270.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#4a5573">그래서</text><rect x="900.0" y="115.0" width="6.0" height="28.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="916.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2a78d6">아이디어</text><text x="994.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">HBM은 hot 캐시, 전체 KV는 큰 용량 계층</text><rect x="900.0" y="168.0" width="760.0" height="102.0" rx="8" fill="#ffffff" stroke="#9aa0b0" stroke-width="1.2"/><text x="916.0" y="194.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">GPU HBM</text><rect x="916.0" y="210.0" width="110.0" height="46.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="1044.0" y="230.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">hot 캐시 — 최근 고른 KV만</text><text x="1044.0" y="252.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">요청 · 층마다 2k ~ 4k줄 · 길이와 무관</text><rect x="900.0" y="330.0" width="760.0" height="102.0" rx="8" fill="#ffffff" stroke="#9aa0b0" stroke-width="1.2"/><text x="960.0" y="356.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">Host DRAM · CXL 메모리 — 전체 KV (용량 계층)</text><rect x="916.0" y="372.0" width="728.0" height="44.0" rx="3" fill="#dddcd6" stroke="none" stroke-width="1.5"/><rect x="1212.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1112.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1324.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1088.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="998.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1068.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1558.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1380.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1054.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="1060.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="926.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><rect x="930.0" y="372.0" width="2.4" height="44.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1.5"/><line x1="938.0" y1="368.0" x2="938.0" y2="262.0" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/><polygon points="938.0,262.0 943.2,272.8 932.8,272.8" fill="#eb6834"/><text x="960.0" y="296.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#eb6834">miss만 전송 — 선택의 약 13%</text><text x="960.0" y="318.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">새 KV는 host로 write-through</text><text x="900.0" y="470.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">효과: 요청당 HBM이 길이와 무관 → 동시 요청 증가 (HiSparse 장문 처리량 2.1 ~ 4.7×)</text><text x="900.0" y="498.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">필요 HW: host · CXL 용량 · CPU–GPU 링크 대역폭 (전송 1회 PCIe 112 µs → NVLink-C2C 29 µs)</text></svg>