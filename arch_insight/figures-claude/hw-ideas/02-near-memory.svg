<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 570" width="1700" height="570"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#2b2f3a">② 메모리 근처 선택 · attention — 많이 읽고 적게 내보내는 단계를 메모리 옆으로</text><text x="40.0" y="78.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#6b7080">DeepSeek-V3.2(DSA) 층 1개 · 128K · 디코드 1스텝 · KV BF16 1,152 B · 색인 키 132 B · 위치 int32 (덱 2.3 · 3.2 계산값)</text><rect x="40.0" y="115.0" width="6.0" height="28.0" rx="2" fill="#4a5573" stroke="none" stroke-width="1.5"/><text x="56.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#4a5573">구조 특징</text><text x="142.8" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">색인 훑기는 많이 읽고 적게 내보내고, gather는 작고 흩어짐</text><text x="40.0" y="190.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">① 색인 키 훑기</text><text x="40.0" y="212.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">매 스텝 전부 · 순차 읽기</text><rect x="250.0" y="172.0" width="500.0" height="36.0" rx="3" fill="#b7d3f6" stroke="none" stroke-width="1.5"/><text x="264.0" y="196.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">17 MB 읽기</text><text x="40.0" y="266.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">② top-k</text><text x="40.0" y="288.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">출력 = 위치 2,048개</text><rect x="250.0" y="248.0" width="3.0" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="264.0" y="272.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">8 KB 출력</text><text x="40.0" y="342.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">③ KV gather</text><text x="40.0" y="364.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">1.2 KB 조각 2,048개</text><rect x="250.0" y="324.0" width="500.0" height="36.0" rx="3" fill="#dddcd6" stroke="none" stroke-width="1.5"/><rect x="662.0" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="728.9" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="619.7" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="573.9" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="514.1" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="535.2" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="454.2" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="605.6" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="679.6" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="739.4" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="489.4" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="602.1" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="471.8" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="623.2" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="528.2" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="654.9" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="644.4" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="524.6" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="690.1" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="507.0" y="324.0" width="3.4" height="36.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="264.0" y="348.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">2.4 MB · 흩어진 읽기</text><text x="40.0" y="418.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">→ 17 MB를 읽어 8 KB만 다음 단계로 — 메모리 옆에서 처리할수록 이동량 감소</text><text x="40.0" y="446.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">gather는 작은 조각 · top-k 뒤에야 정해지는 위치라 GPU 메모리 효율이 낮음 (덱 2.3)</text><text x="40.0" y="472.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">색인 연산 강도: 키 1 B당 DSA 124 FLOP · QSA 4 FLOP (덱 3.2 · 부록 A)</text><polygon points="800,291 854,291 854,280 872,300 854,320 854,309 800,309" fill="#4a5573"/><text x="830.0" y="270.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#4a5573">그래서</text><rect x="900.0" y="115.0" width="6.0" height="28.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="916.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2a78d6">아이디어</text><text x="994.0" y="136.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#2b2f3a">메모리 장치 안에서 고르고 모아, 결과만 GPU로</text><rect x="900.0" y="168.0" width="530.0" height="274.0" rx="10" fill="#f6f7fb" stroke="#dfe2ec" stroke-width="1.2"/><text x="918.0" y="196.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">메모리 장치 (PNM · CXL 연산 메모리)</text><rect x="918.0" y="212.0" width="494.0" height="48.0" rx="4" fill="#dddcd6" stroke="none" stroke-width="1.5"/><text x="934.0" y="242.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#2b2f3a">KV cache · 색인 키 (요청 전체)</text><line x1="1165.0" y1="264.0" x2="1165.0" y2="296.0" stroke="#4a5573" stroke-width="3" stroke-linecap="round"/><polygon points="1165.0,296.0 1159.8,285.2 1170.2,285.2" fill="#4a5573"/><text x="1180.0" y="286.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">내부 대역폭으로 훑기</text><rect x="918.0" y="302.0" width="494.0" height="122.0" rx="6" fill="#ffffff" stroke="#dfe2ec" stroke-width="1.2"/><rect x="918.0" y="302.0" width="7.0" height="122.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="940.0" y="334.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#2b2f3a">근처 연산기</text><text x="940.0" y="362.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#2b2f3a">색인 훑기 · top-k · KV gather</text><text x="940.0" y="390.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#6b7080">NELSSA는 sparse attention까지 장치 안에서 실행</text><rect x="1500.0" y="250.0" width="160.0" height="100.0" rx="8" fill="#ffffff" stroke="#9aa0b0" stroke-width="1.2"/><text x="1580.0" y="308.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#2b2f3a">GPU</text><line x1="1434.0" y1="300.0" x2="1494.0" y2="300.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><polygon points="1494.0,300.0 1483.2,305.2 1483.2,294.8" fill="#2a78d6"/><text x="1580.0" y="376.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#2a78d6">선택 KV 2.4 MB</text><text x="1580.0" y="396.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7080">또는 attention 출력만</text><text x="900.0" y="480.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#2b2f3a">효과: 긴 요청 decode를 메모리 장치가 분담 — NELSSA decode 처리량 최대 5.5× (SK hynix PNM 실장치)</text><text x="900.0" y="508.0" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#6b7080">필요 HW: 메모리 근처 저정밀 연산 · top-k · 작은 단위 gather</text></svg>