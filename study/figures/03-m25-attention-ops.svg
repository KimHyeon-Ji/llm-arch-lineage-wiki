<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 920" width="1560" height="920"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">M2.5 attention의 텐서 연산 — 층 하나, 토큰 하나를 만들 때</text><rect x="960" y="31" width="16" height="16" rx="4" fill="#4d9a56" stroke="none" stroke-width="2"/><text x="984" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="600" fill="#343a4d">행렬곱</text><rect x="1150" y="31" width="16" height="16" rx="4" fill="#7b8196" stroke="none" stroke-width="2"/><text x="1174" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="600" fill="#343a4d">원소별 연산</text><rect x="1340" y="31" width="16" height="16" rx="4" fill="#c2479c" stroke="none" stroke-width="2"/><text x="1364" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="600" fill="#343a4d">행렬곱이 아닌 일</text><text x="40" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#343a4d">① projection</text><text x="40" y="142" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">가중치를 읽는다</text><text x="40" y="162" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">S와 무관</text><rect x="200" y="116" width="120" height="24" rx="5" fill="#eff0f6" stroke="#d3d6e2" stroke-width="1.8"/><text x="260.0" y="162" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">x  1 × 3072</text><path d="M326,128 C390,128 390,102 462,102" fill="none" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="470" y="88" width="300" height="28" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="620.0" y="107.4" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">q</text><text x="784" y="107" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">× W_Q  →  1 × 6144 (48 × 128)</text><path d="M326,128 C390,128 390,162 462,162" fill="none" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="470" y="148" width="100" height="28" rx="5" fill="#f8e6f1" stroke="#c2479c" stroke-width="1.8"/><text x="520.0" y="167.4" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">k</text><text x="584" y="167" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">× W_K  →  1 × 1024 (8 × 128)</text><path d="M326,128 C390,128 390,222 462,222" fill="none" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><rect x="470" y="208" width="100" height="28" rx="5" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.8"/><text x="520.0" y="227.4" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">v</text><text x="584" y="227" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">× W_V  →  1 × 1024 (8 × 128)</text><rect x="339.75" y="256" width="96.5" height="24" rx="12" fill="#4d9a56" stroke="none" stroke-width="2"/><text x="388" y="273" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">행렬 × 벡터</text><text x="1040" y="174" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">q 폭(6,144)이 d(3,072)의 두 배다 — 헤드 수 × 헤드 차원이 d보다 크다</text><text x="1040" y="198" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">가중치: W_Q 3072×6144 · W_K, W_V 3072×1024 · W_O 6144×3072</text><text x="1040" y="222" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">층당 44.0M 파라미터 (FP8 체크포인트)</text><line x1="40" y1="290" x2="1520" y2="290" stroke="#e3e5ee" stroke-width="2" stroke-dasharray="6 6"/><text x="40" y="352" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#343a4d">② QK-norm</text><text x="40" y="376" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">RoPE까지</text><text x="40" y="396" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">원소별</text><rect x="200" y="326" width="300" height="40" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="350.0" y="351.4" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">q  1 × 6144</text><line x1="508" y1="346" x2="680" y2="346" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="594.0" y="334" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#343a4d">RMSNorm(6144 전체)</text><rect x="531.75" y="358" width="124.5" height="24" rx="12" fill="#7b8196" stroke="none" stroke-width="2"/><text x="594.0" y="375" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">원소별 + 합 1번</text><rect x="688" y="326" width="300" height="40" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="838.0" y="351.4" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">q̂  1 × 6144</text><line x1="996" y1="346" x2="1120" y2="346" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="1058.0" y="334" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#343a4d">48 × 128로</text><text x="1058" y="378" font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="middle" font-weight="400" fill="#7b8196">reshape</text><rect x="1128" y="326" width="120" height="40" rx="5" fill="#6b4fc8" stroke="none" stroke-width="2"/><rect x="1248" y="326" width="120" height="40" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="1188" y="352" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#ffffff">RoPE 64</text><text x="1308" y="352" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">통과 64</text><text x="1248" y="390" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">헤드마다 앞 64차원만 회전 (θ = 5,000,000)</text><text x="200" y="414" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">k도 같다: RMSNorm(1024 전체) → 8 × 128 → 앞 64만 RoPE</text><text x="200" y="438" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#c2479c">norm을 헤드마다가 아니라 층 전체 벡터에 건다 — 헤드를 TP로 나누면 제곱합을 GPU끼리 all-reduce 해야 한다</text><line x1="40" y1="470" x2="1520" y2="470" stroke="#e3e5ee" stroke-width="2" stroke-dasharray="6 6"/><text x="40" y="526" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#343a4d">③ 쓰기</text><text x="40" y="550" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">한 줄 붙인다</text><rect x="200" y="510" width="100" height="28" rx="5" fill="#f8e6f1" stroke="#c2479c" stroke-width="1.8"/><text x="250.0" y="529.4" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">k̂</text><rect x="320" y="510" width="100" height="28" rx="5" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.8"/><text x="370.0" y="529.4" font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle" font-weight="400" fill="#343a4d">v</text><line x1="428" y1="524" x2="560" y2="524" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="494.0" y="512" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#343a4d">끝에 붙인다</text><rect x="470.0" y="536" width="48" height="24" rx="12" fill="#c2479c" stroke="none" stroke-width="2"/><text x="494.0" y="553" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">쓰기</text><rect x="568" y="496" width="300" height="56" rx="5" fill="#f8e6f1" stroke="#c2479c" stroke-width="1.8"/><line x1="569" y1="508" x2="867" y2="508" stroke="#c2479c" stroke-width="0.8"/><line x1="569" y1="520" x2="867" y2="520" stroke="#c2479c" stroke-width="0.8"/><line x1="569" y1="532" x2="867" y2="532" stroke="#c2479c" stroke-width="0.8"/><rect x="569" y="541" width="298" height="10" rx="0" fill="#c2479c" stroke="none" stroke-width="2"/><text x="718" y="574" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">K 캐시  8 × S × 128</text><rect x="898" y="496" width="300" height="56" rx="5" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.8"/><line x1="899" y1="508" x2="1197" y2="508" stroke="#4d9a56" stroke-width="0.8"/><line x1="899" y1="520" x2="1197" y2="520" stroke="#4d9a56" stroke-width="0.8"/><line x1="899" y1="532" x2="1197" y2="532" stroke="#4d9a56" stroke-width="0.8"/><rect x="899" y="541" width="298" height="10" rx="0" fill="#4d9a56" stroke="none" stroke-width="2"/><text x="1048" y="574" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">V 캐시  8 × S × 128</text><text x="1240" y="512" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">토큰당 2 × 8 × 128 × 2 B</text><text x="1240" y="536" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">= 4,096 B · 62층이면 248 KiB</text><line x1="40" y1="604" x2="1520" y2="604" stroke="#e3e5ee" stroke-width="2" stroke-dasharray="6 6"/><text x="40" y="666" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#343a4d">④ 읽기</text><text x="40" y="690" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">캐시 전체를</text><text x="40" y="710" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">두 번 읽는다</text><rect x="200" y="640" width="90" height="64" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="245.0" y="677.76" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">q</text><text x="245.0" y="726" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">8 × 6 × 128</text><text x="245.0" y="746" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#7b8196">KV 헤드별로 6개씩</text><text x="308" y="680" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="middle" font-weight="400" fill="#343a4d">×</text><rect x="326" y="644" width="200" height="56" rx="5" fill="#f8e6f1" stroke="#c2479c" stroke-width="1.8"/><text x="426.0" y="677.76" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">Kᵀ</text><text x="426.0" y="722" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">8 × 128 × S</text><text x="426.0" y="742" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#7b8196">K 캐시 전체</text><text x="544" y="680" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="middle" font-weight="400" fill="#343a4d">=</text><rect x="562" y="640" width="170" height="64" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="647.0" y="677.76" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">점수</text><text x="647.0" y="726" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">8 × 6 × S</text><line x1="740" y1="672" x2="840" y2="672" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="790.0" y="660" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#343a4d">softmax</text><rect x="759.5" y="684" width="61" height="24" rx="12" fill="#7b8196" stroke="none" stroke-width="2"/><text x="790.0" y="701" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">원소별</text><rect x="848" y="640" width="170" height="64" rx="5" fill="#eceafa" stroke="#6b4fc8" stroke-width="1.8"/><text x="933.0" y="677.76" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">p</text><text x="933.0" y="726" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">8 × 6 × S</text><text x="933.0" y="746" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#7b8196">/√128 후 S 방향</text><text x="1036" y="680" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" text-anchor="middle" font-weight="400" fill="#343a4d">×</text><rect x="1054" y="644" width="130" height="56" rx="5" fill="#e4f0e4" stroke="#4d9a56" stroke-width="1.8"/><text x="1119.0" y="677.76" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">V</text><text x="1119.0" y="722" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">8 × S × 128</text><text x="1119.0" y="742" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#7b8196">V 캐시 전체</text><line x1="1192" y1="672" x2="1272" y2="672" stroke="#5d6377" stroke-width="2.2" marker-end="url(#ah)"/><text x="1232.0" y="660" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#343a4d">× W_O</text><rect x="1280" y="652" width="110" height="40" rx="5" fill="#eff0f6" stroke="#d3d6e2" stroke-width="1.8"/><text x="1335.0" y="677.76" font-family="Consolas,'Courier New',monospace" font-size="16" text-anchor="middle" font-weight="400" fill="#343a4d">y</text><text x="1335.0" y="714" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="middle" font-weight="400" fill="#7b8196">1 × 3072</text><rect x="259.75" y="764" width="96.5" height="24" rx="12" fill="#4d9a56" stroke="none" stroke-width="2"/><text x="308" y="781" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">행렬 × 행렬</text><rect x="987.75" y="764" width="96.5" height="24" rx="12" fill="#4d9a56" stroke="none" stroke-width="2"/><text x="1036" y="781" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">행렬 × 행렬</text><rect x="40" y="820" width="1480" height="76" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="850" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">48헤드가 8개 KV 헤드를 6개씩 나눠 읽는다. 읽는 양은 KV 헤드 수 × S — 컨텍스트에 그대로 비례한다.</text><text x="64" y="874" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">128K에서 토큰 하나당 62층 × 4,096 B × 131,072 ≈ 33.3 GB를 읽는다</text></svg>