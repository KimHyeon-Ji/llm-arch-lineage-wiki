<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 760" width="1560" height="760"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6377"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="44" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#6b4fc8">KV cache — 토큰 하나가 남기는 양, 토큰 하나를 만들 때 읽는 양 (전 층, BF16)</text><text x="40" y="104" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#343a4d">저장 — 토큰 하나</text><text x="40" y="164" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">M2.5</text><rect x="160" y="136" width="188.90625" height="40" rx="4" fill="#8f79d8" stroke="none" stroke-width="2"/><text x="254.453125" y="162" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">K, V  62층 · 248 KiB</text><text x="362.90625" y="162" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">248.0 KiB</text><text x="40" y="234" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">M3</text><rect x="160" y="206" width="91.40625" height="40" rx="4" fill="#8f79d8" stroke="none" stroke-width="2"/><rect x="253.40625" y="206" width="10.8544921875" height="40" rx="4" fill="#3b7dd8" stroke="none" stroke-width="2"/><text x="278.2607421875" y="232" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">134.2 KiB</text><text x="376.2607421875" y="232" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#3b7dd8">← 색인 키 14.25 KiB</text><text x="160" y="298" font-family="Consolas,'Courier New',monospace" font-size="14" text-anchor="start" font-weight="400" fill="#7b8196">M2.5: 62 × 2 × 8 × 128 × 2 B   ·   M3: 60 × 2 × 4 × 128 × 2 B + 57 × 128 × 2 B</text><line x1="40" y1="330" x2="1520" y2="330" stroke="#e3e5ee" stroke-width="2" stroke-dasharray="6 6"/><text x="40" y="376" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#343a4d">읽기 — 토큰 하나를 만들 때</text><text x="40" y="432" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">M2.5 · 128K</text><rect x="200" y="404" width="1057.3198902211764" height="40" rx="4" fill="#8f79d8" stroke="none" stroke-width="2"/><text x="728.6599451105882" y="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">K, V 전부 · 62층 · 33.3 GB</text><text x="1271.3198902211764" y="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">33.3 GB</text><text x="40" y="508" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">M3 · 128K</text><rect x="200" y="480" width="25.580319924705883" height="40" rx="4" fill="#8f79d8" stroke="none" stroke-width="2"/><rect x="227.5803199247059" y="480" width="60.75325982117647" height="40" rx="4" fill="#3b7dd8" stroke="none" stroke-width="2"/><rect x="290.3335797458824" y="480" width="7.594157477647059" height="40" rx="4" fill="#e0a030" stroke="none" stroke-width="2"/><text x="311.92773722352945" y="506" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">3.0 GB</text><text x="399.92773722352945" y="506" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">full 3층 K, V 805 MB  ·  색인 키 · 57층 1.9 GB  ·  고른 블록 K, V · 57층 239 MB</text><text x="40" y="584" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#343a4d">M3 · 1M</text><rect x="200" y="556" width="204.64255939764706" height="40" rx="4" fill="#8f79d8" stroke="none" stroke-width="2"/><text x="302.32127969882356" y="582" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">full 3층 K, V · 6.4 GB</text><rect x="406.64255939764706" y="556" width="486.02607856941177" height="40" rx="4" fill="#3b7dd8" stroke="none" stroke-width="2"/><text x="649.655598682353" y="582" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">색인 키 · 57층 · 15.3 GB</text><rect x="894.6686379670589" y="556" width="7.594157477647059" height="40" rx="4" fill="#e0a030" stroke="none" stroke-width="2"/><text x="916.262795444706" y="582" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#343a4d">22.0 GB</text><text x="1004.262795444706" y="582" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#7b8196">full 3층 K, V 6.4 GB  ·  색인 키 · 57층 15.3 GB  ·  고른 블록 K, V · 57층 239 MB</text><text x="200" y="650" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#7b8196">M2.5의 최대 길이는 196,608이라 1M 행이 없다. 같은 128K에서 M3는 M2.5의 약 1/11을 읽는다.</text><rect x="40" y="680" width="1480" height="56" rx="10" fill="#f6f5fd" stroke="#d9d2f3" stroke-width="1.5"/><text x="64" y="714" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#343a4d">M3가 길게 읽는 것은 본 KV가 아니라 색인 키(57층 × 256 B × S)와 full 3층이다. 본 KV 읽기는 S와 무관하게 약 239 MB다.</text></svg>